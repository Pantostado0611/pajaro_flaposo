<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Actualizador</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg: #05050f; --lado: #0b0b18; --barra: #111126; --border: #2a2a4a; --yellow: #ffe600; --cyan: #00f0ff; --pink: #ff3c8e;
    --verde: #3c8527; --verde-borde: #1f4a14; --verde-luz: #52a535; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: #ddd; font-family: 'Press Start 2P', monospace; height: 100vh; overflow: hidden; user-select: none;
    display: grid; grid-template-columns: 240px 1fr; }

  /* ── barra lateral: los juegos ── */
  aside { background: var(--lado); border-right: 2px solid var(--border); display: flex; flex-direction: column; }
  .logo { display: flex; align-items: center; gap: 10px; padding: 20px 18px; font-size: 11px; color: var(--yellow); text-shadow: 2px 2px 0 #443300; border-bottom: 2px solid var(--border); }
  .logo img { width: 30px; height: 30px; }
  .juegos { flex: 1; overflow-y: auto; padding: 10px 0; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-left: 4px solid transparent; }
  .item:hover { background: #14142a; }
  .item.activo { background: #1a1a36; border-left-color: var(--cyan); }
  .item .ico { font-size: 26px; width: 34px; text-align: center; }
  .item .nom { font-size: 8px; color: #eee; line-height: 1.6; }
  .item .est { font-size: 6px; color: #777; margin-top: 4px; }
  .item .est.nuevo { color: var(--yellow); }
  .pie { padding: 12px 16px; border-top: 2px solid var(--border); font-size: 6px; color: #555; line-height: 2; }
  .pie a { color: #777; cursor: pointer; text-decoration: underline; }
  .yo-nuevo { font-size: 6px; color: #bff; line-height: 1.9; border: 2px dashed var(--cyan); padding: 8px; margin-bottom: 10px; }
  .yo-nuevo button { margin-top: 6px; width: 100%; font-family: inherit; font-size: 7px; padding: 6px 0; cursor: pointer; background: transparent; border: 2px solid var(--yellow); color: var(--yellow); }

  /* ── el juego elegido: imagen grande y barra de abajo ── */
  main { display: flex; flex-direction: column; min-width: 0; }
  .heroe { flex: 1; position: relative; background-size: cover; background-position: center; overflow: hidden; }
  .heroe::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(5,5,15,.95) 0%, rgba(5,5,15,.25) 45%, rgba(5,5,15,0) 70%); }
  .heroe .grande { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 180px; opacity: .25; }
  .titulo { position: absolute; left: 36px; bottom: 30px; z-index: 1; max-width: 70%; }
  .titulo h1 { font-size: 30px; color: var(--yellow); text-shadow: 4px 4px 0 #000; letter-spacing: 2px; }
  .titulo p { font-size: 9px; color: #ccc; margin-top: 14px; line-height: 1.8; text-shadow: 2px 2px 0 #000; }
  .barra { height: 104px; background: var(--barra); border-top: 2px solid var(--border); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 28px; gap: 20px; }

  /* selector de versiones */
  .selector { position: relative; justify-self: start; }
  .sel { display: flex; align-items: center; gap: 12px; background: #0b0b18; border: 2px solid var(--border); padding: 10px 14px; cursor: pointer; min-width: 230px; color: #ddd; font-family: inherit; }
  .sel:hover { border-color: #4a4a7a; }
  .sel .cubo { width: 26px; height: 26px; background: linear-gradient(135deg, #6ab04c 0 50%, #7a5230 50%); border: 2px solid #000; flex: none; }
  .sel .txt { text-align: left; flex: 1; }
  .sel .t1 { font-size: 8px; }
  .sel .t2 { font-size: 6px; color: #888; margin-top: 6px; }
  .sel .flecha { font-size: 8px; color: #888; }
  .menu { position: absolute; bottom: calc(100% + 6px); left: 0; min-width: 100%; background: #0b0b18; border: 2px solid #4a4a7a; box-shadow: 4px 4px 0 #000; max-height: 300px; overflow-y: auto; z-index: 5; }
  .op { display: flex; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer; font-size: 7px; }
  .op:hover, .op.elegida { background: #1a1a36; }
  .op .marca { margin-left: auto; font-size: 6px; color: #6ad06a; }

  /* botón grande */
  .accion { width: 280px; height: 64px; font-family: inherit; font-size: 15px; letter-spacing: 2px; color: #fff; cursor: pointer; position: relative; overflow: hidden;
    background: var(--verde); border: 3px solid var(--verde-borde); box-shadow: inset 0 -5px 0 rgba(0,0,0,.3), inset 0 3px 0 var(--verde-luz), 4px 4px 0 #000; text-shadow: 2px 2px 0 rgba(0,0,0,.4); }
  .accion:hover:not(:disabled) { filter: brightness(1.12); }
  .accion:active:not(:disabled) { transform: translateY(2px); }
  .accion:disabled { cursor: default; background: #2a2a3a; border-color: #1a1a24; box-shadow: 4px 4px 0 #000; color: #777; }
  .accion.cargando { background: #1a2a14; color: #fff; }
  .accion .lleno { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--verde); transition: width .2s; }
  .accion span { position: relative; }
  .estado { justify-self: end; text-align: right; font-size: 7px; color: #999; line-height: 2; max-width: 260px; }
  .estado b { color: #6ad06a; font-weight: normal; }
  .estado .error { color: #ff8aa8; }
</style>
</head>
<body>
<aside>
  <div class="logo"><img src="build/icon.png" alt="" onerror="this.remove()">ACTUALIZADOR</div>
  <div class="juegos" id="juegos"></div>
  <div class="pie"><div id="yo-nuevo"></div><span id="yo"></span> · <a id="revisar">revisar</a></div>
</aside>
<main>
  <div class="heroe" id="heroe"><div class="titulo"><h1 id="nombre"></h1><p id="desc">Revisando versiones…</p></div></div>
  <div class="barra">
    <div class="selector" id="selector"></div>
    <button class="accion" id="accion" disabled><span>…</span></button>
    <div class="estado" id="estado"></div>
  </div>
</main>

<script>
const A = window.actualizador;
const $ = s => document.querySelector(s);
const guardado = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} };
let datos = null, actual = guardado('act-juego'), ocupado = null, errorGeneral = null;
const errores = {};
const mb = b => (b / 1048576).toFixed(0) + ' MB';
const elegida = j => guardado('act-version-' + j.id) || 'ultima'; // 'ultima' o un número de versión

async function refrescar() {
  const r = await A.estado();
  if (r.error) { $('#desc').textContent = r.error; return; }
  datos = r.ok; errorGeneral = datos.error;
  if (!datos.juegos.some(j => j.id === actual)) actual = datos.juegos[0].id;
  $('#yo').textContent = 'v' + datos.yo;
  $('#yo-nuevo').innerHTML = datos.nuevoActualizador
    ? `<div class="yo-nuevo">Hay un Actualizador nuevo (v${datos.nuevoActualizador})<button id="me">ACTUALIZAR</button></div>` : '';
  if ($('#me')) $('#me').onclick = async () => {
    $('#me').disabled = true; $('#me').textContent = 'BAJANDO…';
    const res = await A.actualizarme();
    if (res.error) { $('#me').disabled = false; $('#me').textContent = 'REINTENTAR'; }
  };
  pintar();
}

// ── lista de la izquierda ──
function pintar() {
  $('#juegos').innerHTML = '';
  for (const j of datos.juegos) {
    const el = document.createElement('div');
    el.className = 'item' + (j.id === actual ? ' activo' : '');
    const ult = j.versiones && j.versiones[0];
    let est = 'Pronto', nuevo = false;
    if (!j.pronto) {
      if (!j.instalada) est = 'No instalado';
      else if (ult && ult.version !== j.instalada && elegida(j) === 'ultima') { est = 'Actualización lista'; nuevo = true; }
      else est = 'v' + j.instalada;
    }
    el.innerHTML = `<div class="ico">${j.icono}</div><div><div class="nom">${j.nombre}</div><div class="est${nuevo ? ' nuevo' : ''}">${est}</div></div>`;
    el.onclick = () => { if (ocupado) return; actual = j.id; guardado('act-juego', actual); pintar(); };
    $('#juegos').appendChild(el);
  }
  pintarJuego();
}

// ── el juego elegido ──
function pintarJuego() {
  const j = datos.juegos.find(x => x.id === actual);
  const heroe = $('#heroe');
  heroe.style.backgroundImage = j.imagen ? `url("${j.imagen}")` : `radial-gradient(circle at 50% 40%, ${j.color || '#1a1a3a'}, #05050f 75%)`;
  heroe.querySelectorAll('.grande').forEach(e => e.remove());
  if (!j.imagen) heroe.insertAdjacentHTML('afterbegin', `<div class="grande">${j.icono}</div>`);
  $('#nombre').textContent = j.nombre.toUpperCase();
  $('#desc').textContent = j.desc;
  pintarSelector(j);
  pintarBoton(j);
}

function versionMeta(j) {
  const sel = elegida(j), ult = j.versiones[0];
  const v = sel === 'ultima' ? ult : j.versiones.find(x => x.version === sel) || ult;
  return { sel, v, ult };
}

function pintarSelector(j) {
  const cont = $('#selector');
  if (j.pronto || !j.versiones || !j.versiones.length) { cont.innerHTML = ''; return; }
  const { sel, v } = versionMeta(j);
  cont.innerHTML = `<button class="sel" id="sel"><div class="cubo"></div><div class="txt">
      <div class="t1">${sel === 'ultima' ? 'Última versión' : 'Versión ' + v.version}</div>
      <div class="t2">v${v.version} · ${mb(v.tam)}</div></div><div class="flecha">▲</div></button>`;
  $('#sel').onclick = e => {
    e.stopPropagation();
    if (ocupado) return;
    if ($('.menu')) { $('.menu').remove(); return; }
    const ops = [{ k: 'ultima', t: `Última versión (v${j.versiones[0].version})` }, ...j.versiones.map(x => ({ k: x.version, t: 'Versión ' + x.version }))];
    const menu = document.createElement('div');
    menu.className = 'menu';
    for (const o of ops) {
      const inst = o.k === 'ultima' ? j.instalada === j.versiones[0].version : j.instalada === o.k;
      const op = document.createElement('div');
      op.className = 'op' + (o.k === sel ? ' elegida' : '');
      op.innerHTML = `<div class="cubo" style="width:18px;height:18px;background:linear-gradient(135deg,#6ab04c 0 50%,#7a5230 50%);border:2px solid #000"></div>${o.t}${inst ? '<span class="marca">INSTALADA</span>' : ''}`;
      op.onclick = () => { guardado('act-version-' + j.id, o.k); menu.remove(); pintar(); };
      menu.appendChild(op);
    }
    cont.appendChild(menu);
  };
}

function pintarBoton(j) {
  const b = $('#accion'), est = $('#estado');
  b.className = 'accion'; b.onclick = null;
  let txt, quehacer = null, version = null;
  if (j.pronto) { txt = 'PRONTO'; est.innerHTML = 'Todavía no tiene versión para Windows'; }
  else if (!j.versiones.length) { txt = 'SIN VERSIONES'; est.innerHTML = errorGeneral || 'No hay versiones publicadas'; }
  else {
    const { sel, v } = versionMeta(j);
    version = v.version;
    if (j.instalada === v.version) { txt = 'JUGAR'; quehacer = 'jugar'; }
    else if (!j.instalada) { txt = 'INSTALAR'; quehacer = 'instalar'; }
    else if (sel === 'ultima') { txt = 'ACTUALIZAR'; quehacer = 'instalar'; }
    else { txt = 'INSTALAR v' + v.version; quehacer = 'instalar'; }
    est.innerHTML = j.instalada ? `Tienes la <b>v${j.instalada}</b>` : 'No instalado';
    if (quehacer === 'instalar' && j.instalada) est.innerHTML += `<br>Se cambiará por la v${v.version}`;
  }
  if (errores[j.id]) est.innerHTML += `<br><span class="error">${errores[j.id]}</span>`;
  else if (errorGeneral && !j.pronto) est.innerHTML += `<br><span class="error">${errorGeneral}</span>`;
  b.innerHTML = `<span>${txt}</span>`;
  b.disabled = !quehacer || !!ocupado;
  if (quehacer === 'jugar') b.onclick = () => jugar(j);
  if (quehacer === 'instalar') b.onclick = () => instalar(j, version);
}

async function instalar(j, version) {
  ocupado = j.id; delete errores[j.id];
  const b = $('#accion');
  b.disabled = true; b.className = 'accion cargando';
  b.innerHTML = '<div class="lleno"></div><span>EMPEZANDO…</span>';
  const r = await A.instalar(j.id, version);
  ocupado = null;
  if (r.error) errores[j.id] = r.error;
  refrescar();
}
async function jugar(j) {
  $('#accion').disabled = true;
  const r = await A.jugar(j.id);
  if (r.error) errores[j.id] = r.error; else delete errores[j.id];
  setTimeout(() => pintarJuego(), 1500);
}

A.alProgreso(({ id, paso, p }) => {
  if (id !== ocupado || id !== actual) return;
  const b = $('#accion');
  if (!b.querySelector('.lleno')) return;
  b.querySelector('.lleno').style.width = Math.round(p * 100) + '%';
  b.querySelector('span').textContent = paso.startsWith('Desc') ? 'DESCARGANDO ' + Math.round(p * 100) + '%' : 'INSTALANDO…';
});
document.addEventListener('click', () => { const m = $('.menu'); if (m) m.remove(); });
$('#revisar').onclick = () => { if (!ocupado) { $('#desc').textContent = 'Revisando versiones…'; refrescar(); } };
refrescar();
</script>
</body>
</html>
