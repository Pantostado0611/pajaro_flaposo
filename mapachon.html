  @media (pointer: coarse) { #touch-controls { display: block; } }

  .t-btn {
    position: absolute;
    width: 68px; height: 68px;
    background: rgba(255,255,255,0.10);
    border: 2px solid rgba(255,255,255,0.22);

  #btn-right  { bottom: 24px; left: 100px; }

// ─── PARTÍCULAS ───────────────────────────────────────────────────────────────
const MAX_PARTICLES = 35;
let particles = [];

function resetParticles(roomId) {
  particles = [];
  const col = ROOMS[roomId].particleColor;
  for (let i = 0; i < MAX_PARTICLES; i++) {
    particles.push(makeParticle(col, true));
  }
}

function makeParticle(col, randomY = false) {
  return {
    x: Math.random() * W,
    y: randomY ? Math.random() * H : H + 10,
    vy: -(Math.random() * 0.4 + 0.1),
    vx: (Math.random() - 0.5) * 0.15,
    size: Math.random() * 2.5 + 0.5,
    alpha: Math.random() * 0.6 + 0.1,
    col,
  };
}

function updateParticles(roomId) {
  const col = ROOMS[roomId].particleColor;
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    if (p.y < -5) {
      Object.assign(p, makeParticle(col));
    }
  }
}

// ─── TECLADO ─────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  if (chapterTimer > 0) {
    if (chapterTimer < chapterDur - 90) chapterTimer = Math.min(chapterTimer, 50);
    e.preventDefault(); return;
  }
  if (e.code === 'Tab' || e.code === 'KeyI') { showInventory = !showInventory; e.preventDefault(); return; }
  if (e.code === 'KeyL') {
    cheatState = cheatState === 'closed' ? 'input' : 'closed';
    cheatCode = ''; cheatError = 0; updateCheatUI();
    e.preventDefault(); return;
  }
  if (cheatState !== 'closed') {
    if (e.code === 'Escape') { cheatState = 'closed'; cheatCode = ''; updateCheatUI(); }
    else if (cheatState === 'input') {
      if (e.key >= '0' && e.key <= '9') cheatAppend(e.key);
      else if (e.code === 'Backspace')  cheatCode = cheatCode.slice(0, -1);
    }
    e.preventDefault(); return;
  }
  if (!keys[e.code]) {
    if (['Space','ArrowUp','KeyW'].includes(e.code)) player.jumpBuffered = true;
    if (['KeyZ','KeyJ','KeyX'].includes(e.code)) tryAttack();
    if (['KeyC','KeyK'].includes(e.code)) tryShoot();
  }
  keys[e.code] = true;
  e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function left()     { return keys['ArrowLeft']  || keys['KeyA'] || touch.left; }
function right()    { return keys['ArrowRight'] || keys['KeyD'] || touch.right; }
function jumpHeld() { return keys['Space'] || keys['ArrowUp'] || keys['KeyW'] || touch.jump; }

// ─── TÁCTIL ───────────────────────────────────────────────────────────────────

(function () {
  function bind(id, key) {
    const el = document.getElementById(id);
    if (!el) return;
    function down(e) {
      e.preventDefault();
      touch[key] = true;
      if (key === 'jump') player.jumpBuffered = true;
      if (key === 'attack') tryAttack();
      if (key === 'shoot')  tryShoot();
    }
    function up(e) { e.preventDefault(); touch[key] = false; }
    el.addEventListener('touchstart',  down, { passive: false });
    el.addEventListener('touchend',    up,   { passive: false });
    el.addEventListener('touchcancel', up,   { passive: false });
  }
  bind('btn-left',   'left');
  bind('btn-right',  'right');
  bind('btn-jump',   'jump');
  bind('btn-attack', 'attack');
  bind('btn-shoot',  'shoot');
  const invBtn = document.getElementById('btn-inv');
  if (invBtn) {
    invBtn.addEventListener('touchstart', e => { e.preventDefault(); showInventory = !showInventory; }, { passive: false });
  }
})();

function toRoman(n) {
  const R = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],
             [50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  let out = '';
  for (const [v, r] of R) while (n >= v) { out += r; n -= v; }
  return out;
}
function showChapter(num, title) {
  const intro  = num > 1;
  chapterText  = { label: 'C A P Í T U L O   ' + toRoman(num), title, intro };
  chapterDur   = CHAPTER_DUR + (intro ? CHAPTER_INTRO : 0);
  chapterTimer = chapterDur;
}

// ─── COLISIÓN ─────────────────────────────────────────────────────────────────
function collideRect(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function resolveCollisions() {
  const plats = ROOMS[currentRoom].platforms;
  player.onGround = false;

  // Escalones (plataformas finas): se atraviesan desde abajo y los lados
  const oneWay = p => p.h <= 18;

  // X primero
  player.x += player.vx;
  for (const p of plats) {
    if (p.trapdoor && boss2Defeated) continue;
    if (oneWay(p)) continue;
    if (collideRect(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
      if (player.vx > 0) player.x = p.x - player.w;
      if (player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
    }
  }

  // Y después
  const prevBottom = player.y + player.h;
  player.y += player.vy;
  for (const p of plats) {
    if (p.trapdoor && boss2Defeated) continue;
    // Escalón: solo se apoya si caes y venías desde encima
    if (oneWay(p) && (player.vy < 0 || prevBottom > p.y)) continue;
    if (collideRect(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
      if (player.vy > 0) {
        player.y = p.y - player.h;
        player.onGround = true;
        lastGround = { room: currentRoom, x: player.x, y: player.y };
      } else {
        player.y = p.y + p.h;
      }
      player.vy = 0;
    }
  }
}

// ─── ACTUALIZAR ───────────────────────────────────────────────────────────────
function updatePlayer() {
  // Movimiento horizontal
  if (left()) {
    player.vx = -MOVE_SPD;
    player.facing = -1;
  } else if (right()) {
    player.vx = MOVE_SPD;
    player.facing = 1;
  } else {
    player.vx *= FRICTION;
    if (Math.abs(player.vx) < 0.2) player.vx = 0;
  }

  // Coyote time
  if (player.onGround) {
    player.coyoteTime = COYOTE_MAX;
  } else if (player.coyoteTime > 0) {
    player.coyoteTime--;
  }

  // Saltar
  if (player.jumpBuffered && player.coyoteTime > 0) {
    player.vy = JUMP_V;
    player.coyoteTime = 0;
    player.jumpBuffered = false;
  }
  player.jumpBuffered = false;

  // Gravedad variable (soltar el botón = caída más rápida)
  if (player.vy < 0 && !jumpHeld()) {
    player.vy += GRAVITY * 1.6;
  } else {
    player.vy += GRAVITY;
  }
  if (player.vy > MAX_FALL) player.vy = MAX_FALL;

  if (player.attackTimer  > 0) player.attackTimer--;
  if (player.attackActive > 0) player.attackActive--;
  if (player.invFrames    > 0) player.invFrames--;
  if (player.knockbackTimer > 0) { player.knockbackTimer--; }

  // Regeneración: 1 corazón cada 12 segundos (720 frames a 60fps)
  player.healTimer++;
  if (player.healTimer >= 720) {
    player.healTimer = 0;
    if (player.hp < player.maxHp) player.hp++;
  }

  resolveCollisions();

  // Bob (animación de caminar)
  if (player.onGround && Math.abs(player.vx) > 0.5) {
    player.bobTimer += 0.25;
  } else {
    player.bobTimer *= 0.8;
  }
}

function checkExits() {
  const exits = ROOMS[currentRoom].exits;
  if (!exits) return;

  if (exits.right && player.x + player.w >= W) {
    if (currentRoom === 3 && !boss2Defeated) return; // castillo cerrado
    const e = exits.right;
    startTransition(e.room, e.spawnX, e.spawnY);
  }
  if (exits.left && player.x <= 0) {
    if (currentRoom === 4 && !bossDefeated) return; // puerta bloqueada
    const e = exits.left;
    startTransition(e.room, e.spawnX, e.spawnY);
  }
  if (exits.up && player.y <= 0) {
    if (currentRoom === 1 && !hasKey && !keyUsed) return; // puerta con llave
    if (currentRoom === 1 && hasKey) { hasKey = false; keyUsed = true; }
    if (currentRoom === 3 && !boss2Defeated) return; // armería cerrada
    const e = exits.up;
    startTransition(e.room, e.spawnX, e.spawnY);
  }
  if (exits.down && player.y + player.h >= H + 30) {
    if (currentRoom === 3 && !boss2Defeated) return; // debes matar al guardián
    const e = exits.down;
    startTransition(e.room, e.spawnX, e.spawnY);
  }

  // Muerte: caer fuera del mapa
  if (player.y > H + 100) {
    if (godMode) { player.y = 400; player.vy = -5; }
    else { isDeath = true; startTransition(0, 80, 400); }
  }
}

function updateTransition() {
  if (!transitioning) return;

  if (transPhase === 'fade-out') {
    transAlpha += 0.055;
    if (transAlpha >= 1) {
      transAlpha = 1;
      transPhase = 'black';
      transBlackFrames = 18;
      if (isDeath) spawnShade();
      // Cambiar sala ahora
      currentRoom = pendingRoom;
      player.x = pendingPos.x;
      player.y = pendingPos.y;
      player.vx = 0;
      player.vy = 0;
      resetParticles(currentRoom);
      initEnemies(currentRoom);
      if (pendingRoom === 4 && !bossDefeated) initBoss();
      if (pendingRoom === 3 && !boss2Defeated) initBoss2();
      playerShots.length = 0;
      if (pendingRoom === 7 && !chapterShown) { chapterShown = true; showChapter(2, 'La Ruptura'); }
      if (isDeath) {
        // Se conserva el progreso: jefes vencidos, llave, puerta abierta y armas compradas.
        // Los jefes no vencidos se reinician al volver a entrar en su sala.
        player.hp = player.maxHp; player.invFrames = 0;
      }
      roomLabelAlpha = 1;
      roomLabelTimer = 200;
    }
  } else if (transPhase === 'black') {
    transBlackFrames--;
    if (transBlackFrames <= 0) transPhase = 'fade-in';
  } else if (transPhase === 'fade-in') {
    transAlpha -= 0.04;
    if (transAlpha <= 0) {
      transAlpha = 0;
      transPhase = 'none';
      transitioning = false;
      isDeath = false;
    }
  }
}

// ─── ALMA ─────────────────────────────────────────────────────────────────────
function spawnShade() {
  if (money <= 0) { shade = null; return; }
  // Si caíste al vacío, el alma aparece en el último suelo que pisaste
  let x = player.x, y = player.y - 10;
  if (player.y > H - 40 && lastGround && lastGround.room === currentRoom) {
    x = lastGround.x; y = lastGround.y - 10;
  }
  shade = {
    room: currentRoom, x, y, money, bob: 0,
  };
  money = 0; // la alma anterior (si había) se pierde
}

function updateShade() {
  if (!shade || shade.room !== currentRoom) return;
  shade.bob += 0.05;
  const sx = shade.x - 4, sy = shade.y + Math.sin(shade.bob) * 6, sw = 36, sh = 44;
  const atkW = 52, atkH = 30;
  const atkX = player.facing === 1 ? player.x + player.w : player.x - atkW;
  const hit = (player.attackActive > 0 && collideRect(atkX, player.y + 6, atkW, atkH, sx, sy, sw, sh)) ||
              collideRect(player.x, player.y, player.w, player.h, sx, sy, sw, sh);
  if (!hit) return;
  addMoney(shade.money, sx + sw / 2, sy);
  shade = null;
}

function drawShade() {
  if (!shade || shade.room !== currentRoom) return;
  const t = Date.now() * 0.004;
  const cx = shade.x + 14, cy = shade.y + 20 + Math.sin(shade.bob) * 6;

  // Aura
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 46);
  g.addColorStop(0, 'rgba(120,80,200,0.35)');
  g.addColorStop(1, 'transparent');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 46, 0, Math.PI * 2); ctx.fill();

  // Cuerpo con cola ondulante
  ctx.fillStyle = 'rgba(10,6,20,0.92)';
  ctx.beginPath();
  ctx.arc(cx, cy - 4, 16, Math.PI, 0);
  ctx.lineTo(cx + 16, cy + 14);
  for (let i = 0; i <= 4; i++) {
    const wx = cx + 16 - i * 8;
    ctx.lineTo(wx, cy + 14 + (i % 2 ? 6 : 0) + Math.sin(t * 2 + i) * 3);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(180,140,255,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();

  // Orejas de mapache
  ctx.fillStyle = 'rgba(10,6,20,0.92)';
  ctx.beginPath(); ctx.arc(cx - 11, cy - 17, 6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 11, cy - 17, 6, 0, Math.PI * 2); ctx.fill();

  // Ojos
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(cx - 6, cy - 4, 4, 5.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 6, cy - 4, 4, 5.5, 0, 0, Math.PI * 2); ctx.fill();

  // Lo que guarda
  ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd040';
  ctx.fillText('💰 ' + shade.money, cx, cy - 30);
}

// ─── ENEMIGOS ─────────────────────────────────────────────────────────────────
function initEnemies(roomId) {
  const templates = ENEMY_TEMPLATES[roomId] || [];
  currentEnemies = templates.map(t => ({ ...t, w: 28, h: 24, vy: 0, dead: false, deathTimer: 0 }));
}

function updateEnemies() {
  for (const e of currentEnemies) {
    if (e.dead) { if (e.deathTimer > 0) e.deathTimer--; continue; }
    e.x += e.dir * e.speed;
    if (e.x <= e.patrolMin)       { e.x = e.patrolMin; e.dir =  1; }
    if (e.x + e.w >= e.patrolMax) { e.x = e.patrolMax - e.w; e.dir = -1; }
  }
}

function checkEnemyCollisions() {
  // Hitbox de ataque del jugador
  const atkW = 52, atkH = 30;
  const atkX = player.facing === 1 ? player.x + player.w : player.x - atkW;
  const atkY = player.y + 6;

  for (const e of currentEnemies) {
    if (e.dead) continue;

    // Ataque del jugador golpea al enemigo
    if (player.attackActive > 0 &&
        collideRect(atkX, atkY, atkW, atkH, e.x, e.y, e.w, e.h)) {
      e.dead = true;
      e.deathTimer = 22;
      addMoney(MONEY_ENEMY, e.x + e.w / 2, e.y);
      // Rebote ligero al golpear
      if (player.knockbackTimer === 0) { player.vy = Math.min(player.vy, -4); }
      continue;
    }

    // Stomp (caer encima mata al enemigo)
    const stompOverlap = collideRect(player.x, player.y, player.w, player.h, e.x, e.y, e.w, e.h);
    const fromAbove    = player.vy > 1 && (player.y + player.h) < (e.y + e.h * 0.6);
    if (stompOverlap && fromAbove) {
      e.dead = true;
      e.deathTimer = 22;
      addMoney(MONEY_ENEMY, e.x + e.w / 2, e.y);
      player.vy = -11;
      continue;
    }

    // Contacto lateral/desde abajo → daño al jugador
    if (player.invFrames === 0 &&
        collideRect(player.x + 3, player.y + 3, player.w - 6, player.h - 3, e.x, e.y, e.w, e.h)) {
      if (!godMode) {
        player.hp--;
        if (player.hp <= 0) {
          player.hp = 0;
          isDeath = true;
          startTransition(0, 80, 400);
          return;
        }
      }
      player.invFrames = 90;
      player.knockbackTimer = 14;
      const dir = player.x + player.w / 2 < e.x + e.w / 2 ? -1 : 1;
      player.vx = dir * 6;
      player.vy = -7;
    }
  }
}

function drawEnemy(e) {
  const cx = Math.round(e.x + e.w / 2);
  const cy = Math.round(e.y + e.h / 2);

  // Animación de muerte: anillo de humo, nubecitas y chispas
  if (e.dead) {
    if (e.deathTimer <= 0) return;
    const k = e.deathTimer / 22, p = 1 - k;
    ctx.save();
    ctx.globalAlpha = k * 0.7;
    ctx.strokeStyle = '#c090ff'; ctx.lineWidth = 3 * k + 0.5;
    ctx.beginPath(); ctx.arc(cx, cy, 6 + p * 26, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + 0.4;
      const d = p * 20;
      const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d - p * 6;
      ctx.globalAlpha = k * 0.55;
      ctx.fillStyle = vol(x, y, 7 * k + 2, '#f0e6ff', '#8a70b0');
      ctx.beginPath(); ctx.arc(x, y, 7 * k + 2, 0, Math.PI * 2); ctx.fill();
    }
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const d = p * 32;
      ctx.globalAlpha = k;
      ctx.fillStyle = i % 2 === 0 ? '#d070ff' : '#ff8050';
      ctx.beginPath(); ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 2.4 * k + 0.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    return;
  }

  const t = Date.now() * 0.003;
  const bounce = Math.abs(Math.sin(t * 7 + e.x * 0.05)) * 1.5;
  ctx.save();

  // Sombra (se encoge un poco al rebotar)
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(cx, cy + e.h / 2 + 2, e.w * 0.4 - bounce, 3, 0, 0, Math.PI * 2); ctx.fill();

  ctx.translate(cx, cy - bounce);
  ctx.scale(e.dir, 1);

  // Patas con articulación (detrás del cuerpo)
  ctx.strokeStyle = '#2a1040'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 0; i < 3; i++) {
    const lx    = -6 + i * 6;
    const swing = Math.sin(t * 7 + i * 1.1) * 3.5;
    ctx.beginPath(); ctx.moveTo(lx, 4); ctx.lineTo(lx - 6, 4 + swing * 0.3); ctx.lineTo(lx - 9, 12 + swing + bounce); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(lx, 4); ctx.lineTo(lx + 6, 4 - swing * 0.3); ctx.lineTo(lx + 9, 12 - swing + bounce); ctx.stroke();
  }

  // Cuerpo con volumen
  ctx.fillStyle = vol(0, 0, e.w / 2, '#3e1e60', '#0c0416');
  ctx.beginPath(); ctx.ellipse(0, 0, e.w / 2, e.h / 2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1; ctx.stroke();

  // Caparazón con segmentos y brillo
  const shell = ctx.createLinearGradient(0, -e.h / 2, 0, 2);
  shell.addColorStop(0, '#6a3498'); shell.addColorStop(1, '#2a1044');
  ctx.fillStyle = shell;
  ctx.beginPath(); ctx.ellipse(-1, -2, e.w / 2 - 2, e.h / 2 - 3, -0.1, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = 'rgba(20,0,40,0.6)'; ctx.lineWidth = 1;
  for (const sx of [-5, 2]) {
    ctx.beginPath(); ctx.moveTo(sx, -e.h / 2 + 2); ctx.quadraticCurveTo(sx + 2, -5, sx, -2); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.beginPath(); ctx.ellipse(-4, -7, 6, 2.2, -0.2, 0, Math.PI * 2); ctx.fill();

  // Pinzas que se abren y cierran
  const open = (Math.sin(t * 5 + e.x) + 1) * 1.4;
  ctx.strokeStyle = '#5a2a80'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(e.w / 2 - 3, 2); ctx.quadraticCurveTo(e.w / 2 + 5, 0 - open, e.w / 2 + 7, 4 - open * 0.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(e.w / 2 - 3, 6); ctx.quadraticCurveTo(e.w / 2 + 5, 9 + open, e.w / 2 + 7, 6 + open * 0.6); ctx.stroke();

  // Ojo rojo brillante (parpadea)
  const ex = e.w / 2 - 7, ey = -3;
  const glow = ctx.createRadialGradient(ex, ey, 0, ex, ey, 8);
  glow.addColorStop(0, 'rgba(255,80,80,0.9)');
  glow.addColorStop(1, 'rgba(255,40,40,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(ex, ey, 8, 0, Math.PI * 2); ctx.fill();
  if (blinkNow(e.x * 0.37 + e.y)) {
    ctx.strokeStyle = '#ff3030'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(ex - 3, ey); ctx.lineTo(ex + 3, ey); ctx.stroke();
  } else {
    ctx.fillStyle = vol(ex, ey, 3.4, '#ff8080', '#c00000');
    ctx.beginPath(); ctx.arc(ex, ey, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#300000';
    ctx.beginPath(); ctx.ellipse(ex + 0.6, ey, 0.9, 2.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd0d0';
    ctx.beginPath(); ctx.arc(ex - 1.1, ey - 1.2, 1, 0, Math.PI * 2); ctx.fill();
  }

  // Antena con bombilla que brilla
  const tipX = e.w / 2 + 3, tipY = -e.h / 2 - 13 + Math.sin(t * 4 + e.x) * 1.5;
  ctx.strokeStyle = '#4a2068'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(e.w / 2 - 9, -e.h / 2 + 1);
  ctx.quadraticCurveTo(e.w / 2, -e.h / 2 - 7, tipX, tipY); ctx.stroke();
  const bulb = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, 5);
  bulb.addColorStop(0, 'rgba(255,170,220,0.95)'); bulb.addColorStop(1, 'rgba(255,80,160,0)');
  ctx.fillStyle = bulb; ctx.beginPath(); ctx.arc(tipX, tipY, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd0ea'; ctx.beginPath(); ctx.arc(tipX, tipY, 1.6, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

function drawEnemies() {
  for (const e of currentEnemies) drawEnemy(e);
}

// ─── FUNCIONES DE JEFE ────────────────────────────────────────────────────────
function initBoss() {
  Object.assign(boss, {
    x: 440, y: BOSS_FLOOR_Y,
    vx: 0, vy: 0,
    hp: 10, state: 'wait', stateTimer: 90,
    phase: 1, invFrames: 0, facing: -1,
    dead: false, deathTimer: 0, projectiles: [],
  });
  bossAttackIdx = 0;
}

function fireBossOrbs() {
  const cx = boss.x + boss.w / 2, cy = boss.y + boss.h / 2;
  const dx = (player.x + player.w / 2) - cx;
  const dy = (player.y + player.h / 2) - cy;
  const len = Math.hypot(dx, dy) || 1;
  const nx = dx / len, ny = dy / len;
  for (const a of [-0.4, 0, 0.4]) {
    const cos = Math.cos(a), sin = Math.sin(a);
    boss.projectiles.push({
      x: cx, y: cy,
      vx: (nx * cos - ny * sin) * 4.5,
      vy: (nx * sin + ny * cos) * 4.5,
      r: 9, life: 220,
    });
  }
}

function updateBoss() {
  if (currentRoom !== 4) return;

  // Actualizar proyectiles
  for (const p of boss.projectiles) {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.12;
    p.life--;
  }
  boss.projectiles = boss.projectiles.filter(
    p => p.life > 0 && p.x > -30 && p.x < W + 30 && p.y < H + 30
  );

  if (boss.dead) {
    if (boss.deathTimer > 0) { boss.deathTimer--; }
    else if (!bossDefeated)  {
      bossDefeated = true;
      addMoney(MONEY_BOSS, boss.x + boss.w / 2, boss.y);
      keyItem.x = boss.x + boss.w / 2 - 12;
      keyItem.y = BOSS_FLOOR_Y - 28;
      keyItem.active = true;
      keyItem.bobTimer = 0;
    }
    return;
  }

  if (boss.invFrames > 0) boss.invFrames--;
  boss.phase = boss.hp <= Math.floor(boss.maxHp / 2) ? 2 : 1;

  // Gravedad (al saltar)
  if (boss.y < BOSS_FLOOR_Y) {
    boss.vy += 0.65;
    boss.y  += boss.vy;
    if (boss.y >= BOSS_FLOOR_Y) {
      boss.y = BOSS_FLOOR_Y; boss.vy = 0;
      if (boss.state === 'jump') { boss.state = 'wait'; boss.vx = 0; boss.stateTimer = 55; }
    }
  }

  boss.stateTimer--;

  if (boss.state === 'charge') {
    boss.x += boss.vx;
    if (boss.x <= 20)              { boss.x = 20;              boss.vx =  Math.abs(boss.vx) * 0.92; boss.facing =  1; }
    if (boss.x + boss.w >= W - 20) { boss.x = W - 20 - boss.w; boss.vx = -Math.abs(boss.vx) * 0.92; boss.facing = -1; }
    if (boss.stateTimer <= 0)      { boss.state = 'wait'; boss.vx = 0; boss.stateTimer = boss.phase === 2 ? 40 : 55; }

  } else if (boss.state === 'jump') {
    boss.x += boss.vx;
    if (boss.x <= 20)              { boss.x = 20;              boss.vx =  Math.abs(boss.vx); boss.facing =  1; }
    if (boss.x + boss.w >= W - 20) { boss.x = W - 20 - boss.w; boss.vx = -Math.abs(boss.vx); boss.facing = -1; }
    if (boss.stateTimer <= 0)      { boss.y = BOSS_FLOOR_Y; boss.vy = 0; boss.state = 'wait'; boss.vx = 0; boss.stateTimer = 50; }

  } else if (boss.state === 'wait') {
    if (boss.stateTimer <= 0) {
      const pattern = boss.phase === 2
        ? ['charge','jump','shoot','charge','jump','shoot','charge','charge']
        : ['charge','jump','charge','jump'];
      const next = pattern[bossAttackIdx % pattern.length];
      bossAttackIdx++;
      const pdx = (player.x + player.w / 2) - (boss.x + boss.w / 2);
      boss.facing = pdx > 0 ? 1 : -1;

      if (next === 'shoot') {
        fireBossOrbs();
        boss.stateTimer = boss.phase === 2 ? 35 : 50;
      } else {
        boss.state = next;
        if (next === 'charge') {
          boss.vx = boss.facing * (boss.phase === 2 ? 7.8 : 6.2);
          boss.stateTimer = 130;
        } else {
          boss.vx = boss.facing * 4.5;
          boss.vy = -14;
          boss.stateTimer = 160;
        }
      }
    }
  }
}

function checkBossCollisions() {
  if (currentRoom !== 4 || boss.dead) return;

  const atkW = 52, atkH = 30;
  const atkX = player.facing === 1 ? player.x + player.w : player.x - atkW;
  const atkY = player.y + 6;

  // Ataque del jugador golpea al jefe
  if (player.attackActive > 0 && boss.invFrames === 0 &&
      collideRect(atkX, atkY, atkW, atkH, boss.x, boss.y, boss.w, boss.h)) {
    boss.hp -= playerDmg;
    boss.invFrames = 28;
    if (boss.hp <= 0) { boss.hp = 0; boss.dead = true; boss.deathTimer = 130; boss.projectiles = []; return; }
  }

  // Pisotón al jefe
  const onBoss   = collideRect(player.x, player.y, player.w, player.h, boss.x, boss.y, boss.w, boss.h);
  const fromTop  = player.vy > 1 && (player.y + player.h) < (boss.y + boss.h * 0.5);
  if (onBoss && fromTop && boss.invFrames === 0) {
    boss.hp -= playerDmg;
    boss.invFrames = 28;
    player.vy = -12;
    if (boss.hp <= 0) { boss.hp = 0; boss.dead = true; boss.deathTimer = 130; boss.projectiles = []; return; }
  }

  // Cuerpo del jefe daña al jugador
  if (player.invFrames === 0 && !fromTop &&
      collideRect(player.x + 3, player.y + 3, player.w - 6, player.h - 3, boss.x, boss.y, boss.w, boss.h)) {
    if (!godMode) {
      player.hp--;
      if (player.hp <= 0) { player.hp = 0; isDeath = true; startTransition(0, 80, 400); return; }
    }
    player.invFrames = 90;
    const dir = (player.x + player.w / 2) < (boss.x + boss.w / 2) ? -1 : 1;
    player.vx = dir * 7; player.vy = -8;
  }

  // Proyectiles dañan al jugador
  for (let i = boss.projectiles.length - 1; i >= 0; i--) {
    const p = boss.projectiles[i];
    if (player.attackActive > 0 &&
        collideRect(atkX, atkY, atkW, atkH, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2)) {
      boss.projectiles.splice(i, 1); continue;
    }
    const dist = Math.hypot((player.x + player.w / 2) - p.x, (player.y + player.h / 2) - p.y);
    if (dist < p.r + 12 && player.invFrames === 0) {
      if (!godMode) {
        player.hp--;
        if (player.hp <= 0) { player.hp = 0; isDeath = true; startTransition(0, 80, 400); return; }
      }
      boss.projectiles.splice(i, 1);
      player.invFrames = 70;
      const dir = player.x < p.x ? -1 : 1;
      player.vx = dir * 5; player.vy = -6;
    }
  }
}

// Orbe mágico con núcleo, halo y pequeña estela
function drawOrb(p, glowRGB, core) {
  const sp = Math.hypot(p.vx, p.vy) || 1;
  const tx = p.x - (p.vx / sp) * p.r * 2.4, ty = p.y - (p.vy / sp) * p.r * 2.4;
  const tg = ctx.createLinearGradient(tx, ty, p.x, p.y);
  tg.addColorStop(0, `rgba(${glowRGB},0)`); tg.addColorStop(1, `rgba(${glowRGB},0.55)`);
  ctx.strokeStyle = tg; ctx.lineWidth = p.r * 1.3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(p.x, p.y); ctx.stroke();
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 2.4);
  g.addColorStop(0, `rgba(${glowRGB},0.85)`); g.addColorStop(1, `rgba(${glowRGB},0)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = vol(p.x, p.y, p.r, '#ffffff', core);
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
}

// Explosión final de un jefe: destello, onda y chispas de colores
function drawBossDeath(cx, cy, t, cols, maxDist) {
  const p = 1 - t;
  ctx.save();
  if (p < 0.25) {
    const fl = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120);
    fl.addColorStop(0, `rgba(255,255,255,${(0.8 * (1 - p / 0.25)).toFixed(2)})`);
    fl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = fl; ctx.beginPath(); ctx.arc(cx, cy, 120, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = t * 0.8;
  ctx.strokeStyle = cols[0]; ctx.lineWidth = 4 * t + 1;
  ctx.beginPath(); ctx.arc(cx, cy, p * maxDist * 1.1, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 14; i++) {
    const angle = (i / 14) * Math.PI * 2 + p * 6;
    const dist  = p * maxDist;
    const x = cx + Math.cos(angle) * dist, y = cy + Math.sin(angle) * dist;
    const r = 9 * t + 2;
    ctx.globalAlpha = t;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2);
    g.addColorStop(0, cols[i % cols.length]); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawBoss() {
  if (currentRoom !== 4) return;

  for (const p of boss.projectiles) drawOrb(p, '180,60,255', '#a040e0');

  if (boss.dead) {
    if (boss.deathTimer <= 0) return;
    drawBossDeath(boss.x + boss.w / 2, boss.y + boss.h / 2, boss.deathTimer / 130,
      ['#ff4040','#ffaa00','#ff80ff','#ffffff','#40ffff','#ffff00'], 110);
    return;
  }

  const cx = Math.round(boss.x + boss.w / 2), cy = Math.round(boss.y + boss.h / 2);
  const hw = boss.w / 2, hh = boss.h / 2;
  const hy = -hh + 2;
  const t  = Date.now() * 0.002;
  const p2 = boss.phase === 2;
  const flicker = boss.invFrames > 0 && Math.floor(boss.invFrames / 4) % 2 === 0;

  ctx.save();
  // Sombra
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(cx, cy + hh + 5, hw * 0.85, 7, 0, 0, Math.PI * 2); ctx.fill();

  ctx.translate(cx, cy);
  ctx.scale(boss.facing, 1);
  if (flicker) ctx.globalAlpha = 0.45;

  // Líneas de velocidad al embestir
  if (boss.state === 'charge') {
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const y = -hh + 14 + i * 13, off = (Date.now() * 0.3 + i * 37) % 30;
      ctx.beginPath(); ctx.moveTo(-hw - 20 - off, y); ctx.lineTo(-hw - 50 - off, y); ctx.stroke();
    }
  }

  // Respiración: se hincha un poco desde los pies
  const br = 1 + Math.sin(t * 2) * 0.025;
  ctx.translate(0, hh); ctx.scale(1, br); ctx.translate(0, -hh);

  // Capa real con pliegues y borde ondulante
  const capeG = ctx.createLinearGradient(0, -hh + 18, 0, hh + 12);
  capeG.addColorStop(0, p2 ? '#5a1414' : '#3a1c60');
  capeG.addColorStop(1, p2 ? '#1a0404' : '#10061e');
  ctx.fillStyle = capeG;
  const wave = Math.sin(t * 3) * 3;
  ctx.beginPath();
  ctx.moveTo(-hw - 10, -hh + 18);
  ctx.quadraticCurveTo(-hw - 18, 0, -hw - 16 - wave, hh + 10);
  ctx.quadraticCurveTo(-hw / 2, hh + 16 + wave, 0, hh + 10);
  ctx.quadraticCurveTo(hw / 2, hh + 16 - wave, hw + 16 + wave, hh + 10);
  ctx.quadraticCurveTo(hw + 18, 0, hw + 10, -hh + 18);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = p2 ? '#cc3311' : '#c8a000'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-hw - 16 - wave, hh + 10);
  ctx.quadraticCurveTo(-hw / 2, hh + 16 + wave, 0, hh + 10);
  ctx.quadraticCurveTo(hw / 2, hh + 16 - wave, hw + 16 + wave, hh + 10);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2;
  for (const fx of [-hw - 4, hw + 4]) {
    ctx.beginPath(); ctx.moveTo(fx, -hh + 24); ctx.quadraticCurveTo(fx * 1.1, 0, fx * 1.05, hh + 8); ctx.stroke();
  }

  // Cuerpo con volumen y pelaje
  ctx.fillStyle = vol(0, hh * 0.2, hw, p2 ? '#7a2c2c' : '#6e6e6e', p2 ? '#2e0c0c' : '#262626');
  ctx.beginPath(); ctx.ellipse(0, hh * 0.2, hw * 0.92, hh * 0.82, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = vol(2, hh * 0.35, hw * 0.55, p2 ? '#9a4a4a' : '#b4b4b4', p2 ? '#5a2020' : '#6a6a6a');
  ctx.beginPath(); ctx.ellipse(2, hh * 0.35, hw * 0.52, hh * 0.52, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const fy = hh * 0.1 + i * 6;
    ctx.beginPath(); ctx.moveTo(-6, fy); ctx.quadraticCurveTo(2, fy + 3, 10, fy); ctx.stroke();
  }

  // Cuello de armiño
  ctx.fillStyle = vol(0, hy + 20, 20, '#ffffff', '#cfc8b8');
  ctx.beginPath(); ctx.ellipse(0, hy + 20, 22, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  for (const sx of [-14, -5, 5, 14]) { ctx.beginPath(); ctx.ellipse(sx, hy + 20 + (sx % 2 ? 1 : -1), 1.4, 2.4, 0, 0, Math.PI * 2); ctx.fill(); }

  // Orejas
  for (const s of [-1, 1]) {
    ctx.fillStyle = vol(s * 17, hy - 18, 10, p2 ? '#5a1c1c' : '#5e5e5e', p2 ? '#240808' : '#2a2a2a');
    ctx.beginPath(); ctx.arc(s * 17, hy - 18, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = vol(s * 17, hy - 17, 5, '#e0a0a0', '#8a4a4a');
    ctx.beginPath(); ctx.arc(s * 17, hy - 17, 4.5, 0, Math.PI * 2); ctx.fill();
  }

  // Cabeza
  ctx.fillStyle = vol(0, hy, 21, p2 ? '#6a2a2a' : '#727272', p2 ? '#2a0a0a' : '#2e2e2e');
  ctx.beginPath(); ctx.arc(0, hy, 21, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();

  // Corona dorada con joyas
  const cc = p2 ? '#cc3311' : '#c8a000';
  const crownG = ctx.createLinearGradient(0, hy - 38, 0, hy - 12);
  crownG.addColorStop(0, p2 ? '#ff8a60' : '#fff0a0');
  crownG.addColorStop(0.5, cc);
  crownG.addColorStop(1, p2 ? '#6a1404' : '#7a5a00');
  ctx.fillStyle = crownG;
  ctx.beginPath();
  ctx.moveTo(-19, hy - 14); ctx.lineTo(-14, hy - 32); ctx.lineTo(-8,  hy - 17);
  ctx.lineTo(  0, hy - 38); ctx.lineTo( 8,  hy - 17); ctx.lineTo(14, hy - 32);
  ctx.lineTo( 19, hy - 14); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = p2 ? '#4a0a00' : '#5a4000'; ctx.lineWidth = 1.2; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.fillStyle = crownG;
  ctx.beginPath(); ctx.roundRect(-20, hy - 17, 40, 6, 2); ctx.fill(); ctx.stroke();
  const gem = p2 ? '#ff5533' : '#44ccff';
  for (const [gx, gy, gr] of [[-14, hy - 30, 3.5], [0, hy - 36, 4.5], [14, hy - 30, 3.5]]) {
    ctx.fillStyle = vol(gx, gy, gr, '#ffffff', gem);
    ctx.beginPath(); ctx.arc(gx, gy, gr, 0, Math.PI * 2); ctx.fill();
  }
  // destello que gira sobre la joya central
  const tw = (Math.sin(t * 3) + 1) / 2;
  ctx.save();
  ctx.translate(0, hy - 36); ctx.rotate(t);
  ctx.fillStyle = `rgba(255,255,255,${(0.9 * tw).toFixed(2)})`;
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    ctx.lineTo(Math.cos(a) * 9 * tw, Math.sin(a) * 9 * tw);
    ctx.lineTo(Math.cos(a + Math.PI / 4) * 1.5, Math.sin(a + Math.PI / 4) * 1.5);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // Máscara de mapache
  ctx.fillStyle = '#111111';
  ctx.beginPath(); ctx.ellipse(8, hy - 1, 13, 9, 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillRect(-2, hy - 6, 3, 8);

  // Parche de cuero en el otro ojo, con su cinta
  ctx.strokeStyle = '#2a1a10'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-13, hy - 3); ctx.quadraticCurveTo(-19, hy - 5, -21, hy - 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4, hy - 6); ctx.quadraticCurveTo(0, hy - 12, 4, hy - 17); ctx.stroke();
  ctx.fillStyle = vol(-8, hy - 2, 7, '#5a4030', '#120a06');
  ctx.beginPath(); ctx.ellipse(-8, hy - 2, 6.5, 5.5, -0.2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#0a0604'; ctx.lineWidth = 1; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,220,180,0.25)'; ctx.lineWidth = 0.8;
  ctx.setLineDash([1.5, 1.5]);
  ctx.beginPath(); ctx.ellipse(-8, hy - 2, 4.6, 3.8, -0.2, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);

  // Ojo que brilla y late
  const ec = p2 ? '#ff2020' : '#ffcc00';
  const ep = 1 + 0.25 * Math.sin(t * 5);
  const eg = ctx.createRadialGradient(8, hy - 1, 0, 8, hy - 1, 12 * ep);
  eg.addColorStop(0, p2 ? 'rgba(255,144,144,0.9)' : 'rgba(255,238,136,0.9)');
  eg.addColorStop(1, 'rgba(255,200,100,0)');
  ctx.fillStyle = eg;
  ctx.beginPath(); ctx.arc(8, hy - 1, 12 * ep, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = vol(8, hy - 1, 5.5, '#ffffff', ec);
  ctx.beginPath(); ctx.arc(8, hy - 1, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a0a00';
  ctx.beginPath(); ctx.ellipse(8.6, hy - 1, 1.4, 3.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(6.5, hy - 2.8, 1.6, 0, Math.PI * 2); ctx.fill();
  // ceja enfadada
  ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(1, hy - 10); ctx.lineTo(17, hy - 6); ctx.stroke();

  // Hocico, nariz, colmillo y bigotes
  ctx.fillStyle = vol(-2, hy + 9, 10, p2 ? '#9a6060' : '#c8b8b8', p2 ? '#4a2020' : '#7a6a6a');
  ctx.beginPath(); ctx.ellipse(-2, hy + 9, 10, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = vol(-2, hy + 6, 4, '#555', '#000');
  ctx.beginPath(); ctx.ellipse(-2, hy + 6, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.arc(-3.4, hy + 5, 1, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2a1a1a'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-8, hy + 13); ctx.quadraticCurveTo(-2, hy + 11, 5, hy + 13); ctx.stroke();
  ctx.fillStyle = '#fffaf0';
  ctx.beginPath(); ctx.moveTo(1, hy + 12.4); ctx.lineTo(3, hy + 16); ctx.lineTo(4.4, hy + 12.6); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1; ctx.lineCap = 'round';
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(s * 4, hy + 9);  ctx.lineTo(s * 23, hy + 7);  ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s * 4, hy + 11); ctx.lineTo(s * 23, hy + 13); ctx.stroke();
  }

  // Cetro real con orbe que brilla
  const shaft = ctx.createLinearGradient(hw + 5, 0, hw + 22, 0);
  shaft.addColorStop(0, p2 ? '#ff7a50' : '#fff0a0'); shaft.addColorStop(1, p2 ? '#6a1404' : '#7a5a00');
  ctx.strokeStyle = shaft; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(hw + 5, -hh + 26); ctx.lineTo(hw + 22, -hh - 12); ctx.stroke();
  ctx.strokeStyle = p2 ? '#4a0a00' : '#5a4000'; ctx.lineWidth = 2;
  for (const k of [0.3, 0.7]) {
    const rx = hw + 5 + 17 * k, ry = -hh + 26 - 38 * k;
    ctx.beginPath(); ctx.moveTo(rx - 4, ry - 1.5); ctx.lineTo(rx + 4, ry + 1.5); ctx.stroke();
  }
  const orbC = p2 ? '#ff4040' : '#44ccff';
  const op = 0.6 + 0.4 * Math.sin(t * 4);
  const og = ctx.createRadialGradient(hw + 22, -hh - 12, 0, hw + 22, -hh - 12, 18);
  og.addColorStop(0, hexAlpha(orbC, 0.6 * op)); og.addColorStop(1, hexAlpha(orbC, 0));
  ctx.fillStyle = og; ctx.beginPath(); ctx.arc(hw + 22, -hh - 12, 18, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = vol(hw + 22, -hh - 12, 7, '#ffffff', orbC);
  ctx.beginPath(); ctx.arc(hw + 22, -hh - 12, 7, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

function drawBossUI() {
  if (currentRoom !== 4) return;

  // Puerta de hierro (bloqueada mientras vive el jefe)
  if (!bossDefeated) {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 100, 20, H - 200);
    for (let yg = 108; yg < H - 108; yg += 44) {
      ctx.fillStyle = '#3a3a48';
      ctx.fillRect(0, yg, 20, 28);
      ctx.fillStyle = '#545464';
      ctx.fillRect(2, yg + 2, 5, 24);
    }
    ctx.strokeStyle = '#2a2a38'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, H / 2 - 10); ctx.lineTo(26, H / 2 - 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, H / 2 + 10); ctx.lineTo(26, H / 2 + 10); ctx.stroke();
  }

  // Barra de vida del jefe
  if (!boss.dead) {
    const barW = 400, barH = 18;
    const bx = (W - barW) / 2, by = H - 44;
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(bx - 6, by - 26, barW + 12, barH + 36);
    ctx.fillStyle = boss.phase === 2 ? '#cc2222' : '#9922cc';
    ctx.font = 'bold 14px serif';
    ctx.textAlign = 'center';
    ctx.fillText('✦  ÚLTIMO REY  ✦', W / 2, by - 8);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(bx, by, barW, barH);
    const fill = (boss.hp / boss.maxHp) * barW;
    ctx.fillStyle = boss.phase === 2 ? '#cc2233' : '#9922dd';
    ctx.fillRect(bx, by, fill, barH);
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(bx, by, fill, barH / 2);
    ctx.strokeStyle = boss.phase === 2 ? '#ff5544' : '#cc55ff';
    ctx.lineWidth = 1.5; ctx.strokeRect(bx, by, barW, barH);
  }

  // Mensaje de victoria
  if (bossDefeated && boss.deathTimer === 0) {
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#ffe060';
    ctx.font = 'bold 34px serif';
    ctx.textAlign = 'center';
    ctx.fillText('¡Victoria!  El rey ha caído.', W / 2, 110);
    ctx.font = '18px serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('La salida está abierta →← …regresa a la izquierda', W / 2, 144);
    // Brillo dorado en la salida
    const pulse = 0.3 + 0.2 * Math.sin(Date.now() * 0.004);
    const g = ctx.createLinearGradient(0, 0, 70, 0);
    g.addColorStop(0, `rgba(255,220,80,${pulse})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.globalAlpha = 1;
    ctx.fillRect(0, 100, 70, H - 200);
    ctx.restore();
  }
}

// ─── LLAVE ────────────────────────────────────────────────────────────────────
function updateKey() {
  if (!keyItem.active || hasKey) return;
  keyItem.bobTimer += 0.055;
  if (currentRoom !== 4) return;
  if (collideRect(player.x, player.y, player.w, player.h,
      keyItem.x - 4, keyItem.y - 12, 40, 28)) {
    hasKey = true;
    keyItem.active = false;
  }
}

function drawKey() {
  if (currentRoom !== 4 || !keyItem.active || hasKey) return;
  const kx = keyItem.x;
  const ky = keyItem.y + Math.sin(keyItem.bobTimer) * 6;
  const t  = Date.now() * 0.003;
  ctx.save();
  ctx.translate(kx, ky);
  // Halo dorado
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 30);
  g.addColorStop(0, 'rgba(255,200,40,0.55)'); g.addColorStop(1, 'rgba(255,200,40,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(Math.sin(t) * 0.12);
  const gold = ctx.createLinearGradient(0, -10, 0, 10);
  gold.addColorStop(0, '#fff6c0'); gold.addColorStop(0.45, '#ffd040'); gold.addColorStop(1, '#a87800');
  // Cabeza de la llave
  ctx.strokeStyle = gold; ctx.lineWidth = 4.5;
  ctx.beginPath(); ctx.arc(-8, 0, 9, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(120,80,0,0.6)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(-8, 0, 11.3, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,220,80,0.25)';
  ctx.beginPath(); ctx.arc(-8, 0, 6.5, 0, Math.PI * 2); ctx.fill();
  // Mango y dientes
  ctx.fillStyle = gold;
  ctx.beginPath(); ctx.roundRect(-1, -3, 23, 6, 2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(13, 2, 4, 8, 1); ctx.fill();
  ctx.beginPath(); ctx.roundRect(19, 2, 3, 6, 1); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillRect(1, -2.4, 19, 1.2);
  // Destellos
  for (const [sx, sy, ph] of [[-14, -9, 0], [18, -6, 2.1]]) {
    const s = Math.max(0, Math.sin(t * 2 + ph)) * 5;
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.moveTo(sx, sy - s); ctx.lineTo(sx + 1, sy - 1); ctx.lineTo(sx + s, sy); ctx.lineTo(sx + 1, sy + 1);
    ctx.lineTo(sx, sy + s); ctx.lineTo(sx - 1, sy + 1); ctx.lineTo(sx - s, sy); ctx.lineTo(sx - 1, sy - 1);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawKeyHUD() {

function drawKeyGate() {
