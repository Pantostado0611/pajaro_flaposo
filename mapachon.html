// Ruinas del castillo: muros rotos, ventanas sin cristal y luz de luna
function drawRuinedWalls(room) {
  const RW = room.width || W, t = Date.now() * 0.001;
  // luna (fija en pantalla)
  ctx.save(); ctx.translate(Math.round(camX), Math.round(camY));
  const mg = ctx.createRadialGradient(780, 80, 0, 780, 80, 140);
  mg.addColorStop(0, 'rgba(210,220,255,0.22)'); mg.addColorStop(1, 'rgba(210,220,255,0)');
  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(780, 80, 140, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e8ecff'; ctx.beginPath(); ctx.arc(780, 80, 26, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(160,170,210,0.35)'; ctx.beginPath(); ctx.arc(772, 74, 5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // muro del fondo con el borde superior roto
  ctx.fillStyle = '#1c1a22';
  ctx.beginPath(); ctx.moveTo(0, 480);
  for (let x = 0; x <= RW; x += 40) {
    const top = 90 + ((x * 37) % 70) + (Math.floor(x / 280) % 2) * 50;
    ctx.lineTo(x, top);
  }
  ctx.lineTo(RW, 480); ctx.closePath(); ctx.fill();
  // ladrillos del muro
  ctx.strokeStyle = 'rgba(255,255,255,0.035)'; ctx.lineWidth = 1;
  for (let row = 0, y = 200; y < 480; row++, y += 28) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(RW, y); ctx.stroke();
    for (let x = (row % 2) * 32; x < RW; x += 64) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 28); ctx.stroke(); }
  }
  // ventanas rotas con rayos de luna
  for (let x = 180; x < RW; x += 360) {
    ctx.fillStyle = '#06070e';
    ctx.beginPath(); ctx.moveTo(x - 26, 330); ctx.lineTo(x - 26, 230); ctx.arc(x, 230, 26, Math.PI, 0); ctx.lineTo(x + 26, 330); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    for (let k = 0; k < 4; k++) ctx.fillRect(x - 18 + ((k * 13) % 34), 220 + ((k * 29) % 90), 1.4, 1.4);
    const a = 0.10 + 0.03 * Math.sin(t + x);
    const lg = ctx.createLinearGradient(x, 230, x + 90, 480);
    lg.addColorStop(0, `rgba(190,205,255,${a.toFixed(3)})`); lg.addColorStop(1, 'rgba(190,205,255,0)');
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.moveTo(x - 26, 240); ctx.lineTo(x + 26, 240); ctx.lineTo(x + 140, 480); ctx.lineTo(x + 40, 480); ctx.closePath(); ctx.fill();
  }
  // columnas partidas y escombros
  for (let x = 90, k = 0; x < RW; x += 300, k++) {
    const h = 70 + (k % 3) * 45;
    ctx.fillStyle = '#2c2934';
    ctx.fillRect(x - 14, 480 - h, 28, h);
    ctx.fillStyle = '#3a3644'; ctx.fillRect(x - 18, 470, 36, 10);
    ctx.beginPath(); ctx.moveTo(x - 14, 480 - h); ctx.lineTo(x - 4, 480 - h - 14); ctx.lineTo(x + 6, 480 - h - 4); ctx.lineTo(x + 14, 480 - h - 10); ctx.lineTo(x + 14, 480 - h); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#34303e';
    for (let r = 0; r < 4; r++) { ctx.beginPath(); ctx.ellipse(x + 30 + r * 12, 478 - (r % 2) * 4, 9 - r, 5, 0, 0, Math.PI * 2); ctx.fill(); }
  }
}

// ─── LLAVE ────────────────────────────────────────────────────────────────────
function updateKey() {
  if (!keyItem.active || hasKey) return;
  keyItem.bobTimer += 0.055;
  if (currentRoom !== 4) return;
  if (collideRect(player.x, player.y, player.w, player.h,
      keyItem.x - 4, keyItem.y - 12, 40, 28)) {
    hasKey = true;
    keyItem.active = false;
  }
}

function drawKey() {
  if (currentRoom !== 4 || !keyItem.active || hasKey) return;
  const kx = keyItem.x;
  const ky = keyItem.y + Math.sin(keyItem.bobTimer) * 6;
  const t  = Date.now() * 0.003;
  ctx.save();
  ctx.translate(kx, ky);
  // Halo dorado
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 30);
  g.addColorStop(0, 'rgba(255,200,40,0.55)'); g.addColorStop(1, 'rgba(255,200,40,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(Math.sin(t) * 0.12);
  const gold = ctx.createLinearGradient(0, -10, 0, 10);
  gold.addColorStop(0, '#fff6c0'); gold.addColorStop(0.45, '#ffd040'); gold.addColorStop(1, '#a87800');
  // Cabeza de la llave
  ctx.strokeStyle = gold; ctx.lineWidth = 4.5;
  ctx.beginPath(); ctx.arc(-8, 0, 9, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(120,80,0,0.6)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(-8, 0, 11.3, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,220,80,0.25)';
  ctx.beginPath(); ctx.arc(-8, 0, 6.5, 0, Math.PI * 2); ctx.fill();
  // Mango y dientes
  ctx.fillStyle = gold;
  ctx.beginPath(); ctx.roundRect(-1, -3, 23, 6, 2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(13, 2, 4, 8, 1); ctx.fill();
  ctx.beginPath(); ctx.roundRect(19, 2, 3, 6, 1); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillRect(1, -2.4, 19, 1.2);
  // Destellos
  for (const [sx, sy, ph] of [[-14, -9, 0], [18, -6, 2.1]]) {
    const s = Math.max(0, Math.sin(t * 2 + ph)) * 5;
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.moveTo(sx, sy - s); ctx.lineTo(sx + 1, sy - 1); ctx.lineTo(sx + s, sy); ctx.lineTo(sx + 1, sy + 1);
    ctx.lineTo(sx, sy + s); ctx.lineTo(sx - 1, sy + 1); ctx.lineTo(sx - s, sy); ctx.lineTo(sx - 1, sy - 1);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawKeyHUD() {
  if (!hasKey && !keyUsed) return;
  // Icono de llave en HUD (junto a los corazones)
  const kx = 22 + player.maxHp * 28 + 16;
  const ky = 44;
  ctx.save();
  ctx.translate(kx, ky);
  ctx.globalAlpha = hasKey ? 1 : 0.35;
  ctx.strokeStyle = hasKey ? '#ffd040' : '#888'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(-5, 0, 6, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = hasKey ? '#ffd040' : '#888';
  ctx.fillRect(-1, -2, 13, 4);
  ctx.fillRect( 7,  2, 3, 5);
  ctx.fillRect(10,  2, 2, 4);
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawKeyGate() {
  // Reja dorada en la salida superior de sala 1
  if (currentRoom !== 1 || keyUsed) return;
  const gx = 370, gw = 220;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(gx, 0, gw, 22);
  const barCol  = hasKey ? '#c8a000' : '#4a4858';
  const shinCol = hasKey ? 'rgba(255,220,80,0.3)' : 'rgba(255,255,255,0.06)';
  for (let bx = gx + 8; bx < gx + gw - 8; bx += 26) {
    ctx.fillStyle = barCol;
    ctx.fillRect(bx, 0, 14, 22);
    ctx.fillStyle = shinCol;
    ctx.fillRect(bx + 2, 0, 5, 22);
  }
  // Ícono de candado en el centro
  if (!hasKey) {
    const lx = gx + gw / 2, ly = 10;
    ctx.fillStyle = '#6a6a88';
    ctx.fillRect(lx - 6, ly - 4, 12, 9);
    ctx.strokeStyle = '#6a6a88'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(lx, ly - 4, 5, Math.PI, 0); ctx.stroke();
  }
  // Texto de pista si el jefe del trono está muerto
  if (bossDefeated && !hasKey) {
    const pulse = 0.6 + 0.4 * Math.sin(Date.now() * 0.004);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ffd040'; ctx.font = '13px serif'; ctx.textAlign = 'center';
    ctx.fillText('¡Recoge la llave del rey!', W / 2, 44);
    ctx.globalAlpha = 1;
  }
  if (hasKey) {
    const pulse = 0.6 + 0.4 * Math.sin(Date.now() * 0.005);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ffd040'; ctx.font = '13px serif'; ctx.textAlign = 'center';
    ctx.fillText('Presiona ↑ para abrir con la llave', W / 2, 44);
    ctx.globalAlpha = 1;
  }
}

// ─── JEFE 2 ───────────────────────────────────────────────────────────────────
function initBoss2() {
  Object.assign(boss2, {
    x: 440, y: BOSS2_HOVER_Y,
    vx: 0, vy: 0,
    hp: 12, state: 'hover', stateTimer: 90,
    swoopPhase: 'down', phase: 1, invFrames: 0, facing: 1,
    dead: false, deathTimer: 0, projectiles: [],
    alpha: 1, shrieked: false, spiralA: 0, blinkPhase: 'out',
  });
  boss2AttackIdx = 0;
}

function fireBoss2Burst() {
  const cx = boss2.x + boss2.w / 2, cy = boss2.y + boss2.h / 2;
  const count = boss2.phase === 2 ? 8 : 6;
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2;
    boss2.projectiles.push({ x: cx, y: cy, vx: Math.cos(a) * 4, vy: Math.sin(a) * 4, r: 8, life: 240 });
  }
}

// Murcielaguitos que persiguen al jugador (un golpe o un disparo los destruye)
function summonBats() {
  const n = boss2.phase === 2 ? 3 : 2;
  const cx = boss2.x + boss2.w / 2, cy = boss2.y + boss2.h / 2;
  for (let i = 0; i < n; i++) {
    const a = Math.PI * 0.25 + (i / Math.max(1, n - 1)) * Math.PI * 0.5;
    boss2.projectiles.push({ type: 'bat', x: cx, y: cy, vx: Math.cos(a) * 3 * (i % 2 ? 1 : -1), vy: Math.sin(a) * 2, r: 8, life: 420, flap: i });
  }
}

function updateBoss2() {
  if (currentRoom !== 3) return;

  for (const p of boss2.projectiles) {
    if (p.type === 'bat') {
      const dx = player.x + player.w / 2 - p.x, dy = player.y + player.h / 2 - p.y;
      const d = Math.hypot(dx, dy) || 1;
      p.vx += dx / d * 0.12; p.vy += dy / d * 0.12;
      const sp = Math.hypot(p.vx, p.vy), max = 2.6;
      if (sp > max) { p.vx *= max / sp; p.vy *= max / sp; }
      p.x += p.vx; p.y += p.vy; p.flap += 0.3; p.life--;
    } else if (p.type === 'spiral') {
      p.x += p.vx; p.y += p.vy; p.life--;
    } else {
      p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life--;
    }
  }
  boss2.projectiles = boss2.projectiles.filter(
    p => p.life > 0 && p.x > -30 && p.x < W + 30 && p.y < H + 30 && p.y > -60
  );

  if (boss2.dead) {
    if (boss2.deathTimer > 0) { boss2.deathTimer--; }
    else if (!boss2Defeated)  {
      boss2Defeated = true;
      addMoney(MONEY_BOSS, boss2.x + boss2.w / 2, boss2.y);
    }
    return;
  }

  if (boss2.invFrames > 0) boss2.invFrames--;
  const newPhase = boss2.hp <= 6 ? 2 : 1;
  // Chillido al pasar a la fase 2
  if (newPhase === 2 && !boss2.shrieked) {
    boss2.shrieked = true;
    boss2.state = 'shriek'; boss2.stateTimer = 60;
    boss2.vx = 0; boss2.vy = 0; boss2.alpha = 1; boss2.projectiles = [];
    shake(36, 6);
  }
  boss2.phase = newPhase;
  boss2.stateTimer--;

  const hoverDrift = () => {
    const targetX = W / 2 + Math.sin(Date.now() * 0.0009) * 220;
    boss2.vx += (targetX - (boss2.x + boss2.w / 2)) * 0.004;
    boss2.vx  = Math.max(-3.5, Math.min(3.5, boss2.vx));
    boss2.x  += boss2.vx;
    boss2.y   = BOSS2_HOVER_Y + Math.sin(Date.now() * 0.003) * 14;
    boss2.facing = boss2.vx > 0 ? 1 : -1;
  };
  const toHover = (timer) => { boss2.state = 'hover'; boss2.stateTimer = timer; };

  if (boss2.state === 'shriek') {
    boss2.y = BOSS2_HOVER_Y + Math.sin(Date.now() * 0.05) * 3;
    if (boss2.stateTimer <= 0) {
      const cx = boss2.x + boss2.w / 2, cy = boss2.y + boss2.h / 2;
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        boss2.projectiles.push({ type: 'spiral', x: cx, y: cy, vx: Math.cos(a) * 3.4, vy: Math.sin(a) * 3.4, r: 8, life: 220 });
      }
      toHover(45);
    }

  } else if (boss2.state === 'hover') {
    hoverDrift();
    if (boss2.stateTimer <= 0) {
      const pattern = boss2.phase === 2
        ? ['swoop','spiral','blink','swoop','summon','burst','blink','swoop']
        : ['swoop','burst','summon','swoop','burst'];
      const next = pattern[boss2AttackIdx % pattern.length];
      boss2AttackIdx++;

      if (next === 'burst') {
        fireBoss2Burst();
        boss2.stateTimer = boss2.phase === 2 ? 40 : 55;
      } else if (next === 'summon') {
        summonBats();
        boss2.stateTimer = 60;
      } else if (next === 'spiral') {
        boss2.state = 'spiral'; boss2.stateTimer = 75; boss2.vx = 0;
      } else if (next === 'blink') {
        boss2.state = 'blink'; boss2.blinkPhase = 'out'; boss2.stateTimer = 20;
      } else {
        // aviso antes de lanzarse en picado
        boss2.state = 'swoopPrep';
        boss2.stateTimer = boss2.phase === 2 ? 14 : 22;
      }
    }

  } else if (boss2.state === 'swoopPrep') {
    boss2.vx *= 0.8; boss2.x += boss2.vx;
    const pdx = (player.x + player.w / 2) - (boss2.x + boss2.w / 2);
    boss2.facing = pdx > 0 ? 1 : -1;
    if (boss2.stateTimer <= 0) {
      boss2.state = 'swoop';
      boss2.swoopPhase = 'down';
      boss2.stateTimer = 200;
    }

  } else if (boss2.state === 'spiral') {
    boss2.y = BOSS2_HOVER_Y + Math.sin(Date.now() * 0.003) * 6;
    if (boss2.stateTimer % 5 === 0) {
      const cx = boss2.x + boss2.w / 2, cy = boss2.y + boss2.h / 2;
      for (const off of [0, Math.PI]) {
        const a = boss2.spiralA + off;
        boss2.projectiles.push({ type: 'spiral', x: cx, y: cy, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, r: 7, life: 220 });
      }
      boss2.spiralA += 0.35;
    }
    if (boss2.stateTimer <= 0) toHover(45);

  } else if (boss2.state === 'blink') {
    if (boss2.blinkPhase === 'out') {
      boss2.alpha = Math.max(0, boss2.stateTimer / 20);
      if (boss2.stateTimer <= 0) {
        // reaparece encima del jugador, a un lado
        const side = Math.random() < 0.5 ? -1 : 1;
        boss2.x = Math.max(40, Math.min(W - 40 - boss2.w, player.x + side * 170));
        boss2.y = BOSS2_HOVER_Y;
        boss2.blinkPhase = 'in'; boss2.stateTimer = 20;
      }
    } else {
      boss2.alpha = Math.min(1, 1 - boss2.stateTimer / 20);
      if (boss2.stateTimer <= 0) {
        boss2.alpha = 1;
        fireBoss2Burst();
        toHover(40);
      }
    }

  } else if (boss2.state === 'swoop') {
    const spd = boss2.phase === 2 ? 1.1 : 0.8;
    if (boss2.swoopPhase === 'down') {
      const pdx = (player.x + player.w / 2) - (boss2.x + boss2.w / 2);
      boss2.vx += Math.sign(pdx) * spd;
      boss2.vx  = Math.max(-10, Math.min(10, boss2.vx));
      boss2.vy += spd * 0.9;
      boss2.vy  = Math.min(11, boss2.vy);
      boss2.x  += boss2.vx;
      boss2.y  += boss2.vy;
      boss2.facing = boss2.vx > 0 ? 1 : -1;
      if (boss2.y > 370 || boss2.stateTimer <= 80) {
        boss2.swoopPhase = 'up';
        boss2.vy = -14;
      }
    } else {
      boss2.vx *= 0.92;
      boss2.vy *= 0.92;
      boss2.x  += boss2.vx;
      boss2.y  += boss2.vy;
      if (boss2.y <= BOSS2_HOVER_Y) {
        boss2.y = BOSS2_HOVER_Y; boss2.vy = 0; boss2.vx = 0;
        toHover(boss2.phase === 2 ? 35 : 55);
      }
    }
    if (boss2.stateTimer <= 0) {
      boss2.y = BOSS2_HOVER_Y; boss2.vy = 0; boss2.vx = 0;
      toHover(45);
    }
  }
}

function checkBoss2Collisions() {
  if (currentRoom !== 3 || boss2.dead) return;

  const atkW = 52, atkH = 30;
  const atkX = player.facing === 1 ? player.x + player.w : player.x - atkW;
  const atkY = player.y + 6;

  const b2solid = boss2.state !== 'shriek' && boss2.alpha > 0.5;
  if (player.attackActive > 0 && boss2.invFrames === 0 && b2solid &&
      collideRect(atkX, atkY, atkW, atkH, boss2.x, boss2.y, boss2.w, boss2.h)) {
    boss2.hp -= playerDmg;
    boss2.invFrames = 26;
    if (boss2.hp <= 0) { boss2.hp = 0; boss2.dead = true; boss2.deathTimer = 150; boss2.projectiles = []; return; }
  }

  const onBoss2  = collideRect(player.x, player.y, player.w, player.h, boss2.x, boss2.y, boss2.w, boss2.h);
  const fromTop2 = player.vy > 1 && (player.y + player.h) < (boss2.y + boss2.h * 0.5);
  if (onBoss2 && fromTop2 && boss2.invFrames === 0 && b2solid) {
    boss2.hp -= playerDmg;
    boss2.invFrames = 26;
    player.vy = -13;
    if (boss2.hp <= 0) { boss2.hp = 0; boss2.dead = true; boss2.deathTimer = 150; boss2.projectiles = []; return; }
  }

  if (player.invFrames === 0 && !fromTop2 && boss2.alpha > 0.5 &&
      collideRect(player.x + 3, player.y + 3, player.w - 6, player.h - 3, boss2.x, boss2.y, boss2.w, boss2.h)) {
    if (!godMode) {
      player.hp--;
      if (player.hp <= 0) { player.hp = 0; isDeath = true; startTransition(0, 80, 400); return; }
    }
    player.invFrames = 90;
    const dir = (player.x + player.w / 2) < (boss2.x + boss2.w / 2) ? -1 : 1;
    player.vx = dir * 7; player.vy = -8;
  }

  for (let i = boss2.projectiles.length - 1; i >= 0; i--) {
    const p = boss2.projectiles[i];
    if (player.attackActive > 0 &&
        collideRect(atkX, atkY, atkW, atkH, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2)) {
      boss2.projectiles.splice(i, 1); continue;
    }
    const dist = Math.hypot((player.x + player.w / 2) - p.x, (player.y + player.h / 2) - p.y);
    if (dist < p.r + 12 && player.invFrames === 0) {
      if (!godMode) {
        player.hp--;
        if (player.hp <= 0) { player.hp = 0; isDeath = true; startTransition(0, 80, 400); return; }
      }
      boss2.projectiles.splice(i, 1);
      player.invFrames = 70;
      const dir = player.x < p.x ? -1 : 1;
      player.vx = dir * 5; player.vy = -6;
    }
  }
}

function drawBoss2() {
  if (currentRoom !== 3) return;

  for (const p of boss2.projectiles) drawBossProjectile(p, '220,130,255', '#c070ff');

  if (boss2.dead) {
    if (boss2.deathTimer <= 0) return;
    drawBossDeath(boss2.x + boss2.w / 2, boss2.y + boss2.h / 2, boss2.deathTimer / 150,
      ['#ff80ff','#ffffff','#8080ff','#ffff80','#80ffff','#ff80a0'], 130);
    return;
  }

  const cx = Math.round(boss2.x + boss2.w / 2), cy = Math.round(boss2.y + boss2.h / 2);
  const hw = boss2.w / 2, hh = boss2.h / 2;
  const hy = -hh + 4;
  const t  = Date.now() * 0.002;
  const p2 = boss2.phase === 2;
  const base = (boss2.invFrames > 0 && Math.floor(boss2.invFrames / 4) % 2 === 0 ? 0.35 : 1) * (boss2.alpha ?? 1);
  const main = p2 ? '255,32,96' : '96,32,192';   // color del aura

  ctx.save();
  ctx.translate(cx, cy);

  // Aura fantasmal
  const aura = ctx.createRadialGradient(0, 0, 10, 0, 0, hw * 1.8);
  aura.addColorStop(0, `rgba(${main},${(0.3 * base).toFixed(2)})`);
  aura.addColorStop(1, `rgba(${main},0)`);
  ctx.fillStyle = aura; ctx.beginPath(); ctx.arc(0, 0, hw * 1.8, 0, Math.PI * 2); ctx.fill();

  // Chispas que giran alrededor
  for (let i = 0; i < 6; i++) {
    const a = t * 1.5 + i * Math.PI / 3, r = hw + 18 + Math.sin(t * 3 + i) * 6;
    ctx.globalAlpha = base * (0.5 + 0.5 * Math.sin(t * 4 + i));
    ctx.fillStyle = p2 ? '#ffb0c8' : '#d8b0ff';
    ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r * 0.6, 1.8, 0, Math.PI * 2); ctx.fill();
  }

  ctx.scale(boss2.facing, 1);

  // Estela fantasmal
  ctx.globalAlpha = base * 0.16;
  ctx.fillStyle = p2 ? '#ff2060' : '#6020c0';
  for (let i = 1; i <= 3; i++) {
    ctx.beginPath();
    ctx.ellipse(-boss2.vx * i * 2.5, -boss2.vy * i * 1.5, hw * 0.75, hh * 0.75, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = base;

  // Alas de murciélago con membrana y huesos
  const wf = Math.sin(t * 5) * 0.28;
  const tip = -18 + Math.sin(t * 4) * 10;
  const wingG = ctx.createLinearGradient(0, -20, 0, 24);
  wingG.addColorStop(0, p2 ? '#4a1028' : '#2a1458');
  wingG.addColorStop(1, p2 ? '#14040c' : '#0a0420');
  for (const s of [-1, 1]) {
    ctx.save();
    ctx.rotate(s * -wf);
    ctx.scale(s, 1);
    ctx.fillStyle = wingG;
    ctx.beginPath();
    ctx.moveTo(-hw, 4);
    ctx.quadraticCurveTo(-hw - 30, tip - 14, -hw - 58, tip);
    ctx.quadraticCurveTo(-hw - 50, 4, -hw - 46, 16);
    ctx.quadraticCurveTo(-hw - 38, 8, -hw - 30, 20);
    ctx.quadraticCurveTo(-hw - 22, 12, -hw - 14, 22);
    ctx.quadraticCurveTo(-hw - 8, 14, -hw, 18);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = p2 ? 'rgba(255,120,170,0.5)' : 'rgba(170,120,255,0.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-hw, 6); ctx.lineTo(-hw - 58, tip);
    ctx.moveTo(-hw - 20, tip * 0.5 - 4); ctx.lineTo(-hw - 46, 16);
    ctx.moveTo(-hw - 14, tip * 0.4 - 2); ctx.lineTo(-hw - 30, 20);
    ctx.stroke();
    ctx.restore();
  }

  // Cola fantasmal en tres jirones
  for (let k = 0; k < 3; k++) {
    ctx.globalAlpha = base * (0.45 - k * 0.1);
    ctx.fillStyle = p2 ? '#4a0a2a' : '#26104e';
    const off = (k - 1) * 10, sw = Math.sin(t * 3 + k) * 10;
    ctx.beginPath();
    ctx.moveTo(-hw * 0.6 + off, hh - 4);
    ctx.quadraticCurveTo(-hw * 0.4 + off + sw, hh + 22, off + sw * 1.4, hh + 40 + k * 4);
    ctx.quadraticCurveTo(hw * 0.4 + off + sw, hh + 22, hw * 0.6 + off, hh - 4);
    ctx.closePath(); ctx.fill();
  }

  // Cuerpo fantasmal con brillo interior
  ctx.globalAlpha = base * 0.92;
  ctx.fillStyle = vol(0, hh * 0.1, hw * 0.9, p2 ? '#5a1a34' : '#2e1660', p2 ? '#14040c' : '#08031a');
  ctx.beginPath(); ctx.ellipse(0, hh * 0.1, hw * 0.88, hh * 0.85, 0, 0, Math.PI * 2); ctx.fill();
  const core = ctx.createRadialGradient(2, hh * 0.28, 0, 2, hh * 0.28, hw * 0.55);
  core.addColorStop(0, p2 ? 'rgba(255,90,140,0.55)' : 'rgba(170,110,255,0.55)');
  core.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.ellipse(2, hh * 0.28, hw * 0.5, hh * 0.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = base;

  // Orejas
  for (const s of [-1, 1]) {
    ctx.fillStyle = vol(s * 17, hy - 18, 10, p2 ? '#4a1428' : '#2a1450', p2 ? '#14040c' : '#08031a');
    ctx.beginPath(); ctx.arc(s * 17, hy - 18, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = vol(s * 17, hy - 17, 5, p2 ? '#c05a8a' : '#9a70d0', p2 ? '#5a1a3a' : '#40206a');
    ctx.beginPath(); ctx.arc(s * 17, hy - 17, 4.5, 0, Math.PI * 2); ctx.fill();
  }

  // Cabeza
  ctx.fillStyle = vol(0, hy, 22, p2 ? '#4a1428' : '#2a1450', p2 ? '#12040a' : '#070214');
  ctx.beginPath(); ctx.arc(0, hy, 22, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = p2 ? 'rgba(255,100,150,0.35)' : 'rgba(160,110,255,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();

  // Corona espectral que brilla
  const cc2 = p2 ? '#cc2040' : '#9030e0';
  ctx.save();
  ctx.shadowColor = cc2; ctx.shadowBlur = 14;
  const crownG = ctx.createLinearGradient(0, hy - 40, 0, hy - 17);
  crownG.addColorStop(0, p2 ? '#ffb0c0' : '#e0c0ff'); crownG.addColorStop(1, cc2);
  ctx.fillStyle = crownG;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath(); ctx.moveTo(i * 11 - 5, hy - 17); ctx.lineTo(i * 11, hy - (i === 0 ? 40 : 34)); ctx.lineTo(i * 11 + 5, hy - 17); ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle = cc2; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, hy - 17, 16, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  ctx.restore();

  // Máscara (dos ojos)
  ctx.fillStyle = '#060010';
  ctx.beginPath(); ctx.ellipse(8, hy - 1, 13, 9, 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-9, hy - 1.5, 10, 8, -0.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillRect(-2, hy - 6, 3, 8);

  // Segundo ojo (un poco más pequeño, por la perspectiva)
  const ecB = p2 ? '#ff1850' : '#a030ff';
  const epB = 1 + 0.3 * Math.sin(t * 4.5 + 0.6);
  ctx.save();
  const egB = ctx.createRadialGradient(-9, hy - 1.5, 0, -9, hy - 1.5, 11 * epB);
  egB.addColorStop(0, p2 ? 'rgba(255,170,192,0.85)' : 'rgba(208,160,255,0.85)'); egB.addColorStop(1, 'rgba(160,80,255,0)');
  ctx.fillStyle = egB;
  ctx.beginPath(); ctx.arc(-9, hy - 1.5, 11 * epB, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = vol(-9, hy - 1.5, 5, '#ffffff', ecB);
  ctx.beginPath(); ctx.arc(-9, hy - 1.5, 5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#10001a';
  ctx.beginPath(); ctx.ellipse(-8.4, hy - 1.5, 1.3, 3.4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-10.4, hy - 3.2, 1.5, 0, Math.PI * 2); ctx.fill();

  // Ojo grande que late
  const ec2 = p2 ? '#ff1850' : '#a030ff';
  const ep2v = 1 + 0.3 * Math.sin(t * 4.5);
  ctx.save();
  ctx.shadowColor = ec2; ctx.shadowBlur = 16;
  const eg2 = ctx.createRadialGradient(8, hy - 1, 0, 8, hy - 1, 14 * ep2v);
  eg2.addColorStop(0, p2 ? 'rgba(255,170,192,0.9)' : 'rgba(208,160,255,0.9)'); eg2.addColorStop(1, 'rgba(160,80,255,0)');
  ctx.fillStyle = eg2;
  ctx.beginPath(); ctx.arc(8, hy - 1, 14 * ep2v, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = vol(8, hy - 1, 6.5, '#ffffff', ec2);
  ctx.beginPath(); ctx.arc(8, hy - 1, 6.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#10001a';
  ctx.beginPath(); ctx.ellipse(8.8, hy - 1, 1.6, 4.4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(6, hy - 3, 2, 0, Math.PI * 2); ctx.fill();

  // Hocico y bigotes
  ctx.fillStyle = vol(-2, hy + 9, 10, p2 ? '#6a2a44' : '#3e2266', p2 ? '#2a0a18' : '#160830');
  ctx.beginPath(); ctx.ellipse(-2, hy + 9, 10, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#050010';
  ctx.beginPath(); ctx.ellipse(-2, hy + 6, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 0.9; ctx.lineCap = 'round';
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(s * 4, hy + 9);  ctx.lineTo(s * 22, hy + 7);  ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s * 4, hy + 11); ctx.lineTo(s * 22, hy + 13); ctx.stroke();
  }

  ctx.restore();

  if (boss2.state === 'swoopPrep') drawWarning(cx, cy - hh - 50, p2 ? '#ff4070' : '#c080ff');
  if (boss2.state === 'shriek') drawRoarRings(cx, cy, (Date.now() * 0.0018) % 1, p2 ? '255,60,120' : '180,90,255');
  if (boss2.state === 'spiral') {
    // círculo mágico que gira
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(Date.now() * 0.003);
    ctx.strokeStyle = 'rgba(255,120,180,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, hw + 22, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * (hw + 22), Math.sin(a) * (hw + 22));
      ctx.lineTo(Math.cos(a + Math.PI / 1.5) * (hw + 22), Math.sin(a + Math.PI / 1.5) * (hw + 22)); ctx.stroke();
    }
    ctx.restore();
  }
}

function drawBoss2UI() {
  if (currentRoom !== 3) return;

  // Reja bloqueando la bajada mientras el guardián vive
  if (!boss2Defeated) {
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(370, H - 24, 220, 24);
    for (let bx = 378; bx < 582; bx += 26) {
      ctx.fillStyle = '#3a2850';
      ctx.fillRect(bx, H - 24, 14, 24);
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.fillRect(bx + 2, H - 24, 4, 24);
    }
  } else {
    // Hueco abierto — brillo indicando salida
    const pulse = 0.15 + 0.08 * Math.sin(Date.now() * 0.003);
    ctx.fillStyle = `rgba(180,100,255,${pulse})`;
    ctx.fillRect(370, H - 18, 220, 18);
  }

  // Barra de vida
  if (!boss2.dead) {
    const barW = 420, barH = 18, bx = (W - barW) / 2, by = H - 44;
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(bx - 6, by - 26, barW + 12, barH + 36);
    ctx.fillStyle = boss2.phase === 2 ? '#dd2255' : '#8822ee';
    ctx.font = 'bold 14px serif'; ctx.textAlign = 'center';
    ctx.fillText('✦  EL GUARDIÁN DE LA CIMA  ✦', W / 2, by - 8);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(bx, by, barW, barH);
    const fill = (boss2.hp / boss2.maxHp) * barW;
    ctx.fillStyle = boss2.phase === 2 ? '#dd2255' : '#8822ee';
    ctx.fillRect(bx, by, fill, barH);
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(bx, by, fill, barH / 2);
    ctx.strokeStyle = boss2.phase === 2 ? '#ff5577' : '#bb66ff';
    ctx.lineWidth = 1.5; ctx.strokeRect(bx, by, barW, barH);
  }

  // Victoria
  if (boss2Defeated && boss2.deathTimer === 0) {
    ctx.save();
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = '#e0c0ff'; ctx.font = 'bold 34px serif'; ctx.textAlign = 'center';
    ctx.fillText('¡El Guardián ha caído!', W / 2, 110);
    ctx.font = '18px serif'; ctx.fillStyle = '#ffffff';
    ctx.fillText('¡Has conquistado la Cima!  Puedes bajar.', W / 2, 145);
    const pulse = 0.3 + 0.2 * Math.sin(Date.now() * 0.004);
    const g = ctx.createLinearGradient(0, H - 70, 0, H);
    g.addColorStop(0, 'rgba(180,100,255,0)'); g.addColorStop(1, `rgba(180,100,255,${pulse})`);
    ctx.fillStyle = g; ctx.globalAlpha = 1;
    ctx.fillRect(360, H - 70, 240, 70);
    ctx.restore();
  }
}

// ─── DIBUJAR ──────────────────────────────────────────────────────────────────
function drawBackground(room) {
  const [c1, c2] = room.bg;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, c1);
  g.addColorStop(1, c2);
  ctx.fillStyle = g;
  if (room.style) { ctx.fillRect(0, 0, W, H); return; } // las salas con estilo propio dibujan su fondo
  // degradado + luz ambiental: no cambian, se dibujan una vez y se reutilizan
  ctx.drawImage(cachedLayer('bg|' + currentRoom, c => {
    const cg = c.createLinearGradient(0, 0, 0, H);
    cg.addColorStop(0, c1); cg.addColorStop(1, c2);
    c.fillStyle = cg; c.fillRect(0, 0, W, H);
    const amb = c.createRadialGradient(W / 2, H * 0.35, 20, W / 2, H * 0.35, 560);
    amb.addColorStop(0, hexAlpha(room.particleColor, 0.13));
    amb.addColorStop(1, hexAlpha(room.particleColor, 0));
    c.fillStyle = amb; c.fillRect(0, 0, W, H);
  }), 0, 0, W, H);
  // bruma baja que se mueve despacio
  const tt = Date.now() * 0.00015;
  for (let i = 0; i < 3; i++) {
    const fx = ((i * 380 + tt * 900 * (i % 2 ? 1 : -1)) % (W + 400) + W + 400) % (W + 400) - 200;
    const fg = ctx.createRadialGradient(fx, H - 70, 0, fx, H - 70, 260);
    fg.addColorStop(0, hexAlpha(room.particleColor, 0.07));
    fg.addColorStop(1, hexAlpha(room.particleColor, 0));
    ctx.fillStyle = fg; ctx.fillRect(fx - 260, H - 330, 520, 330);
  }
}

// Viñeta: oscurece un poco los bordes para dar profundidad
function drawVignette(room) {
  if (room.style) return;
  ctx.drawImage(cachedLayer('vignette', c => {
    const v = c.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.72);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.42)');
    c.fillStyle = v; c.fillRect(0, 0, W, H);
  }), 0, 0, W, H);
}

// Capas que no cambian (fondo, viñeta, losas): se dibujan una vez por sala y
// tamaño de pantalla, y luego solo se copian en cada fotograma
const layerCache = new Map();
function cachedLayer(key, draw) {
  const k = key + '|' + renderScale;
  let layer = layerCache.get(k);
  if (!layer) {
    layer = document.createElement('canvas');
    layer.width  = Math.round(W * renderScale);
    layer.height = Math.round(H * renderScale);
    const c = layer.getContext('2d');
    c.setTransform(renderScale, 0, 0, renderScale, 0, 0);
    draw(c);
    if (layerCache.size > 24) layerCache.clear();
    layerCache.set(k, layer);
  }
  return layer;
}

function drawDecorations(room) {
  for (const d of (room.decorations || [])) {
    if (d.type === 'nightRanges') {
      ctx.save(); ctx.translate(Math.round(camX), Math.round(camY));
      drawDecoration(room, d);
      ctx.restore();
    } else drawDecoration(room, d);
  }
}

function drawDecoration(room, d) {
  {
    if (d.type === 'bricks') {
      // muro de piedra del castillo
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      for (let row = 0, y = room.top || 0; y < H - 60; row++, y += 30) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(room.width || W, y); ctx.stroke();
        for (let x = (row % 2) * 30; x < (room.width || W); x += 60) {
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 30); ctx.stroke();
        }
      }
    }
    if (d.type === 'window') {
      ctx.fillStyle = '#05040a';
      ctx.beginPath();
      ctx.moveTo(d.x - 22, d.y + 90); ctx.lineTo(d.x - 22, d.y + 22);
      ctx.arc(d.x, d.y + 22, 22, Math.PI, 0); ctx.lineTo(d.x + 22, d.y + 90);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(160,170,255,0.10)';
      ctx.fill();
      ctx.strokeStyle = room.edgeColor; ctx.lineWidth = 4; ctx.stroke();
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x, d.y + 90); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(d.x - 22, d.y + 50); ctx.lineTo(d.x + 22, d.y + 50); ctx.stroke();
    }
    if (d.type === 'banner') {
      const sway = Math.sin(Date.now() * 0.0015 + d.x) * 3;
      ctx.fillStyle = '#5a3a20'; ctx.fillRect(d.x - 30, d.y - 4, 60, 6);
      ctx.fillStyle = '#7a1424';
      ctx.beginPath();
      ctx.moveTo(d.x - 24, d.y); ctx.lineTo(d.x + 24, d.y);
      ctx.lineTo(d.x + 24 + sway, d.y + 110); ctx.lineTo(d.x + sway, d.y + 92);
      ctx.lineTo(d.x - 24 + sway, d.y + 110); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#d0a040';
      ctx.beginPath(); ctx.arc(d.x + sway * 0.5, d.y + 44, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7a1424';
      ctx.beginPath(); ctx.arc(d.x + sway * 0.5, d.y + 44, 5, 0, Math.PI * 2); ctx.fill();
    }
    if (d.type === 'torch') {
      const f = 0.8 + 0.2 * Math.sin(Date.now() * 0.02 + d.x);
      const g = ctx.createRadialGradient(d.x, d.y - 12, 0, d.x, d.y - 12, 70 * f);
      g.addColorStop(0, 'rgba(255,160,60,0.30)');
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(d.x, d.y - 12, 70 * f, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#4a3a2a'; ctx.fillRect(d.x - 3, d.y - 4, 6, 18);
      ctx.fillStyle = '#ffb040';
      ctx.beginPath(); ctx.ellipse(d.x, d.y - 12, 6 * f, 11 * f, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff0b0';
      ctx.beginPath(); ctx.ellipse(d.x, d.y - 9, 2.5, 5, 0, 0, Math.PI * 2); ctx.fill();
    }
    if (d.type === 'floatStones') drawFloatStones(room);
    if (d.type === 'ruinedWalls') drawRuinedWalls(room);
    if (d.type === 'nightRanges') {
      // level 0 = La Cumbre; cada nivel más es más de noche y estás más alto
      const L = d.level || 0, dk = hex => L ? shadeHex(hex, -L * 0.17) : hex;
      const dy = L * 38;
      // cielo nocturno
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, dk('#010208')); g.addColorStop(0.55, dk('#060a1c')); g.addColorStop(1, dk('#0e1430'));
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // estrellas
      for (let k = 0; k < 70; k++) {
        const sx = (k * 137.5) % W, sy = (k * 53.3) % 260;
        const tw = 0.45 + 0.55 * Math.abs(Math.sin(Date.now() * 0.0015 + k));
        ctx.fillStyle = `rgba(255,255,255,${(tw * (k % 3 ? 0.55 : 0.9)).toFixed(2)})`;
        ctx.beginPath(); ctx.arc(sx, sy, k % 5 ? 1 : 1.7, 0, Math.PI * 2); ctx.fill();
      }
      // luna (se va poniendo detrás de las montañas hasta desaparecer)
      if (L < 4) {
      if (L) { ctx.save(); ctx.globalAlpha = 1 - L * 0.22; ctx.translate(L * 40, L * 70); }
      const mg = ctx.createRadialGradient(170, 90, 0, 170, 90, 120);
      mg.addColorStop(0, 'rgba(220,230,255,0.18)'); mg.addColorStop(1, 'rgba(220,230,255,0)');
      ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(170, 90, 120, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#eef2ff'; ctx.beginPath(); ctx.arc(170, 90, 30, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(170,180,215,0.35)';
      ctx.beginPath(); ctx.arc(160, 82, 6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(181, 100, 4, 0, Math.PI * 2); ctx.fill();
      if (L) ctx.restore();
      }

      // cordilleras: de la más lejana a la más cercana, con nieve en los picos
      const range = (pts, top, bottom, snow) => {
        if (dy) pts = pts.map(([x, y]) => [x, y + dy]);
        const lg = ctx.createLinearGradient(0, Math.min(...pts.map(q => q[1])), 0, H);
        lg.addColorStop(0, top); lg.addColorStop(1, bottom);
        ctx.fillStyle = lg;
        ctx.beginPath(); ctx.moveTo(0, H);
        for (const [x, y] of pts) ctx.lineTo(x, y);
        ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
        ctx.fillStyle = snow;
        for (let k = 1; k < pts.length - 1; k++) {
          const [x, y] = pts[k], [x0, y0] = pts[k - 1], [x1, y1] = pts[k + 1];
          if (y >= y0 || y >= y1) continue; // solo picos
          const f = 0.32;
          const lx = x + (x0 - x) * f, ly = y + (y0 - y) * f;
          const rx = x + (x1 - x) * f, ry = y + (y1 - y) * f;
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(rx, ry);
          ctx.lineTo(x + (rx - x) * 0.5, y + (ry - y) * 0.75);
          ctx.lineTo(x, y + Math.max(ly - y, ry - y) * 0.6);
          ctx.lineTo(x + (lx - x) * 0.5, y + (ly - y) * 0.75);
          ctx.lineTo(lx, ly); ctx.closePath(); ctx.fill();
        }
      };
      const sn = a => `rgba(200,212,240,${(a * (1 - L * 0.15)).toFixed(2)})`;
      range([[0,250],[70,190],[140,230],[220,150],[300,215],[370,170],[450,230],[530,140],[610,205],[690,160],[770,220],[850,150],[920,200],[960,180]],
            dk('#1c2442'), dk('#121830'), L ? sn(0.35) : 'rgba(200,212,240,0.35)');
      range([[0,300],[90,240],[170,290],[260,215],[350,280],[440,230],[520,295],[620,220],[710,285],[800,235],[890,290],[960,250]],
            dk('#121a34'), dk('#0b1024'), L ? sn(0.45) : 'rgba(210,220,245,0.45)');
      range([[0,360],[110,300],[210,350],[330,290],[430,345],[560,300],[680,350],[790,305],[900,350],[960,320]],
            dk('#0a0f22'), dk('#05081a'), L ? sn(0.55) : 'rgba(220,228,250,0.55)');
      // bruma nocturna al pie
      const hz = ctx.createLinearGradient(0, 330, 0, H);
      hz.addColorStop(0, 'rgba(80,100,160,0)'); hz.addColorStop(1, L ? `rgba(80,100,160,${(0.10 * (1 - L * 0.2)).toFixed(3)})` : 'rgba(80,100,160,0.10)');
      ctx.fillStyle = hz; ctx.fillRect(0, 330, W, H - 330);
    }
    if (d.type === 'pillar') {
      ctx.fillStyle = room.edgeColor;
      ctx.fillRect(d.x - 12, d.y - d.h, 24, d.h);
      ctx.fillStyle = room.platColor;
      ctx.fillRect(d.x - 14, d.y - d.h, 28, 10);
      ctx.fillRect(d.x - 14, d.y - 10,  28, 10);
    }
    if (d.type === 'arch') {
      ctx.strokeStyle = room.edgeColor;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(d.x, H - 60);
      ctx.lineTo(d.x, d.y + 60);
      ctx.arcTo(d.x + 40, d.y, d.x + 80, d.y + 60, 40);
      ctx.lineTo(d.x + 80, H - 60);
      ctx.stroke();
    }
    if (d.type === 'crystal') {
      // columna de cristal semitransparente
      ctx.fillStyle = hexAlpha(room.particleColor, 0.08);
      ctx.fillRect(d.x, d.y, 4, d.h);
      ctx.fillStyle = hexAlpha(room.particleColor, 0.15);
      ctx.fillRect(d.x + 1, d.y, 2, d.h);
    }
    if (d.type === 'mushroom') {
      // sombrero
      ctx.fillStyle = '#5a3010';
      ctx.beginPath();
      ctx.ellipse(d.x, d.y - 26, 22, 14, 0, Math.PI, 0);
      ctx.fill();
      // tallo
      ctx.fillStyle = '#8a6040';
      ctx.fillRect(d.x - 6, d.y - 26, 12, 26);
      // manchas
      ctx.fillStyle = '#c09060';
      ctx.beginPath();
      ctx.ellipse(d.x - 8, d.y - 32, 5, 4, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(d.x + 6, d.y - 28, 4, 3, 0.2, 0, Math.PI * 2);
      ctx.fill();
    }
    if (d.type === 'star') {
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(Date.now() * 0.002 + d.x);
      ctx.beginPath();
      ctx.arc(d.x, d.y, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (d.type === 'throne') {
      ctx.fillStyle = '#3a1010';
      // asiento
      ctx.fillRect(d.x, d.y + 60, 100, 20);
      // respaldo
      ctx.fillRect(d.x + 10, d.y, 80, 65);
      // puntas
      ctx.fillStyle = '#601818';
      ctx.fillRect(d.x + 10, d.y - 20, 16, 25);
      ctx.fillRect(d.x + 42, d.y - 30, 16, 35);
      ctx.fillRect(d.x + 74, d.y - 20, 16, 25);
    }
  }
}

function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function drawParticles() {
  if (ROOMS[currentRoom].noParticles) return;
  for (const p of particles) {
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPlatforms(room) {
  if (!room.style && !room.width) ctx.drawImage(slabLayer(room), 0, 0, W, H);
  for (const p of room.platforms) {
    if (p.trapdoor && boss2Defeated) {
      // Portal abierto: vacío oscuro con bordes que brillan en púrpura
      const pulse = 0.45 + 0.25 * Math.sin(Date.now() * 0.004);
      ctx.fillStyle = '#000000';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      // borde superior
      const gTop = ctx.createLinearGradient(0, p.y, 0, p.y + 18);
      gTop.addColorStop(0, `rgba(192,100,255,${pulse + 0.15})`);
      gTop.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gTop; ctx.fillRect(p.x, p.y, p.w, 18);
      // borde izquierdo
      const gL = ctx.createLinearGradient(p.x, 0, p.x + 30, 0);
      gL.addColorStop(0, `rgba(192,100,255,${pulse})`);
      gL.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gL; ctx.fillRect(p.x, p.y, 30, p.h);
      // borde derecho
      const gR = ctx.createLinearGradient(p.x + p.w, 0, p.x + p.w - 30, 0);
      gR.addColorStop(0, `rgba(192,100,255,${pulse})`);
      gR.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gR; ctx.fillRect(p.x + p.w - 30, p.y, 30, p.h);
      // línea superior brillante
      ctx.fillStyle = `rgba(220,160,255,${pulse + 0.2})`;
      ctx.fillRect(p.x, p.y, p.w, 2);
      continue;
    }
    if (p.secretStair) { if (bossDefeated) drawSecretStair(p); continue; }
    if (room.width) { // sala grande: solo lo que se ve
      if (p.x + p.w < camX - 10 || p.x > camX + W / camZ + 10 || p.y > camY + H / camZ + 10 || p.y + p.h < camY - 10) continue;
      if (!room.style) { drawSlab(ctx, p, room); continue; }
    }
    if (room.style === 'castleRock') { drawCastleRockStone(p); continue; }
    if (room.style === 'mountain') { drawMountainRock(p, room.night); continue; }
    // las losas normales se dibujan una vez y se guardan (ver slabLayer)
  }
}

function slabLayer(room) {
  return cachedLayer('slabs|' + currentRoom + '|' + boss2Defeated, c => {
    for (const p of room.platforms) {
      if ((p.trapdoor && boss2Defeated) || p.secretStair || p.door) continue;
      drawSlab(c, p, room);
    }
  });
}

// Mezcla un color #rrggbb con blanco (amt > 0) o negro (amt < 0)
function shadeHex(hex, amt) {
  const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  const tgt = amt > 0 ? 255 : 0, k = Math.abs(amt);
  return `rgb(${c.map(v => Math.round(v + (tgt - v) * k)).join(',')})`;
}

function drawSlab(c, p, room) {
  const ground = p.h >= 40;
  // sombra suave
  c.fillStyle = 'rgba(0,0,0,0.32)';
  c.beginPath(); c.roundRect(p.x + 3, p.y + 5, p.w, p.h, 4); c.fill();
  // cuerpo con degradado
  const g = c.createLinearGradient(0, p.y, 0, p.y + p.h);
  g.addColorStop(0, shadeHex(room.floorColor, 0.12));
  g.addColorStop(1, shadeHex(room.floorColor, -0.4));
  c.fillStyle = g;
  c.beginPath(); c.roundRect(p.x, p.y, p.w, p.h, ground ? 2 : 4); c.fill();

  c.save();
  c.beginPath(); c.roundRect(p.x, p.y, p.w, p.h, ground ? 2 : 4); c.clip();
  // juntas entre losas (filas desplazadas en el suelo)
  const rowH = ground ? 28 : p.h;
  for (let row = 0, y = p.y + 4; y < p.y + p.h; row++, y += rowH) {
    if (row > 0) {
      c.fillStyle = 'rgba(0,0,0,0.35)'; c.fillRect(p.x, y - 1, p.w, 1.5);
      c.fillStyle = 'rgba(255,255,255,0.05)'; c.fillRect(p.x, y + 0.5, p.w, 1);
    }
    const off = row % 2 ? 26 : 0;
    for (let x = p.x + 52 - off; x < p.x + p.w - 6; x += 52) {
      c.fillStyle = 'rgba(0,0,0,0.38)'; c.fillRect(x, y, 1.5, rowH - 1);
      c.fillStyle = 'rgba(255,255,255,0.06)'; c.fillRect(x + 1.5, y, 1, rowH - 1);
    }
  }
  // desgaste: grietas y desconchones fijos según la posición
  const hash = n => { const v = Math.sin(n * 127.1 + p.x * 3.7 + p.y * 1.3) * 43758.5; return v - Math.floor(v); };
  for (let i = 0; i < Math.max(1, Math.floor(p.w / 70)); i++) {
    const cx = p.x + 10 + hash(i) * (p.w - 20), cy = p.y + 6 + hash(i + 9) * (p.h - 10);
    c.strokeStyle = 'rgba(0,0,0,0.3)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(cx, cy);
    c.lineTo(cx + 4 + hash(i + 3) * 4, cy + 3); c.lineTo(cx + 7, cy + 6 + hash(i + 5) * 3); c.stroke();
    c.fillStyle = 'rgba(255,255,255,0.05)';
    c.beginPath(); c.arc(p.x + 8 + hash(i + 20) * (p.w - 16), p.y + 8 + hash(i + 30) * (p.h - 12), 1.5 + hash(i + 40) * 2, 0, Math.PI * 2); c.fill();
  }
  // sombra interior en la parte de abajo
  const ig = c.createLinearGradient(0, p.y + p.h - 8, 0, p.y + p.h);
  ig.addColorStop(0, 'rgba(0,0,0,0)'); ig.addColorStop(1, 'rgba(0,0,0,0.3)');
  c.fillStyle = ig; c.fillRect(p.x, p.y + p.h - 8, p.w, 8);
  c.restore();

  // borde superior con relieve
  const eg = c.createLinearGradient(0, p.y, 0, p.y + 5);
  eg.addColorStop(0, shadeHex(room.edgeColor, 0.25));
  eg.addColorStop(1, room.edgeColor);
  c.fillStyle = eg;
  c.beginPath(); c.roundRect(p.x, p.y, p.w, 5, [ground ? 2 : 4, ground ? 2 : 4, 0, 0]); c.fill();
  c.fillStyle = 'rgba(255,255,255,0.22)';
  c.fillRect(p.x + 2, p.y, p.w - 4, 1);
  c.fillStyle = 'rgba(0,0,0,0.25)';
  c.fillRect(p.x, p.y + 5, p.w, 2);
}

// Piedra de muralla: bloques grises grandes y redondeados (estilo Castle Rock)
function drawCastleRockStone(p) {
  const ground = p.h >= 40;
  const block = (x, y, w, h) => {
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, '#7a7472'); g.addColorStop(0.5, '#625c5c'); g.addColorStop(1, '#464042');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,245,235,0.07)';
    ctx.beginPath(); ctx.roundRect(x + 4, y + 3, w - 8, 3, 2); ctx.fill();
  };
  ctx.save();
  const bot = p.y + p.h;
  ctx.beginPath(); ctx.rect(p.x, p.y - 4, p.w, (ground ? bot : p.y + p.h + 30) - p.y + 4); ctx.clip();
  if (ground) {
    // camino de ronda
    ctx.fillStyle = '#2e2828'; ctx.fillRect(p.x, p.y, p.w, bot - p.y);
    const tg = ctx.createLinearGradient(0, p.y, 0, p.y + 12);
    tg.addColorStop(0, '#8a8480'); tg.addColorStop(1, '#625c5a');
    ctx.fillStyle = tg; ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, 12, 4); ctx.fill();
    // fila de bloques grandes
    for (let x = p.x - 10; x < p.x + p.w; x += 72) block(x + 2, p.y + 14, 68, 28);
    // arcos oscuros debajo
    for (let x = p.x + 10; x < p.x + p.w; x += 48) {
      ctx.fillStyle = '#2a2224';
      if (bot - p.y < 80) continue;
      ctx.beginPath(); ctx.moveTo(x, bot); ctx.lineTo(x, p.y + 56); ctx.arc(x + 14, p.y + 56, 14, Math.PI, 0); ctx.lineTo(x + 28, bot); ctx.closePath(); ctx.fill();
    }
  } else {
    // repisa de piedra con ménsulas
    ctx.fillStyle = '#2e2828';
    for (const cx of [p.x + 16, p.x + p.w - 16]) {
      ctx.beginPath(); ctx.roundRect(cx - 11, p.y + p.h - 2, 22, 10, [0, 0, 6, 6]); ctx.fill();
      ctx.beginPath(); ctx.roundRect(cx - 7,  p.y + p.h + 6, 14, 9,  [0, 0, 7, 7]); ctx.fill();
    }
    ctx.fillStyle = '#2e2828'; ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, p.h, 6); ctx.fill();
    const n = Math.max(1, Math.round(p.w / 56)), bw = p.w / n;
    for (let k = 0; k < n; k++) block(p.x + k * bw + 1, p.y, bw - 2, p.h);
  }
  ctx.restore();
}

// Roca de montaña con nieve encima (más oscura cuanto más de noche)
function drawMountainRock(p, night) {
  const ground = p.h >= 40, k = night * 0.1;
  const bottom = p.y + p.h;
  const g = ctx.createLinearGradient(0, p.y, 0, bottom);
  g.addColorStop(0, shadeHex('#4a5068', -k)); g.addColorStop(1, shadeHex('#1a1e2e', -k));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, bottom - p.y, ground ? 3 : 6); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, bottom - p.y, ground ? 3 : 6); ctx.clip();
  // grietas de la roca
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.5;
  for (let x = p.x + 30, i = 0; x < p.x + p.w - 10; x += 64, i++) {
    const y0 = p.y + 8 + (i % 3) * 4;
    ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x + 6, y0 + 10); ctx.lineTo(x + 2, y0 + 22); ctx.stroke();
  }
  if (ground) {
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    for (let x = p.x + 12, i = 0; x < p.x + p.w; x += 52, i++) {
      ctx.beginPath(); ctx.ellipse(x, p.y + 50 + (i % 2) * 30, 18, 8, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
  // capa de nieve con borde ondulado
  const sg = ctx.createLinearGradient(0, p.y - 3, 0, p.y + 10);
  sg.addColorStop(0, shadeHex('#eef2ff', -k)); sg.addColorStop(1, shadeHex('#b8c2dc', -k));
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.moveTo(p.x - 2, p.y + 4);
  ctx.quadraticCurveTo(p.x - 2, p.y - 3, p.x + 6, p.y - 3);
  ctx.lineTo(p.x + p.w - 6, p.y - 3);
  ctx.quadraticCurveTo(p.x + p.w + 2, p.y - 3, p.x + p.w + 2, p.y + 4);
  for (let x = p.x + p.w; x > p.x; x -= 14) {
    const d = 3 + ((x * 7) % 5);
    ctx.quadraticCurveTo(x - 7, p.y + d + 3, Math.max(p.x - 2, x - 14), p.y + 4);
  }
  ctx.closePath(); ctx.fill();
}

// Oscuridad alrededor del mapache en lo alto de la montaña
function drawNightDark(room) {
  if (!room.night) return;
  const cx = player.x + player.w / 2 - camX, cy = player.y + player.h / 2 - camY;
  const g = ctx.createRadialGradient(cx, cy, 70, cx, cy, 460 - room.night * 50);
  g.addColorStop(0, 'rgba(0,0,6,0)');
  g.addColorStop(1, `rgba(0,0,6,${(room.night * 0.16).toFixed(2)})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function drawExitGlow(room) {
  if (room.hatch) drawHatch(room.hatch);
  const exits = room.exits || {};
  const pc = room.particleColor;
  const pulse = 0.2 + 0.1 * Math.sin(Date.now() * 0.003);

  if (exits.right && !(currentRoom === 3 && !boss2Defeated) && !(currentRoom === 13 && !castleDoorOpen)) {
    const RW = room.width || W;
    const g = ctx.createLinearGradient(RW - 60, 0, RW, 0);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, hexAlpha(pc, pulse));
    ctx.fillStyle = g;
    const [b0, b1] = exits.right.band || [100, H - 100];
    ctx.fillRect(RW - 60, b0, 60, b1 - b0);
  }
  if (exits.left) {
    const [b0, b1] = exits.left.band || [100, H - 100];
    const g = ctx.createLinearGradient(0, 0, 60, 0);
    g.addColorStop(0, hexAlpha(pc, pulse));
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, b0, 60, b1 - b0);
  }
  if (exits.up && !(currentRoom === 3 && !boss2Defeated) && currentRoom !== 4 && !(currentRoom === 13 && !guardsDefeated)) {
    const top = room.top || 0, [ux0, ux1] = exits.up.bandX || [360, 600];
    const g = ctx.createLinearGradient(0, top, 0, top + 60);
    g.addColorStop(0, hexAlpha(pc, pulse));
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(ux0, top, ux1 - ux0, 60);
  }
  if (exits.down && !(currentRoom === 3 && !boss2Defeated)) {
    const [dx0, dx1] = exits.down.bandX || [360, 600];
    const g = ctx.createLinearGradient(0, H - 60, 0, H);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, hexAlpha(pc, pulse));
    ctx.fillStyle = g;
    ctx.fillRect(dx0, H - 60, dx1 - dx0, 60);
  }
}

function bezierPt(t, x0, y0, cx, cy, x1, y1) {
  const m = 1 - t;
  return { x: m*m*x0 + 2*m*t*cx + t*t*x1, y: m*m*y0 + 2*m*t*cy + t*t*y1 };
}

// ─── AYUDAS DE DIBUJO ─────────────────────────────────────────────────────────
// Degradado radial con la luz arriba a la izquierda (da volumen)
function vol(x, y, r, light, dark) {
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r * 1.15);
  g.addColorStop(0, light); g.addColorStop(1, dark);
  return g;
}
// Parpadeo breve cada ~3.5 s (cada personaje con su propio ritmo)
function blinkNow(seed) {
  return ((Date.now() + seed * 977) % 3500) < 130;
}

function drawJumpPuffs() {
  for (let i = jumpPuffs.length - 1; i >= 0; i--) {
    const f = jumpPuffs[i];
    if (--f.t <= 0) { jumpPuffs.splice(i, 1); continue; }
    const k = 1 - f.t / 22;
    ctx.save();
    ctx.globalAlpha = 0.7 * (1 - k);
    ctx.strokeStyle = '#bfe4ff'; ctx.lineWidth = 2.5 * (1 - k) + 0.5;
    ctx.beginPath(); ctx.ellipse(f.x, f.y + k * 6, 10 + k * 18, 3 + k * 4, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#e8f4ff';
    for (const dx of [-1, 1]) {
      ctx.beginPath(); ctx.arc(f.x + dx * (8 + k * 16), f.y + 2 + k * 8, 3 * (1 - k) + 1, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawPlayer() {
  drawJumpPuffs();
  const px = Math.round(player.x);
  const py = Math.round(player.y);
  const f  = player.facing;
  const t  = Date.now() * 0.001;
  const air    = !player.onGround;
  const moving = player.onGround && Math.abs(player.vx) > 0.5;
  const bob = player.onGround ? Math.sin(player.bobTimer) * 1.5 : 0;
  // estirar en el aire, sin cambiar el volumen
  const sy = air ? 1 + Math.min(0.1, Math.abs(player.vy) * 0.008) : 1;
  const sx = 1 / sy;
  const hw = player.w / 2;   // 13
  const hh = player.h / 2;   // 19
  const fs = player.vx * f;  // velocidad hacia delante

  ctx.save();

  // sombra en el suelo
  if (player.onGround) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(px + hw, py + player.h + 3, hw * 0.85, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.translate(px + hw, py + hh + bob);
  ctx.rotate(Math.max(-0.12, Math.min(0.12, player.vx * 0.02)));
  ctx.scale(f * sx, sy);

  // Aura de invencibilidad
  if (godMode) {
    const gp = 0.35 + 0.2 * Math.sin(Date.now() * 0.007);
    const ag = ctx.createRadialGradient(0, 0, 6, 0, 0, 34);
    ag.addColorStop(0, `rgba(255,210,0,${gp + 0.15})`);
    ag.addColorStop(1, 'rgba(255,180,0,0)');
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI * 2); ctx.fill();
  }

  // ── COLA de mapache: gruesa, peluda, anillos gris/negro y punta negra ────
  const RINGS = 8;
  const tx0 = -hw + 3, ty0 = hh - 7;
  const tcx = -hw - 18 - fs * 1.2, tcy = hh - 22 + Math.sin(t * 3) * 2;
  const tx1 = -hw - 4 - fs * 2.2 + Math.sin(t * 2.4) * 3, ty1 = hh - 40 + Math.abs(fs) * 1.5;
  // silueta peluda por detrás
  for (let i = RINGS - 1; i >= 0; i--) {
    const k = i / (RINGS - 1), pt = bezierPt(k, tx0, ty0, tcx, tcy, tx1, ty1);
    ctx.fillStyle = '#141210';
    ctx.beginPath(); ctx.arc(pt.x, pt.y, 10.5 - k * 3.5, 0, Math.PI * 2); ctx.fill();
  }
  for (let i = RINGS - 1; i >= 0; i--) {
    const k  = i / (RINGS - 1);
    const pt = bezierPt(k, tx0, ty0, tcx, tcy, tx1, ty1);
    const r  = 9.5 - k * 3.5;
    const dark = i % 2 === 1 || i === RINGS - 1;   // la punta es negra
    ctx.fillStyle = dark ? vol(pt.x, pt.y, r, '#3a3532', '#0e0c0b') : vol(pt.x, pt.y, r, '#d2ccc2', '#7e7870');
    ctx.beginPath(); ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2); ctx.fill();
  }

  // ── PATITAS: pasos alternos al correr ─────────────────────────────────────
  const cyc = moving ? Math.sin(player.bobTimer) : 0;
  const feet = [
    { x: -5 + cyc * 3 - (air ? 2 : 0), y: hh + 1 - Math.max(0, -cyc) * 2.5 - (air ? 2 : 0), r: -0.3 },
    { x:  5 - cyc * 3 + (air ? 2 : 0), y: hh + 1 - Math.max(0,  cyc) * 2.5 - (air ? 2 : 0), r:  0.3 },
  ];

  // ── CUERPO: pelaje gris de mapache, con mechones ──────────────────────────
  ctx.fillStyle = vol(0, hh * 0.25, hw, '#aaa49a', '#4e4944');
  ctx.beginPath(); ctx.ellipse(0, hh * 0.25, hw * 0.95, hh * 0.75, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(20,18,16,0.45)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#6a655e';
  for (const [mx, my, d] of [[-hw * 0.95, 2, -1], [-hw * 0.9, 9, -1], [hw * 0.92, 6, 1]]) {
    ctx.beginPath(); ctx.moveTo(mx, my - 3); ctx.lineTo(mx + d * 3.5, my); ctx.lineTo(mx, my + 3); ctx.closePath(); ctx.fill();
  }
  // barriga clara
  ctx.fillStyle = vol(1, hh * 0.35, hw * 0.6, '#ece6da', '#b4ad9f');
  ctx.beginPath(); ctx.ellipse(1, hh * 0.35, hw * 0.52, hh * 0.5, 0, 0, Math.PI * 2); ctx.fill();

  // ── CHALECO TÁCTICO ───────────────────────────────────────────────────────
  ctx.fillStyle = vol(0, hh * 0.1, hw, '#33507a', '#121c30');
  ctx.beginPath(); ctx.ellipse(0, hh * 0.1, hw * 0.88, hh * 0.68, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1; ctx.stroke();
  // panel central y costuras
  ctx.fillStyle = vol(0, 0, hw * 0.5, '#3a5a86', '#1c2c48');
  ctx.beginPath(); ctx.ellipse(0, 0, hw * 0.38, hh * 0.52, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(140,180,230,0.25)'; ctx.lineWidth = 0.8;
  ctx.setLineDash([2, 2]);
  ctx.beginPath(); ctx.ellipse(0, 0, hw * 0.3, hh * 0.44, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);
  // correa al hombro
  ctx.strokeStyle = '#0e1626'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-hw * 0.6, -hh * 0.45); ctx.lineTo(hw * 0.55, hh * 0.45); ctx.stroke();
  // hebillas metálicas con brillo
  const buckle = ctx.createLinearGradient(0, hh * 0.05 - 2, 0, hh * 0.18 + 1);
  buckle.addColorStop(0, '#d8f0ff'); buckle.addColorStop(1, '#4a7aa0');
  ctx.fillStyle = buckle;
  ctx.beginPath(); ctx.roundRect(-3, hh * 0.18 - 2, 6, 3, 1); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-5, hh * 0.05 - 1, 4, 2, 1); ctx.fill();
  ctx.beginPath(); ctx.roundRect( 2, hh * 0.05 - 1, 4, 2, 1); ctx.fill();

  // ── IMPLANTES en la espalda (brillan suavemente) ─────────────────────────
  const ip = 0.45 + 0.25 * Math.sin(t * 4);
  ctx.strokeStyle = `rgba(80,170,255,${ip.toFixed(2)})`;
  ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-9, -6); ctx.lineTo(-7, 7);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-12, -4); ctx.lineTo(-10, 5); ctx.stroke();
  ctx.fillStyle = `rgba(120,220,255,${(ip + 0.2).toFixed(2)})`;
  ctx.beginPath(); ctx.arc(-8, -6, 1.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(-8,  2, 1.3, 0, Math.PI * 2); ctx.fill();

  // patas oscuras con deditos (las "manitas" de mapache)
  for (const ft of feet) {
    ctx.fillStyle = vol(ft.x, ft.y, 6, '#4a4440', '#141210');
    ctx.beginPath(); ctx.ellipse(ft.x, ft.y, 6, 4, ft.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2a2624';
    for (let ci = -1.5; ci <= 1.5; ci++) {
      ctx.beginPath(); ctx.ellipse(ft.x + ci * 2.4, ft.y + 3.4, 1.2, 1.9, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ── CABEZA DE MAPACHE ─────────────────────────────────────────────────────
  const hy = -hh + 4;

  // orejas algo puntiagudas con borde blanco
  for (const s of [-1, 1]) {
    ctx.fillStyle = '#f2eee6';
    ctx.beginPath();
    ctx.moveTo(s * 3.5, hy - 9); ctx.quadraticCurveTo(s * 7, hy - 21, s * 12, hy - 19);
    ctx.quadraticCurveTo(s * 15, hy - 13, s * 12.5, hy - 6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = vol(s * 9, hy - 13, 5, '#5a5550', '#262220');
    ctx.beginPath();
    ctx.moveTo(s * 5.5, hy - 9.5); ctx.quadraticCurveTo(s * 8, hy - 18.5, s * 11.3, hy - 17);
    ctx.quadraticCurveTo(s * 13, hy - 12.5, s * 11.5, hy - 7.5); ctx.closePath(); ctx.fill();
  }

  // cabeza gris
  ctx.fillStyle = vol(0, hy, 13, '#b8b2a8', '#5e5953');
  ctx.beginPath(); ctx.arc(0, hy, 13, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(20,18,16,0.45)'; ctx.lineWidth = 1; ctx.stroke();

  // mejillas peludas y blancas que sobresalen
  for (const s of [-1, 1]) {
    ctx.fillStyle = '#ece8e0';
    ctx.beginPath();
    ctx.moveTo(s * 8, hy - 1);
    ctx.lineTo(s * 17, hy + 2); ctx.lineTo(s * 13, hy + 4.5);
    ctx.lineTo(s * 16.5, hy + 8); ctx.lineTo(s * 11, hy + 8.5);
    ctx.lineTo(s * 12, hy + 11); ctx.lineTo(s * 5, hy + 8);
    ctx.closePath(); ctx.fill();
  }

  // cejas blancas sobre el antifaz (le dan cara de decidido)
  ctx.fillStyle = '#f4f0e8';
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(s * 1.5, hy - 5.5); ctx.quadraticCurveTo(s * 6, hy - 9.5, s * 11, hy - 7);
    ctx.lineTo(s * 10.5, hy - 4.5); ctx.quadraticCurveTo(s * 6, hy - 6, s * 1.5, hy - 3.5);
    ctx.closePath(); ctx.fill();
  }

  // ANTIFAZ negro de bandido: una banda que cruza los dos ojos y baja por las mejillas
  ctx.fillStyle = '#141110';
  ctx.beginPath();
  ctx.moveTo(-14, hy + 4);
  ctx.quadraticCurveTo(-14, hy - 5, -6, hy - 4.5);
  ctx.quadraticCurveTo(0, hy - 2.5, 6, hy - 4.5);
  ctx.quadraticCurveTo(14, hy - 5, 14, hy + 4);
  ctx.quadraticCurveTo(10, hy + 3, 7, hy + 3.2);
  ctx.quadraticCurveTo(3, hy + 2, 0, hy + 2.5);
  ctx.quadraticCurveTo(-3, hy + 2, -7, hy + 3.2);
  ctx.quadraticCurveTo(-10, hy + 3, -14, hy + 4);
  ctx.closePath(); ctx.fill();
  // raya oscura que baja de la frente al hocico
  ctx.fillStyle = '#4a4540';
  ctx.beginPath(); ctx.moveTo(-1.6, hy - 12); ctx.lineTo(1.6, hy - 12); ctx.lineTo(1.2, hy - 3); ctx.lineTo(-1.2, hy - 3); ctx.closePath(); ctx.fill();

  // ojos negros brillantes (parpadean de vez en cuando)
  if (blinkNow(1)) {
    ctx.strokeStyle = '#5a5550'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-8, hy - 0.5); ctx.quadraticCurveTo(-5, hy + 1, -2, hy - 0.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo( 2, hy - 0.5); ctx.quadraticCurveTo( 5, hy + 1,  8, hy - 0.5); ctx.stroke();
  } else {
    for (const s of [-1, 1]) {
      const ex = s * 5;
      ctx.fillStyle = vol(ex, hy - 0.8, 3.2, '#6a4a30', '#0a0706');
      ctx.beginPath(); ctx.arc(ex, hy - 0.8, 3.1, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(ex + 0.3, hy - 0.6, 1.9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(ex - 0.9, hy - 1.9, 1, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.arc(ex + 1.1, hy + 0.5, 0.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // hocico blanco, nariz negra y boca
  ctx.fillStyle = vol(0, hy + 6, 6.5, '#ffffff', '#cfc9be');
  ctx.beginPath(); ctx.ellipse(0, hy + 6.2, 6, 4.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = vol(0, hy + 3.6, 3.2, '#4a4444', '#050404');
  ctx.beginPath(); ctx.ellipse(0, hy + 3.6, 3.2, 2.2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.arc(-1.1, hy + 2.9, 0.8, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#3a3532'; ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.moveTo(0, hy + 5.6); ctx.lineTo(0, hy + 7);
  ctx.quadraticCurveTo(2, hy + 8.6, 3.6, hy + 7.2); ctx.stroke();

  // bigotes
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 0.8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(4,  hy + 6); ctx.lineTo(15, hy + 3.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4,  hy + 7); ctx.lineTo(15, hy + 9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4, hy + 6); ctx.lineTo(-15, hy + 3.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4, hy + 7); ctx.lineTo(-15, hy + 9); ctx.stroke();

  // bracito gris con manita oscura
  ctx.fillStyle = vol(hw - 1, -hh + 22, 6, '#9a948a', '#4e4944');
  ctx.beginPath(); ctx.ellipse(hw - 1, -hh + 22, 4, 7, 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1e1a18';
  ctx.beginPath(); ctx.ellipse(hw + 2.5, -hh + 17, 3.2, 3, 0, 0, Math.PI * 2); ctx.fill();

  // ── BLASTER ───────────────────────────────────────────────────────────────
  const metal = ctx.createLinearGradient(0, -hh + 8, 0, -hh + 22);
  metal.addColorStop(0, '#5a5a6e'); metal.addColorStop(0.45, '#2a2a36'); metal.addColorStop(1, '#121218');
  ctx.fillStyle = metal;
  ctx.beginPath();
  ctx.moveTo(hw + 2,  -hh + 8);  ctx.lineTo(hw + 30, -hh + 10);
  ctx.lineTo(hw + 30, -hh + 20); ctx.lineTo(hw + 2,  -hh + 22);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1; ctx.stroke();
  const barrel = ctx.createLinearGradient(0, -hh + 12, 0, -hh + 19);
  barrel.addColorStop(0, '#4a4a58'); barrel.addColorStop(1, '#0e0e14');
  ctx.fillStyle = barrel;
  ctx.beginPath();
  ctx.moveTo(hw + 20, -hh + 12); ctx.lineTo(hw + 42, -hh + 13);
  ctx.lineTo(hw + 42, -hh + 18); ctx.lineTo(hw + 20, -hh + 19);
  ctx.closePath(); ctx.fill();
  // brillo superior
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(hw + 3, -hh + 9); ctx.lineTo(hw + 29, -hh + 11); ctx.stroke();
  // paneles
  ctx.fillStyle = '#4e6478';
  ctx.beginPath(); ctx.roundRect(hw + 4, -hh + 10, 9, 10, 2); ctx.fill();
  ctx.fillStyle = '#34485a';
  ctx.beginPath(); ctx.roundRect(hw + 15, -hh + 11, 5, 8, 1.5); ctx.fill();
  // línea de energía que pulsa
  const ep = 0.6 + 0.4 * Math.sin(t * 6);
  ctx.strokeStyle = `rgba(60,170,255,${ep.toFixed(2)})`; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(hw + 5, -hh + 15); ctx.lineTo(hw + 19, -hh + 15); ctx.stroke();
  // boca del cañón
  const mr = 5.5 + Math.sin(t * 8) * 0.8;
  const muzzleGlow = ctx.createRadialGradient(hw + 41, -hh + 15.5, 0, hw + 41, -hh + 15.5, mr + 1);
  muzzleGlow.addColorStop(0, 'rgba(0,255,255,0.9)');
  muzzleGlow.addColorStop(1, 'rgba(0,180,255,0)');
  ctx.fillStyle = muzzleGlow;
  ctx.beginPath(); ctx.arc(hw + 41, -hh + 15.5, mr + 1, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(220,255,255,0.95)';
  ctx.beginPath(); ctx.arc(hw + 41, -hh + 15.5, 2, 0, Math.PI * 2); ctx.fill();

  // ── TAJO DE ATAQUE con estela (del color del arma) ────────────────────────
  if (player.attackActive > 0) {
    const progress = 1 - player.attackActive / 9;
    const startA   = -0.5;
    const sweepA   = progress * 1.5;
    const ax = hw + 10, ay = -hh + 15;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.shadowColor = weaponColor; ctx.shadowBlur = 16;
    for (let k = 3; k >= 0; k--) {
      const a1 = startA + sweepA - k * 0.18;
      if (a1 <= startA) continue;
      ctx.globalAlpha = (player.attackActive / 9) * (1 - k * 0.22);
      ctx.strokeStyle = k ? hexAlpha(weaponColor, 0.7) : '#ffffff';
      ctx.lineWidth = k ? 7 - k : 3;
      ctx.beginPath(); ctx.arc(ax, ay, 34 - k * 2, Math.max(startA, a1 - 0.5), a1); ctx.stroke();
    }
    const tipX = ax + Math.cos(startA + sweepA) * 34;
    const tipY = ay + Math.sin(startA + sweepA) * 34;
    ctx.globalAlpha = player.attackActive / 9;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(tipX, tipY, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Parpadeo de invencibilidad
  if (player.invFrames > 0 && Math.floor(player.invFrames / 6) % 2 === 0) {
    ctx.fillStyle = 'rgba(255,200,200,0.35)';
    ctx.beginPath(); ctx.ellipse(0, 0, hw + 4, hh + 4, 0, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();
}

function drawHeart(x, y, filled) {
  ctx.save();
  ctx.translate(x, y);
  // el último corazón late
  if (filled && player.hp === 1) {
    const b = 1 + Math.max(0, Math.sin(Date.now() * 0.012)) * 0.18;
    ctx.translate(0, 5); ctx.scale(b, b); ctx.translate(0, -5);
  }
  const heart = () => {
    ctx.beginPath();
    ctx.moveTo(0, 2);
    ctx.bezierCurveTo(-9, -5, -12, 3, 0, 10);
    ctx.bezierCurveTo(12, 3, 9, -5, 0, 2);
  };
  // sombra
  ctx.save(); ctx.translate(1, 1.5); heart();
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill(); ctx.restore();
  heart();
  if (filled) {
    const g = ctx.createRadialGradient(-3, 1, 0, 0, 4, 10);
    g.addColorStop(0, '#ff8aa0'); g.addColorStop(0.5, '#ff4466'); g.addColorStop(1, '#b01838');
    ctx.fillStyle = g;
  } else {
    ctx.fillStyle = '#3a1c2a';
  }
  ctx.fill();
  ctx.strokeStyle = filled ? '#ffb0c0' : '#663344';
  ctx.lineWidth = 1;
  ctx.stroke();
  if (filled) {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.ellipse(-4, 1.5, 2, 1.2, -0.6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ─── MAPA DETALLADO ──────────────────────────────────────────────────────────
// Cada sala es una casilla de una cuadrícula: si sales por arriba, la siguiente
// está encima; por la izquierda, a la izquierda… Así el mapa enseña el camino real.
// Las salas llevan el número del recorrido y el color de su zona.
const MAP_CELL = 40;
let mapGeoCache = null;
function mapGeo() {
  if (mapGeoCache) return mapGeoCache;
  const DIR = { right: [1, 0], left: [-1, 0], up: [0, -1], down: [0, 1] };
  const edges = [];
  for (const [id, R] of Object.entries(ROOMS)) {
    if (R.secret) continue;
    for (const [d, e] of Object.entries(R.exits || {})) if (!ROOMS[e.room].secret) edges.push([+id, d, e.room]);
    if (R.hatch) edges.push([+id, 'down', R.hatch.room]);
  }
  const cell = { 0: [0, 0] }, used = new Set(['0,0']), q = [0];
  while (q.length) {
    const a = q.shift();
    for (const [x, d, y] of edges) {
      let b = null, v = null;
      if (x === a) { b = y; v = DIR[d]; } else if (y === a) { b = x; v = DIR[d].map(c => -c); }
      if (b === null || cell[b]) continue;
      const c = [cell[a][0] + v[0], cell[a][1] + v[1]];
      if (used.has(c + '')) continue;            // atajos (trampillas, etc.): no mueven salas
      cell[b] = c; used.add(c + ''); q.push(b);
    }
  }
  const pos = {};
  for (const [r, c] of Object.entries(cell)) pos[r] = { x: c[0] * MAP_CELL, y: c[1] * MAP_CELL };
  // unión entre salas vecinas (las que se tocan en el mapa) o atajos (discontinuas)
  const links = [], seen = new Set();
  for (const [a, , b] of edges) {
    if (!pos[a] || !pos[b]) continue;
    const k = Math.min(a, b) + '-' + Math.max(a, b);
    if (seen.has(k)) continue;
    seen.add(k);
    const adj = Math.abs(cell[a][0] - cell[b][0]) + Math.abs(cell[a][1] - cell[b][1]) === 1;
    links.push([a, b, adj]);
  }
  return (mapGeoCache = { pos, links });
}

const BOSS_ROOMS = [3, 4, 13];
const MAP_ZONE_NAMES = { 0: 'Ruinas', 1: 'Cristales', 2: 'Jardín', 4: 'Rey', 3: 'La Cima', 5: 'Armería',
  6: 'Castillo', 7: 'Cumbre', 8: 'Sendero', 9: 'Ventisca', 10: 'Risco', 11: 'Pico', 13: 'Guardia', 38: 'Ruinas M.' };
// Dibuja el mapa. T convierte coordenadas del mapa a pantalla; showAll = ver salas no visitadas
function drawWorldMap(T, showAll, labels = true) {
  const G = mapGeo(), seen = r => showAll || visitedRooms.has(r) || r === currentRoom;
  const half = MAP_CELL * 0.4 * T.s;
  // uniones: puertas entre salas vecinas y atajos discontinuos
  for (const [a, b, adj] of G.links) {
    if (!seen(a) || !seen(b)) continue;
    const A = G.pos[a], B = G.pos[b];
    ctx.strokeStyle = adj ? 'rgba(210,190,255,0.85)' : 'rgba(154,106,255,0.4)';
    ctx.lineWidth = adj ? Math.max(2, 5 * T.s) : 1.2;
    ctx.setLineDash(adj ? [] : [4, 4]);
    ctx.beginPath(); ctx.moveTo(T.x(A.x), T.y(A.y)); ctx.lineTo(T.x(B.x), T.y(B.y)); ctx.stroke();
  }
  ctx.setLineDash([]);
  // salas
  for (const [rs, P] of Object.entries(G.pos)) {
    const r = +rs;
    if (!seen(r)) continue;
    const x = T.x(P.x), y = T.y(P.y), boss = BOSS_ROOMS.includes(r), main = zoneOf(r) === r;
    ctx.fillStyle = '#0a0818'; ctx.fillRect(x - half, y - half, half * 2, half * 2);
    ctx.fillStyle = boss ? 'rgba(150,30,30,0.7)' : hexAlpha(ROOMS[r].particleColor || '#9a6aff', main ? 0.5 : 0.28);
    ctx.fillRect(x - half, y - half, half * 2, half * 2);
    ctx.strokeStyle = r === currentRoom ? '#40ff90' : boss ? '#ff5050' : main ? '#f0e0ff' : 'rgba(200,180,255,0.6)';
    ctx.lineWidth = r === currentRoom ? 2.5 : main ? 1.8 : 1;
    ctx.strokeRect(x - half, y - half, half * 2, half * 2);
    if (half >= 5) {
      ctx.fillStyle = r === currentRoom ? '#40ff90' : '#ffffff';
      ctx.font = `bold ${Math.max(7, Math.round(half * 0.8))}px monospace`; ctx.textAlign = 'center';
      ctx.fillText(ROOM_ORDER.indexOf(r) + 1, x, y + half * 0.3);
    }
    if (shade && shade.room === r) { ctx.font = `${Math.max(9, half)}px monospace`; ctx.fillText('👻', x + half, y - half); }
  }
  // nombres de las zonas junto a su sala principal
  if (labels) for (const [z, name] of Object.entries(MAP_ZONE_NAMES)) {
    const P = G.pos[z];
    if (!P || !seen(+z)) continue;
    ctx.font = `bold ${Math.max(8, Math.round(9 * Math.min(1.2, T.s * 1.4)))}px monospace`; ctx.textAlign = 'center';
    const tw = ctx.measureText(name).width, x = T.x(P.x), y = T.y(P.y) + half + 10;
    ctx.fillStyle = 'rgba(4,4,16,0.75)'; ctx.fillRect(x - tw / 2 - 3, y - 9, tw + 6, 12);
    ctx.fillStyle = BOSS_ROOMS.includes(+z) ? '#ff9090' : '#e0d0ff';
    ctx.fillText(name, x, y);
  }
  // flecha sobre la sala actual
  const C = G.pos[currentRoom];
  if (C) {
    const x = T.x(C.x), y = T.y(C.y) - half - 3 + Math.sin(Date.now() * 0.006) * 2;
    ctx.fillStyle = '#40ff90';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 5, y - 8); ctx.lineTo(x + 5, y - 8); ctx.closePath(); ctx.fill();
  }
}

// Encaja las salas indicadas dentro de un recuadro
function fitMap(rooms, ax, ay, aw, ah, maxScale) {
  const G = mapGeo(), xs = rooms.map(r => G.pos[r].x), ys = rooms.map(r => G.pos[r].y);
  const minX = Math.min(...xs) - MAP_CELL * 0.7, maxX = Math.max(...xs) + MAP_CELL * 0.7;
  const minY = Math.min(...ys) - MAP_CELL * 0.7, maxY = Math.max(...ys) + MAP_CELL * 1.1;
  const k = Math.min(maxScale, aw / (maxX - minX), ah / (maxY - minY));
  const ox = ax + (aw - (maxX - minX) * k) / 2, oy = ay + (ah - (maxY - minY) * k) / 2;
  return { x: v => ox + (v - minX) * k, y: v => oy + (v - minY) * k, s: k, inv: (mx, my) => [(mx - ox) / k + minX, (my - oy) / k + minY] };
}

let cheatMapT = null;
function drawCheatWorldMap() {
  const all = Object.keys(mapGeo().pos).map(Number);
  cheatMapT = fitMap(all, 60, 86, W - 120, H - 150, 1);
  drawWorldMap(cheatMapT, true);
}

// Sala del mapa secreto bajo el punto
function worldMapRoomAt(mx, my) {
  if (!cheatMapT) return null;
  const [x, y] = cheatMapT.inv(mx, my), half = MAP_CELL * 0.5;
  for (const [r, P] of Object.entries(mapGeo().pos)) if (Math.abs(x - P.x) <= half && Math.abs(y - P.y) <= half) return +r;
  return null;
}

// Dibuja las salas y conexiones. showSecret: incluir salas secretas.
// hereId: sala a resaltar como "estás aquí" (-1 = ninguna).
function drawRoomGraph(showSecret, hereId) {
  const nodes = CHEAT_NODES.filter(n => showSecret || !n.secret);

  // Conexiones
  ctx.strokeStyle='rgba(154,106,255,0.35)'; ctx.lineWidth=2;
  for (const [a,b] of CHEAT_EDGES) {
    const na=CHEAT_NODES.find(n => n.id === a), nb=CHEAT_NODES.find(n => n.id === b);
    ctx.setLineDash([8,6]);
    ctx.beginPath(); ctx.moveTo(na.x,na.y); ctx.lineTo(nb.x,nb.y); ctx.stroke();
  }
  ctx.setLineDash([]);

  // Nodos
  for (const n of nodes) {
    const pulse = 0.65+0.35*Math.sin(Date.now()*0.003+n.id*1.2);
    const gc = n.boss ? `255,60,60` : `154,106,255`;
    const glow = ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,50);
    glow.addColorStop(0,`rgba(${gc},${(pulse*0.3).toFixed(2)})`);
    glow.addColorStop(1,'transparent');
    ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(n.x,n.y,50,0,Math.PI*2); ctx.fill();

    const nc = n.secret ? `255,210,0` : (n.boss ? `255,60,60` : `154,106,255`);
    ctx.fillStyle=n.secret?'#2a1e00':(n.boss?'#3a0808':'#160828');
    ctx.beginPath(); ctx.arc(n.x,n.y,34,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=`rgba(${nc},${pulse.toFixed(2)})`;
    ctx.lineWidth=n.secret?3:2.5; ctx.beginPath(); ctx.arc(n.x,n.y,34,0,Math.PI*2); ctx.stroke();

    ctx.fillStyle='#fff'; ctx.font='bold 16px monospace'; ctx.textAlign='center';
    ctx.fillText(n.secret?'★':(n.id+1), n.x, n.y+6);

    ctx.fillStyle=n.secret?'#ffd060':(n.boss?'#ff8888':'#d0b0ff');
    ctx.font='10px monospace';
    ctx.fillText(n.name, n.x, n.y+54);
    if (n.boss)   { ctx.fillStyle='rgba(255,80,80,0.7)';   ctx.font='8px monospace'; ctx.fillText('[ JEFE ]',   n.x, n.y+67); }
    if (n.secret) { ctx.fillStyle='rgba(255,210,0,0.75)';  ctx.font='8px monospace'; ctx.fillText('[ SECRETO ]',n.x, n.y+67); }

    if (n.id === hereId) {
      const bob = Math.sin(Date.now()*0.006)*4;
      ctx.strokeStyle='#40ff90'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(n.x,n.y,40,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle='#40ff90';
      ctx.beginPath(); ctx.moveTo(n.x,n.y-44+bob); ctx.lineTo(n.x-9,n.y-58+bob); ctx.lineTo(n.x+9,n.y-58+bob); ctx.closePath(); ctx.fill();
      ctx.font='bold 9px monospace'; ctx.fillText('ESTÁS AQUÍ', n.x, n.y-64+bob);
    }
  }
}

function drawChapter() {
  if (chapterTimer <= 0) return;
  chapterTimer--;
  const t  = chapterDur - chapterTimer;              // frames transcurridos
  const tt = t - (chapterText.intro ? CHAPTER_INTRO : 0); // frames desde que sale el título
  const bgA   = Math.min(1, chapterTimer / 50);  // el fondo se va al final
  const textA = Math.min(1, Math.max(0, (tt - 30) / 50)) * bgA;

  ctx.save();
  ctx.fillStyle = `rgba(0,0,0,${bgA})`;
  ctx.fillRect(0, 0, W, H);

  // grieta que parte la pantalla
  const prog = Math.min(1, t / 70);
  ctx.strokeStyle = `rgba(255,80,128,${(0.7 * bgA).toFixed(2)})`;
  ctx.shadowColor = '#ff5080'; ctx.shadowBlur = 16; ctx.lineWidth = 2;
  ctx.beginPath();
  const pts = [[0,300],[180,286],[300,310],[420,280],[540,302],[660,276],[780,298],[W,284]];
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    if (pts[i][0] > W * prog) {
      const [ax, ay] = pts[i - 1], [bx, by] = pts[i], k = (W * prog - ax) / (bx - ax);
      ctx.lineTo(ax + (bx - ax) * k, ay + (by - ay) * k);
      break;
    }
    ctx.lineTo(pts[i][0], pts[i][1]);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;

  // "Nuevo capítulo": aparece, se quita y luego sale el título
  if (chapterText.intro && tt < 0) {
    ctx.globalAlpha = Math.max(0, Math.min(1, (t - 20) / 30, (CHAPTER_INTRO - t) / 30));
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e0d0ff';
    ctx.font = 'italic 600 34px Georgia, serif';
    ctx.fillText('Nuevo capítulo', W / 2, 252);
  }

  ctx.globalAlpha = textA;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#c8a0ff';
  ctx.font = '13px monospace';
  ctx.fillText(chapterText.label, W / 2, 200);
  ctx.fillStyle = '#ffffff';
  ctx.font = '600 52px Georgia, serif';
  ctx.fillText(chapterText.title, W / 2, 262);
  ctx.strokeStyle = 'rgba(200,160,255,0.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(W / 2 - 170, 218); ctx.lineTo(W / 2 + 170, 218); ctx.stroke();

  if (t > 120) {
    ctx.globalAlpha = textA * (0.4 + 0.3 * Math.sin(Date.now() * 0.005));
    ctx.fillStyle = '#ffffff'; ctx.font = '10px monospace';
    ctx.fillText('pulsa cualquier tecla', W / 2, H - 40);
  }
  ctx.restore();
}

function drawTransition() {
  if (transAlpha <= 0) return;
  const color = (isDeath && transPhase !== 'fade-in')
    ? `rgba(60,0,0,${transAlpha})`
    : `rgba(0,0,0,${transAlpha})`;
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, W, H);
}
