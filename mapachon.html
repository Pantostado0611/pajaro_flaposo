<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mapachón - Explorador de Ruinas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; position: fixed; width: 100%; height: 100%; }
  #game-wrap { position: absolute; transform-origin: top left; }
  canvas { display: block; width: 960px; height: 540px; touch-action: none; }
  #controls { color: #555; font-size: 12px; margin-top: 8px; letter-spacing: 1px; text-align: center; white-space: nowrap; }
  @media (pointer: coarse) { #controls { display: none; } }

  #touch-controls { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  @media (pointer: coarse) { #touch-controls { display: block; } }

  .t-btn {
    position: absolute;
    width: 68px; height: 68px;
    background: rgba(255,255,255,0.10);
    border: 2px solid rgba(255,255,255,0.22);
    border-radius: 10px;
    color: rgba(255,255,255,0.65);
    font-size: 26px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: all;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  .t-btn.pressed { background: rgba(255,255,255,0.26); border-color: rgba(255,255,255,0.55); }

  #btn-left   { bottom: 24px; left: 16px; }
  #btn-right  { bottom: 24px; left: 100px; }
  #btn-attack { bottom: 24px; right: 100px; background: rgba(255,80,60,0.14); border-color: rgba(255,100,80,0.32); }
  #btn-shoot  { bottom: 100px; right: 100px; background: rgba(160,255,96,0.14); border-color: rgba(160,255,96,0.32); }
  #btn-jump   { bottom: 24px; right: 16px;  background: rgba(0,200,255,0.14); border-color: rgba(0,200,255,0.32); }
  #btn-inv    { top: 8px;  right: 8px;  width: 48px; height: 48px; font-size: 18px; background: rgba(180,120,255,0.14); border-color: rgba(180,120,255,0.32); }
  #btn-music  { top: 120px; right: 8px; width: 48px; height: 48px; font-size: 18px; background: rgba(120,200,255,0.12); border-color: rgba(120,200,255,0.28); }
  #btn-cheat  { top: 64px; right: 8px;  width: 48px; height: 48px; font-size: 18px; background: rgba(255,200,0,0.12);   border-color: rgba(255,200,0,0.28); }

  /* Cheat numpad */
  #cheat-numpad {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: none; grid-template-columns: repeat(3, 54px); gap: 7px;
    z-index: 30; pointer-events: all;
  }
  #cheat-numpad.visible { display: grid; }
  .np-btn {
    width: 54px; height: 54px;
    background: rgba(10,6,30,0.92); border: 2px solid rgba(154,106,255,0.4);
    border-radius: 8px; color: rgba(255,255,255,0.85);
    font-size: 20px; font-family: monospace;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; -webkit-user-select: none;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .np-btn:active { background: rgba(154,106,255,0.25); border-color: #c8a0ff; }
  #np-del { border-color: rgba(255,100,80,0.4); color: rgba(255,120,100,0.9); }
  #np-esc { border-color: rgba(255,100,80,0.4); color: rgba(255,120,100,0.9); }
</style>
</head>

<div id="game-wrap">

</div>
<div id="touch-controls">

// ─── SALAS ANCHAS ────────────────────────────────────────────────────────────
// Estas salas miden pantalla y media: se abre un tramo nuevo en medio (donde el
// suelo es continuo) y la cámara sigue al mapache hacia los lados. Las salas de
// jefe, la tienda y las que se recorren hacia arriba o abajo se quedan igual.
const WIDE_ROOMS = [0, 2, 8, 9, 10, 11];
const WIDE_EXTRA = 480;
function widenRoom(id) {
  const R = ROOMS[id], X = WIDE_EXTRA;
  const grounds = R.platforms.filter(p => p.h >= 40 && p.y >= 300);
  // punto de corte: con suelo debajo y sin cortar ninguna plataforma fina
  const split = [480, 420, 540, 360, 600, 300, 660, 240, 720, 820, 140, 320, 800, 860, 180].find(c =>
    grounds.some(g => g.x < c - 40 && g.x + g.w > c + 40) &&
    !R.platforms.some(p => p.h < 40 && p.x < c + 20 && p.x + p.w > c - 20));
  if (split === undefined) return;
  const ground = grounds.find(g => g.x < split && g.x + g.w > split);
  for (const p of R.platforms) {
    if (p.x >= split) p.x += X;
    else if (p.x + p.w > split) p.w += X;
  }
  // tramo nuevo: escalones para subir y un bicho patrullando
  const gy = ground.y, S = split;
  R.platforms.push(
    { x: S + 60,  y: gy - 110, w: 130, h: 18 },
    { x: S + 280, y: gy - 180, w: 130, h: 18 },
    { x: S + 140, y: gy - 270, w: 120, h: 18 },
  );
  for (const d of R.decorations || []) if (d.x !== undefined && d.x >= split) d.x += X;
  if (R.hatch && R.hatch.x >= split) R.hatch.x += X;
  const ens = ENEMY_TEMPLATES[id] || (ENEMY_TEMPLATES[id] = []);
  for (const e of ens) {
    if (e.patrolMin >= split) { e.x += X; e.patrolMin += X; e.patrolMax += X; }
    else if (e.patrolMax > split) { e.patrolMax += X; if (e.x >= split) e.x += X; }
  }
  const sp = ens.length ? ens[0].speed : 1.3;
  ens.push({ x: S + 200, y: gy - 24, dir: 1, patrolMin: S + 20, patrolMax: S + X - 40, speed: sp });
  R.width = W + X;
  // quien entra por la derecha aparece en el nuevo borde
  for (const r of Object.values(ROOMS)) for (const e of Object.values(r.exits || {}))
    if (e.room === id && e.spawnX >= split) e.spawnX += X;
}

// El camino cambia de dirección: sube, baja, va a la izquierda o a la derecha.
// Cada tramo [a, dir, b] pone la salida dir en a y la contraria en b.
const ROUTE = [
  [0, 'right', 14],
  [14, 'up', 15],
  [15, 'left', 1],
  [1, 'left', 16],
  [16, 'down', 17],
  [17, 'left', 2],
  [2, 'left', 18],
  [18, 'up', 19],
  [19, 'up', 20],
  [20, 'right', 21],
  [21, 'right', 4],
  [3, 'right', 26],
  [26, 'down', 27],
  [27, 'right', 6],
  [7, 'right', 28],
  [28, 'up', 29],
  [29, 'left', 8],
  [8, 'left', 30],
  [30, 'up', 31],
  [31, 'right', 9],
  [9, 'right', 32],
  [32, 'up', 33],
  [33, 'right', 10],
  [10, 'right', 34],
  [34, 'up', 35],
  [35, 'right', 11],
];
const OPPOSITE = { left: 'right', right: 'left', up: 'down', down: 'up' };
// Dónde aparece el mapache al llegar a una sala por un lado
function sideSpawn(id, side) {
  const R = ROOMS[id], RW = R.width || W;
  if (side === 'up')   return { spawnX: RW / 2 - 20, spawnY: (R.top || 0) + 40 };   // cae desde arriba
  if (side === 'down') return { spawnX: 300, spawnY: 400 };                         // sube desde abajo
  const x = side === 'left' ? 30 : RW - 70;
  const ground = R.platforms.filter(p => p.h >= 40 && p.x <= x + 13 && p.x + p.w >= x + 13)
    .reduce((m, p) => Math.max(m, p.y), -Infinity);
  return { spawnX: x, spawnY: (ground > -Infinity ? ground : 480) - 80 };
}
for (const [a, dir, b] of ROUTE) {
  const back = OPPOSITE[dir];
  ROOMS[a].exits[dir]  = { room: b, ...sideSpawn(b, back) };
  ROOMS[b].exits[back] = { room: a, ...sideSpawn(a, dir) };
  for (const [id, d] of [[a, dir], [b, back]]) if (ROOMS[id].top !== undefined) {
    if (d === 'up')   ROOMS[id].exits.up.bandX   = [560, 880];
    if (d === 'down') ROOMS[id].exits.down.bandX = [620, 820];
  }
}

// ─── COLISIÓN ─────────────────────────────────────────────────────────────────
function collideRect(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function resolveCollisions() {
  const plats = ROOMS[currentRoom].platforms;
  player.onGround = false;

  // Escalones (plataformas finas): se atraviesan desde abajo y los lados
  const oneWay = p => p.h <= 18;

  // X primero
  player.x += player.vx;
  for (const p of plats) {
    if (p.trapdoor && boss2Defeated) continue;
    if (p.door && castleDoorOpen) continue;
    if (oneWay(p)) continue;
    if (collideRect(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
      if (player.vx > 0) player.x = p.x - player.w;
      if (player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
    }
  }

  // Y después
  const prevBottom = player.y + player.h;
  player.y += player.vy;
  for (const p of plats) {
    if (p.trapdoor && boss2Defeated) continue;
    if (p.door && castleDoorOpen) continue;
    if (p.secretStair && !bossDefeated) continue;
    // Escalón: solo se apoya si caes y venías desde encima
    if (oneWay(p) && (player.vy < 0 || prevBottom > p.y)) continue;
    if (collideRect(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
      if (player.vy > 0) {
        player.y = p.y - player.h;
        player.onGround = true;
        lastGround = { room: currentRoom, x: player.x, y: player.y };
      } else {
        player.y = p.y + p.h;
      }
      player.vy = 0;
    }
  }
}

// ─── ACTUALIZAR ───────────────────────────────────────────────────────────────
function updatePlayer() {
  // Movimiento horizontal
  if (left()) {
    player.vx = -MOVE_SPD;
    player.facing = -1;
  } else if (right()) {
    player.vx = MOVE_SPD;
    player.facing = 1;
  } else {
    player.vx *= FRICTION;
    if (Math.abs(player.vx) < 0.2) player.vx = 0;
  }

  // Coyote time
  if (player.onGround) {
    player.coyoteTime = COYOTE_MAX;
  } else if (player.coyoteTime > 0) {
    player.coyoteTime--;
  }

  // Saltar (y doble salto en el aire si ya venciste al Coloso)
  if (player.onGround) player.usedDouble = false;
  if (player.jumpBuffered && player.coyoteTime > 0) {
    player.vy = JUMP_V;
    player.coyoteTime = 0;
    player.jumpBuffered = false;
  } else if (player.jumpBuffered && boss3Defeated && !player.usedDouble) {
    player.vy = JUMP_V * 0.92;
    player.usedDouble = true;
    jumpPuffs.push({ x: player.x + player.w / 2, y: player.y + player.h, t: 22 });
  }
  player.jumpBuffered = false;

  // Gravedad variable (soltar el botón = caída más rápida)
  const grav = GRAVITY * (ROOMS[currentRoom].gravity || 1);
  if (player.vy < 0 && !jumpHeld()) {
    player.vy += grav * 1.6;
  } else {
    player.vy += grav;
  }
  const maxFall = MAX_FALL * (ROOMS[currentRoom].gravity || 1);
  if (player.vy > maxFall) player.vy = maxFall;

  if (player.attackTimer  > 0) player.attackTimer--;
  if (player.attackActive > 0) player.attackActive--;
  if (player.invFrames    > 0) player.invFrames--;
  if (player.knockbackTimer > 0) { player.knockbackTimer--; }

  // Regeneración: 1 corazón cada 12 segundos (720 frames a 60fps)
  player.healTimer++;
  if (player.healTimer >= 720) {
    player.healTimer = 0;
    if (player.hp < player.maxHp) player.hp++;
  }

  resolveCollisions();
  {
    const ex = ROOMS[currentRoom].exits || {}, rw = ROOMS[currentRoom].width || W;
    if (!ex.left && player.x < 0) { player.x = 0; player.vx = 0; }
    if (!ex.right && player.x + player.w > rw) { player.x = rw - player.w; player.vx = 0; }
  }
  const top = ROOMS[currentRoom].top;
  if (top !== undefined && player.y < top) { player.y = top; if (player.vy < 0) player.vy = 0; }

  // Bob (animación de caminar)
  if (player.onGround && Math.abs(player.vx) > 0.5) {
    player.bobTimer += 0.25;
  } else {
    player.bobTimer *= 0.8;
  }
}

let hatchTimer = 0;
function checkExits() {
  const exits = ROOMS[currentRoom].exits;
  if (!exits) return;

  // Trampilla: ↓ encima, o quedarse quieto encima un momento (táctil)
  const hatch = ROOMS[currentRoom].hatch;
  if (hatch) {
    const on = player.onGround && Math.abs(player.y + player.h - hatch.y) < 4 &&
      Math.abs(player.x + player.w / 2 - (hatch.x + hatch.w / 2)) < hatch.w / 2;
    hatchTimer = on && Math.abs(player.vx) < 0.5 ? hatchTimer + 1 : 0;
    if (on && (down() || hatchTimer >= 45)) { hatchTimer = 0; startTransition(hatch.room, 460, 40); return; }
  }

  if (currentRoom === 13 && !castleDoorOpen && keysHeld.blue && keysHeld.red &&
      player.x + player.w >= CASTLE_DOOR.x + 30) {
    castleDoorOpen = true; shake(14, 3);
    moneyPops.push({ x: CASTLE_DOOR.x, y: CASTLE_DOOR.y - 20, text: '¡Puerta abierta!', t: 90, color: '#c8d4ff' });
  }
  if (exits.right && player.x + player.w >= (ROOMS[currentRoom].width || W)) {
    if (currentRoom === 13 && !castleDoorOpen) return;
    if (currentRoom === 3 && !boss2Defeated) return; // castillo cerrado
    const e = exits.right;
    startTransition(e.room, e.spawnX, e.spawnY);
  }
  if (exits.left && player.x <= 0) {
    if (currentRoom === 4 && !bossDefeated) return; // puerta bloqueada
    const e = exits.left;
    startTransition(e.room, e.spawnX, e.spawnY);
  }
  if (exits.up && player.y <= (ROOMS[currentRoom].top || 0)) {
    if (currentRoom === 1 && !hasKey && !keyUsed) return; // puerta con llave
    if (currentRoom === 1 && hasKey) { hasKey = false; keyUsed = true; }
    if (currentRoom === 3 && !boss2Defeated) return; // armería cerrada
    if (currentRoom === 4 && !bossDefeated) return;  // escalera secreta
    if (currentRoom === 13 && !guardsDefeated) return; // guardias vivos
    const e = exits.up;
    startTransition(e.room, e.spawnX, e.spawnY);
  }
  if (exits.down && player.y + player.h >= H + 30) {
    if (currentRoom === 3 && !boss2Defeated) return; // debes matar al guardián
    const e = exits.down;
    startTransition(e.room, e.spawnX, e.spawnY);
  }

  // Muerte: caer fuera del mapa
  if (player.y > H + 100) {
    if (godMode) { player.y = 400; player.vy = -5; }
    else { isDeath = true; startTransition(0, 80, 400); }
  }
}

function updateTransition() {
  if (!transitioning) return;

  if (transPhase === 'fade-out') {
    transAlpha += 0.055;
    if (transAlpha >= 1) {
      transAlpha = 1;
      transPhase = 'black';
      transBlackFrames = 18;
      if (isDeath) spawnShade();
      // Cambiar sala ahora
      currentRoom = pendingRoom;
      visitedRooms.add(currentRoom); visitedRooms.add(zoneOf(currentRoom));
      player.x = pendingPos.x;
      player.y = pendingPos.y;
      player.vx = 0;
      player.vy = 0;
      resetParticles(currentRoom);
      initEnemies(currentRoom);
      if (pendingRoom === 4 && !bossDefeated) initBoss();
      if (pendingRoom === 3 && !boss2Defeated) initBoss2();
      if (pendingRoom === 12 && !boss3Defeated) initBoss3();
      if (pendingRoom === 13 && !guardsDefeated) initGuards();
      playerShots.length = 0;
      if (pendingRoom === 7 && !chapterShown) { chapterShown = true; showChapter(2, 'La Ruptura'); }
      if (pendingRoom === 38 && !chapter3Shown) { chapter3Shown = true; showChapter(3, 'El Castillo de las Ruinas'); }
      if (isDeath) {
        // Se conserva el progreso: jefes vencidos, llave, puerta abierta y armas compradas.
        // Los jefes no vencidos se reinician al volver a entrar en su sala.
        player.hp = player.maxHp; player.invFrames = 0;
      }
      roomLabelAlpha = 1;
      roomLabelTimer = 200;
    }
  } else if (transPhase === 'black') {
    transBlackFrames--;
    if (transBlackFrames <= 0) transPhase = 'fade-in';
  } else if (transPhase === 'fade-in') {
    transAlpha -= 0.04;
    if (transAlpha <= 0) {
      transAlpha = 0;
      transPhase = 'none';
      transitioning = false;
      isDeath = false;
    }
  }
}

// ─── ALMA ─────────────────────────────────────────────────────────────────────
function spawnShade() {
  if (money <= 0 || richMode) { shade = null; return; }
  // Si caíste al vacío, el alma aparece en el último suelo que pisaste
  let x = player.x, y = player.y - 10;
  if (player.y > H - 40 && lastGround && lastGround.room === currentRoom) {
    x = lastGround.x; y = lastGround.y - 10;
  }
  shade = {
    room: currentRoom, x, y, money, bob: 0,
  };
  money = 0; // la alma anterior (si había) se pierde
}

function updateShade() {
  if (!shade || shade.room !== currentRoom) return;
  shade.bob += 0.05;
  const sx = shade.x - 4, sy = shade.y + Math.sin(shade.bob) * 6, sw = 36, sh = 44;
  const atkW = 52, atkH = 30;
  const atkX = player.facing === 1 ? player.x + player.w : player.x - atkW;
  const hit = (player.attackActive > 0 && collideRect(atkX, player.y + 6, atkW, atkH, sx, sy, sw, sh)) ||
              collideRect(player.x, player.y, player.w, player.h, sx, sy, sw, sh);
  if (!hit) return;
  addMoney(shade.money, sx + sw / 2, sy);
  shade = null;
}

function drawShade() {
  if (!shade || shade.room !== currentRoom) return;
  const t = Date.now() * 0.004;
  const cx = shade.x + 14, cy = shade.y + 20 + Math.sin(shade.bob) * 6;

  // Aura
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 46);
  g.addColorStop(0, 'rgba(120,80,200,0.35)');
  g.addColorStop(1, 'transparent');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 46, 0, Math.PI * 2); ctx.fill();

  // Cuerpo con cola ondulante
  ctx.fillStyle = 'rgba(10,6,20,0.92)';
  ctx.beginPath();
  ctx.arc(cx, cy - 4, 16, Math.PI, 0);
  ctx.lineTo(cx + 16, cy + 14);
  for (let i = 0; i <= 4; i++) {
    const wx = cx + 16 - i * 8;
    ctx.lineTo(wx, cy + 14 + (i % 2 ? 6 : 0) + Math.sin(t * 2 + i) * 3);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(180,140,255,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();

  // Orejas de mapache
  ctx.fillStyle = 'rgba(10,6,20,0.92)';
  ctx.beginPath(); ctx.arc(cx - 11, cy - 17, 6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 11, cy - 17, 6, 0, Math.PI * 2); ctx.fill();

  // Ojos
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(cx - 6, cy - 4, 4, 5.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 6, cy - 4, 4, 5.5, 0, 0, Math.PI * 2); ctx.fill();

  // Lo que guarda
  ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd040';
  ctx.fillText('💰 ' + shade.money, cx, cy - 30);
}

// ─── ENEMIGOS ─────────────────────────────────────────────────────────────────
function initEnemies(roomId) {
  const templates = ENEMY_TEMPLATES[roomId] || [];
  // De La Cumbre al Pico los bichos se esconden como piedras nevadas
  const rock = ROCK_ZONES.includes(zoneOf(roomId));
  // En la zona de los guardias son de metal al rojo y explotan si te acercas mucho
  const hot = HOT_ZONES.includes(zoneOf(roomId));
  currentEnemies = templates.map(t => ({ ...t, w: 28, h: 24, vy: 0, dead: false, deathTimer: 0,
    rock, awake: !rock, wake: 0, hot, fuse: 0, exploded: false }));
}

const ROCK_ZONES = [7, 8, 9, 10, 11];
const HOT_ZONES = [13];
const HOT_FUSE = 45, HOT_TRIGGER = 64, HOT_BLAST = 88;
function explodeEnemy(e) {
  e.dead = true; e.exploded = true; e.deathTimer = 34;
  shake(12, 4);
  const pcx = player.x + player.w / 2, pcy = player.y + player.h / 2;
  const ex = e.x + e.w / 2, ey = e.y + e.h / 2;
  if (Math.hypot(pcx - ex, pcy - ey) < HOT_BLAST && player.invFrames === 0) {
    if (!godMode) {
      player.hp--;
      if (player.hp <= 0) { player.hp = 0; isDeath = true; startTransition(0, 80, 400); return; }
    }
    player.invFrames = 90; player.knockbackTimer = 14;
    player.vx = (pcx < ex ? -1 : 1) * 8; player.vy = -9;
  }
}
const ROCK_WAKE_DIST = 150;
function updateEnemies() {
  for (const e of currentEnemies) {
    if (e.dead) { if (e.deathTimer > 0) e.deathTimer--; continue; }
    if (!e.awake) {
      // piedra quieta hasta que te acercas: entonces se sacude la nieve
      const d = Math.hypot(player.x + player.w / 2 - (e.x + e.w / 2), player.y + player.h / 2 - (e.y + e.h / 2));
      if (d < ROCK_WAKE_DIST) {
        e.awake = true; e.wake = 30;
        e.dir = player.x + player.w / 2 < e.x + e.w / 2 ? -1 : 1;
      }
      continue;
    }
    if (e.wake > 0) { e.wake--; continue; }
    if (e.hot) {
      // mecha: se para, se hincha y parpadea… y explota
      if (e.fuse > 0) { if (--e.fuse === 0) explodeEnemy(e); continue; }
      const d = Math.hypot(player.x + player.w / 2 - (e.x + e.w / 2), player.y + player.h / 2 - (e.y + e.h / 2));
      if (d < HOT_TRIGGER) { e.fuse = HOT_FUSE; continue; }
    }
    e.x += e.dir * e.speed;
    if (e.x <= e.patrolMin)       { e.x = e.patrolMin; e.dir =  1; }
    if (e.x + e.w >= e.patrolMax) { e.x = e.patrolMax - e.w; e.dir = -1; }
  }
}

function checkEnemyCollisions() {
  // Hitbox de ataque del jugador
  const atkW = 52, atkH = 30;
  const atkX = player.facing === 1 ? player.x + player.w : player.x - atkW;
  const atkY = player.y + 6;

  for (const e of currentEnemies) {
    if (e.dead) continue;

    // Ataque del jugador golpea al enemigo
    if (player.attackActive > 0 &&
        collideRect(atkX, atkY, atkW, atkH, e.x, e.y, e.w, e.h)) {
      e.dead = true;
      e.deathTimer = 22;
      addMoney(MONEY_ENEMY, e.x + e.w / 2, e.y);
      // Rebote ligero al golpear
      if (player.knockbackTimer === 0) { player.vy = Math.min(player.vy, -4); }
      continue;
    }

    // Stomp (caer encima mata al enemigo)
    const stompOverlap = collideRect(player.x, player.y, player.w, player.h, e.x, e.y, e.w, e.h);
    const fromAbove    = player.vy > 1 && (player.y + player.h) < (e.y + e.h * 0.6);
    if (stompOverlap && fromAbove) {
      e.dead = true;
      e.deathTimer = 22;
      addMoney(MONEY_ENEMY, e.x + e.w / 2, e.y);
      player.vy = -11;
      continue;
    }

    // Contacto lateral/desde abajo → daño al jugador (una piedra dormida no hace daño)
    if (player.invFrames === 0 && e.awake && e.wake === 0 && !e.fuse &&
        collideRect(player.x + 3, player.y + 3, player.w - 6, player.h - 3, e.x, e.y, e.w, e.h)) {
      if (!godMode) {
        player.hp--;
        if (player.hp <= 0) {
          player.hp = 0;
          isDeath = true;
          startTransition(0, 80, 400);
          return;
        }
      }
      player.invFrames = 90;
      player.knockbackTimer = 14;
      const dir = player.x + player.w / 2 < e.x + e.w / 2 ? -1 : 1;
      player.vx = dir * 6;
      player.vy = -7;
    }
  }
}

// Bicho escondido: una piedra con nieve encima; al despertar tiembla y suelta nieve
function drawSnowRock(e, cx, cy) {
  const k = e.wake > 0 ? e.wake / 30 : 0;
  const shakeX = e.wake > 0 ? Math.sin(e.wake * 2.3) * 2.5 : 0;
  const by = cy + e.h / 2;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(cx, by + 1, 16, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.translate(cx + shakeX, by);
  ctx.fillStyle = vol(-3, -10, 15, '#8a90a0', '#3a3e4a');
  ctx.beginPath(); ctx.moveTo(-16, 0); ctx.quadraticCurveTo(-17, -12, -7, -17);
  ctx.quadraticCurveTo(4, -21, 12, -13); ctx.quadraticCurveTo(17, -6, 16, 0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-4, -16); ctx.lineTo(-1, -9); ctx.lineTo(-5, -4); ctx.stroke();
  // capa de nieve (se va cayendo al despertar)
  ctx.globalAlpha = e.wake > 0 ? k : 1;
  ctx.fillStyle = '#eef2fc';
  ctx.beginPath(); ctx.moveTo(-14, -9); ctx.quadraticCurveTo(-12, -17, -5, -18.5);
  ctx.quadraticCurveTo(5, -21.5, 12, -13); ctx.quadraticCurveTo(6, -12, 1, -13);
  ctx.quadraticCurveTo(-6, -11, -14, -9); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
  if (e.wake > 0) {
    // copos que salen disparados y ojos que se abren
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI * (0.15 + i * 0.14), d = (1 - k) * 22;
      ctx.globalAlpha = k;
      ctx.beginPath(); ctx.arc(Math.cos(a) * d, -14 + Math.sin(a) * d, 1.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = '#ff4040';
    ctx.beginPath(); ctx.arc(e.dir * 9, -7, 1.6, 0, Math.PI * 2); ctx.arc(e.dir * 5, -8, 1.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawEnemy(e) {
  const cx = Math.round(e.x + e.w / 2);
  const cy = Math.round(e.y + e.h / 2);

  // Animación de muerte: anillo de humo, nubecitas y chispas
  if (e.dead && e.exploded) {
    if (e.deathTimer <= 0) return;
    const k = e.deathTimer / 34, p = 1 - k;
    ctx.save();
    const r = 18 + p * (HOT_BLAST - 10);
    const fg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    fg.addColorStop(0, `rgba(255,250,210,${k.toFixed(2)})`);
    fg.addColorStop(0.4, `rgba(255,160,40,${(0.85 * k).toFixed(2)})`);
    fg.addColorStop(1, 'rgba(200,40,10,0)');
    ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = `rgba(255,200,120,${(0.7 * k).toFixed(2)})`; ctx.lineWidth = 3 * k + 1;
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.95, 0, Math.PI * 2); ctx.stroke();
    // trozos de metal incandescente
    for (let i = 0; i < 9; i++) {
      const a = (i / 9) * Math.PI * 2 + 0.3, d = p * 60;
      ctx.fillStyle = i % 2 ? '#ffb040' : '#ff5020';
      ctx.globalAlpha = k;
      ctx.beginPath(); ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d - p * 10 + p * p * 30, 2.6 * k + 0.8, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    return;
  }
  if (e.dead) {
    if (e.deathTimer <= 0) return;
    const k = e.deathTimer / 22, p = 1 - k;
    ctx.save();
    ctx.globalAlpha = k * 0.7;
    ctx.strokeStyle = '#c090ff'; ctx.lineWidth = 3 * k + 0.5;
    ctx.beginPath(); ctx.arc(cx, cy, 6 + p * 26, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + 0.4;
      const d = p * 20;
      const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d - p * 6;
      ctx.globalAlpha = k * 0.55;
      ctx.fillStyle = vol(x, y, 7 * k + 2, '#f0e6ff', '#8a70b0');
      ctx.beginPath(); ctx.arc(x, y, 7 * k + 2, 0, Math.PI * 2); ctx.fill();
    }
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const d = p * 32;
      ctx.globalAlpha = k;
      ctx.fillStyle = i % 2 === 0 ? '#d070ff' : '#ff8050';
      ctx.beginPath(); ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 2.4 * k + 0.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    return;
  }

  if (e.rock && (!e.awake || e.wake > 0)) { drawSnowRock(e, cx, cy); return; }

  const t = Date.now() * 0.003;
  const ph = t * 7 + e.x * 0.05;                 // fase del paso
  const bounce = Math.abs(Math.sin(ph)) * 1.2;
  ctx.save();

  // Sombra (se encoge un poco al rebotar)
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(cx, cy + e.h / 2 + 2, e.w * 0.45 - bounce, 3, 0, 0, Math.PI * 2); ctx.fill();

  if (e.hot) {
    const f = e.fuse > 0 ? 1 - e.fuse / HOT_FUSE : 0;
    const hg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 30 + f * 20);
    hg.addColorStop(0, `rgba(255,120,30,${(0.3 + f * 0.4).toFixed(2)})`); hg.addColorStop(1, 'rgba(255,80,20,0)');
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(cx, cy, 30 + f * 20, 0, Math.PI * 2); ctx.fill();
    // chispas que suben
    for (let i = 0; i < 3; i++) {
      const k = (t * 0.8 + i / 3 + e.x * 0.01) % 1;
      ctx.fillStyle = `rgba(255,${180 - i * 40},60,${(1 - k).toFixed(2)})`;
      ctx.beginPath(); ctx.arc(cx - 6 + i * 6 + Math.sin(k * 9 + i) * 3, cy - 8 - k * 22, 1.3, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.translate(cx, cy - bounce);
  if (e.hot && e.fuse > 0) {
    const f = 1 - e.fuse / HOT_FUSE;
    ctx.translate(Math.sin(e.fuse * 1.7) * 1.5 * f, 0);
    ctx.scale(1 + f * 0.3, 1 + f * 0.3);
  }
  ctx.scale(e.dir, 1);

  // Patas: tres por lado, caminan en trípode (como los insectos de verdad)
  const leg = (bx, by, side, phase, far) => {
    const lift = Math.max(0, Math.sin(phase)) * 3;
    const swing = Math.cos(phase) * 3.5;
    const kx = bx + swing * 0.5, ky = by + 4 - lift * 0.5;
    const fx = bx + swing, fy = 12 + bounce - lift;
    ctx.strokeStyle = far ? '#1a0a2a' : '#3a1a58';
    ctx.lineWidth = far ? 1.6 : 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(kx + side * 2, ky); ctx.lineTo(fx + side * 3, fy); ctx.stroke();
    ctx.fillStyle = far ? '#1a0a2a' : '#5a2a80';
    ctx.beginPath(); ctx.arc(fx + side * 3, fy, 1.1, 0, Math.PI * 2); ctx.fill();
  };
  const legX = [-7, -1, 5];
  legX.forEach((lx, i) => leg(lx, 3, i - 1, ph + (i % 2 ? Math.PI : 0) + Math.PI, true)); // lado lejano

  // Abdomen por debajo
  ctx.fillStyle = '#12061e';
  ctx.beginPath(); ctx.ellipse(-2, 4, 12, 4.5, 0, 0, Math.PI * 2); ctx.fill();

  // Élitros (caparazón) con brillo tornasolado
  const shell = ctx.createLinearGradient(-14, -11, 6, 6);
  const blink = e.hot && e.fuse > 0 && Math.floor(e.fuse / (e.fuse < 15 ? 2 : 5)) % 2 === 0;
  const stops = blink ? ['#ffffff', '#fff0c0', '#ffd080', '#ff9040', '#ff5020']   // a punto de explotar
    : e.hot  ? ['#ffe080', '#ff8a30', '#d04010', '#7a1a08', '#2a0804']   // metal al rojo
    : e.rock ? ['#a8aebc', '#767c8c', '#5e6a80', '#4a505e', '#2a2e38']   // caparazón de piedra
    : ['#7a3ab0', '#4a1c78', '#2c6a8a', '#3a1460', '#1a0830'];          // tornasolado (reflejo azul verdoso)
  [0, 0.35, 0.55, 0.7, 1].forEach((o, i) => shell.addColorStop(o, stops[i]));
  ctx.fillStyle = shell;
  ctx.beginPath();
  ctx.moveTo(-14, 4);
  ctx.bezierCurveTo(-15, -6, -8, -12, 0, -11);
  ctx.bezierCurveTo(5, -10.5, 7, -6, 7, 2);
  ctx.quadraticCurveTo(-3, 6.5, -14, 4);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(10,0,20,0.7)'; ctx.lineWidth = 1; ctx.stroke();
  // línea donde se juntan las dos alas
  ctx.strokeStyle = 'rgba(10,0,25,0.65)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(6.5, -5); ctx.bezierCurveTo(2, -9.5, -8, -9.5, -13.5, 1); ctx.stroke();
  // estrías y manchas
  ctx.strokeStyle = 'rgba(200,150,255,0.18)'; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(4, -2); ctx.bezierCurveTo(0, -6, -7, -6, -11, 2); ctx.stroke();
  ctx.fillStyle = 'rgba(20,0,40,0.45)';
  for (const [sx, sy, sr] of [[-8, -4, 1.6], [-3, -6.5, 1.3], [-10, 0.5, 1.2]]) {
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
  }
  // brillo especular que se mueve un poco
  const sh = Math.sin(t * 1.3 + e.x) * 1.5;
  ctx.fillStyle = 'rgba(255,255,255,0.32)';
  ctx.beginPath(); ctx.ellipse(-5 + sh, -8.5, 5, 1.6, -0.25, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath(); ctx.arc(-7 + sh, -8.5, 0.9, 0, Math.PI * 2); ctx.fill();
  if (e.rock) {
    // nieve que le queda encima del caparazón
    ctx.fillStyle = '#eef2fc';
    ctx.beginPath(); ctx.moveTo(-12, -4); ctx.quadraticCurveTo(-9, -12.5, -1, -11.5);
    ctx.quadraticCurveTo(4, -11, 5, -7); ctx.quadraticCurveTo(0, -8, -4, -6.5);
    ctx.quadraticCurveTo(-8, -6, -12, -4); ctx.closePath(); ctx.fill();
  }

  // Tórax (pronoto)
  ctx.fillStyle = vol(8.5, -2, 5, '#5a2a88', '#160828');
  ctx.beginPath(); ctx.ellipse(8.5, -1.5, 4.5, 5.5, 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(10,0,20,0.7)'; ctx.lineWidth = 0.8; ctx.stroke();

  // Cabeza
  ctx.fillStyle = vol(13, 0, 4.5, '#3a1a58', '#0a0414');
  ctx.beginPath(); ctx.ellipse(13, 0.5, 4.2, 4, 0, 0, Math.PI * 2); ctx.fill();

  // Mandíbulas que se abren y se cierran
  const open = (Math.sin(t * 5 + e.x) + 1) * 0.5;
  ctx.fillStyle = '#6a3a3a';
  ctx.save(); ctx.translate(16, -0.5); ctx.rotate(-0.35 - open * 0.5);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(5, -1, 6, 2); ctx.quadraticCurveTo(3.5, 0.8, 0, 1.6); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(16, 2); ctx.rotate(0.35 + open * 0.5);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(5, 1, 6, -2); ctx.quadraticCurveTo(3.5, -0.8, 0, -1.6); ctx.closePath(); ctx.fill();
  ctx.restore();

  // Ojos compuestos rojos (parpadean)
  const eyes = [[14.2, -1.5, 2.6], [11.6, -2.4, 1.9]];  // cercano y lejano
  for (const [ex, ey, er] of eyes) {
    const glow = ctx.createRadialGradient(ex, ey, 0, ex, ey, er * 2.2);
    glow.addColorStop(0, 'rgba(255,70,70,0.5)'); glow.addColorStop(1, 'rgba(255,40,40,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(ex, ey, er * 2.2, 0, Math.PI * 2); ctx.fill();
  }
  if (blinkNow(e.x * 0.37 + e.y)) {
    ctx.strokeStyle = '#ff3030'; ctx.lineWidth = 1.2;
    for (const [ex, ey, er] of eyes) { ctx.beginPath(); ctx.moveTo(ex - er, ey); ctx.lineTo(ex + er, ey); ctx.stroke(); }
  } else {
    for (const [ex, ey, er] of eyes) {
      ctx.fillStyle = vol(ex, ey, er, '#ff9090', '#a00000');
      ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.fill();
      // facetas
      ctx.fillStyle = 'rgba(80,0,0,0.45)';
      for (const [fx, fy] of [[0.8, 0.6], [-0.6, 0.8], [0.4, -0.8]]) {
        ctx.beginPath(); ctx.arc(ex + fx * er * 0.55, ey + fy * er * 0.55, er * 0.22, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = '#ffe0e0';
      ctx.beginPath(); ctx.arc(ex - er * 0.35, ey - er * 0.4, er * 0.3, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Dos antenas con la punta en maza
  for (const [ax, sway, far] of [[12, 0, true], [14, 0.6, false]]) {
    const tipX = ax + 9, tipY = -12 + Math.sin(t * 4 + e.x + sway) * 1.6;
    ctx.strokeStyle = far ? '#2a1040' : '#4a2068'; ctx.lineWidth = 1.1; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax, -3);
    ctx.quadraticCurveTo(ax + 2, -10, tipX, tipY); ctx.stroke();
    ctx.fillStyle = far ? '#3a1858' : '#6a3098';
    ctx.beginPath(); ctx.ellipse(tipX + 0.5, tipY, 2.2, 1.4, -0.4, 0, Math.PI * 2); ctx.fill();
  }

  // Patas del lado cercano (delante del cuerpo)
  legX.forEach((lx, i) => leg(lx, 4, i - 1, ph + (i % 2 ? 0 : Math.PI), false));

  ctx.restore();
}

function drawEnemies() {
  for (const e of currentEnemies) drawEnemy(e);
}

// ─── FUNCIONES DE JEFE ────────────────────────────────────────────────────────
function initBoss() {
  Object.assign(boss, {
    x: 440, y: BOSS_FLOOR_Y,
    vx: 0, vy: 0,
    hp: 10, state: 'wait', stateTimer: 90,
    phase: 1, invFrames: 0, facing: -1,
    dead: false, deathTimer: 0, projectiles: [],
    roared: false, windNext: null,
  });
  bossAttackIdx = 0;
}

function fireBossOrbs() {
  const cx = boss.x + boss.w / 2, cy = boss.y + boss.h / 2;
  const dx = (player.x + player.w / 2) - cx;
  const dy = (player.y + player.h / 2) - cy;
  const len = Math.hypot(dx, dy) || 1;
  const nx = dx / len, ny = dy / len;
  for (const a of [-0.4, 0, 0.4]) {
    const cos = Math.cos(a), sin = Math.sin(a);
    boss.projectiles.push({
      x: cx, y: cy,
      vx: (nx * cos - ny * sin) * 4.5,
      vy: (nx * sin + ny * cos) * 4.5,
      r: 9, life: 220,
    });
  }
}

function updateBoss() {
  if (currentRoom !== 4) return;

  // Proyectiles: orbes con gravedad, ondas por el suelo y lluvia del cetro
  for (const p of boss.projectiles) {
    if (p.type === 'wave') {
      p.x += p.vx; p.life--;
    } else if (p.type === 'rain') {
      if (p.delay > 0) { p.delay--; continue; }
      p.vy = Math.min(p.vy + 0.5, 12);
      p.y += p.vy;
      if (p.y >= BOSS_FLOOR_Y + boss.h - 8) p.life = 0;
    } else {
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.12;
      p.life--;
    }
  }
  boss.projectiles = boss.projectiles.filter(
    p => p.life > 0 && p.x > -30 && p.x < W + 30 && p.y < H + 30
  );

  if (boss.dead) {
    if (boss.deathTimer > 0) { boss.deathTimer--; }
    else if (!bossDefeated)  {
      bossDefeated = true;
      addMoney(MONEY_BOSS, boss.x + boss.w / 2, boss.y);
      keyItem.x = boss.x + boss.w / 2 - 12;
      keyItem.y = BOSS_FLOOR_Y - 28;
      keyItem.active = true;
      keyItem.bobTimer = 0;
    }
    return;
  }

  if (boss.invFrames > 0) boss.invFrames--;
  const newPhase = boss.hp <= Math.floor(boss.maxHp / 2) ? 2 : 1;
  // Rugido de furia al pasar a la fase 2
  if (newPhase === 2 && !boss.roared && boss.y >= BOSS_FLOOR_Y) {
    boss.roared = true;
    boss.state = 'roar'; boss.stateTimer = 70;
    boss.vx = 0; boss.projectiles = [];
    shake(40, 7);
  }
  boss.phase = newPhase;

  // Gravedad (al saltar); al aterrizar golpea el suelo y lanza ondas
  if (boss.y < BOSS_FLOOR_Y) {
    boss.vy += 0.65;
    boss.y  += boss.vy;
    if (boss.y >= BOSS_FLOOR_Y) {
      boss.y = BOSS_FLOOR_Y; boss.vy = 0;
      if (boss.state === 'jump') {
        bossSlam();
        boss.state = 'wait'; boss.vx = 0; boss.stateTimer = 55;
      }
    }
  }

  boss.stateTimer--;

  if (boss.state === 'roar') {
    if (boss.stateTimer <= 0) { boss.state = 'wait'; boss.stateTimer = 30; }

  } else if (boss.state === 'windup') {
    if (boss.stateTimer <= 0) startBossAttack(boss.windNext);

  } else if (boss.state === 'charge') {
    boss.x += boss.vx;
    if (boss.x <= 20)              { boss.x = 20;              boss.vx =  Math.abs(boss.vx) * 0.92; boss.facing =  1; }
    if (boss.x + boss.w >= W - 20) { boss.x = W - 20 - boss.w; boss.vx = -Math.abs(boss.vx) * 0.92; boss.facing = -1; }
    if (boss.stateTimer <= 0)      { boss.state = 'wait'; boss.vx = 0; boss.stateTimer = boss.phase === 2 ? 40 : 55; }

  } else if (boss.state === 'jump') {
    boss.x += boss.vx;
    if (boss.x <= 20)              { boss.x = 20;              boss.vx =  Math.abs(boss.vx); boss.facing =  1; }
    if (boss.x + boss.w >= W - 20) { boss.x = W - 20 - boss.w; boss.vx = -Math.abs(boss.vx); boss.facing = -1; }
    if (boss.stateTimer <= 0)      { boss.y = BOSS_FLOOR_Y; boss.vy = 0; boss.state = 'wait'; boss.vx = 0; boss.stateTimer = 50; }

  } else if (boss.state === 'rain') {
    if (boss.stateTimer <= 0) { boss.state = 'wait'; boss.stateTimer = 40; }

  } else if (boss.state === 'wait') {
    if (boss.stateTimer <= 0) {
      const pattern = boss.phase === 2
        ? ['charge','jump','shoot','rain','charge','jump','shoot','charge']
        : ['charge','jump','charge','jump'];
      const next = pattern[bossAttackIdx % pattern.length];
      bossAttackIdx++;
      const pdx = (player.x + player.w / 2) - (boss.x + boss.w / 2);
      boss.facing = pdx > 0 ? 1 : -1;

      if (next === 'shoot') {
        fireBossOrbs();
        boss.stateTimer = boss.phase === 2 ? 35 : 50;
      } else {
        // aviso antes de atacar
        boss.state = 'windup';
        boss.windNext = next;
        boss.stateTimer = boss.phase === 2 ? 18 : 26;
      }
    }
  }
}

function startBossAttack(next) {
  boss.state = next;
  if (next === 'charge') {
    boss.vx = boss.facing * (boss.phase === 2 ? 7.8 : 6.2);
    boss.stateTimer = 130;
  } else if (next === 'jump') {
    boss.vx = boss.facing * 4.5;
    boss.vy = -14;
    boss.y -= 1;               // despega del suelo para que actúe la gravedad
    boss.stateTimer = 160;
  } else if (next === 'rain') {
    spawnBossRain();
    boss.stateTimer = 80;
  }
}

// Al aterrizar: temblor y dos ondas de choque por el suelo (hay que saltarlas)
function bossSlam() {
  shake(16, 5);
  const fy = BOSS_FLOOR_Y + boss.h - 12;
  for (const dir of [-1, 1]) {
    boss.projectiles.push({
      type: 'wave', x: boss.x + boss.w / 2 + dir * 30, y: fy,
      vx: dir * (boss.phase === 2 ? 6.5 : 5), vy: 0, r: 12, life: 140,
    });
  }
}

// Lluvia del cetro: orbes que caen del cielo; antes se marca dónde caerán
function spawnBossRain() {
  const n = boss.phase === 2 ? 7 : 5;
  const px = player.x + player.w / 2;
  for (let i = 0; i < n; i++) {
    const off = i - (n - 1) / 2;
    boss.projectiles.push({
      type: 'rain', x: Math.max(30, Math.min(W - 30, px + off * 95)), y: -20,
      vx: 0, vy: 0, r: 10, life: 400, delay: 34 + Math.abs(off) * 10,
    });
  }
}

function checkBossCollisions() {
  if (currentRoom !== 4 || boss.dead) return;

  const atkW = 52, atkH = 30;
  const atkX = player.facing === 1 ? player.x + player.w : player.x - atkW;
  const atkY = player.y + 6;

  // Ataque del jugador golpea al jefe
  if (player.attackActive > 0 && boss.invFrames === 0 && boss.state !== 'roar' &&
      collideRect(atkX, atkY, atkW, atkH, boss.x, boss.y, boss.w, boss.h)) {
    boss.hp -= playerDmg;
    boss.invFrames = 28;
    if (boss.hp <= 0) { boss.hp = 0; boss.dead = true; boss.deathTimer = 130; boss.projectiles = []; return; }
  }

  // Pisotón al jefe
  const onBoss   = collideRect(player.x, player.y, player.w, player.h, boss.x, boss.y, boss.w, boss.h);
  const fromTop  = player.vy > 1 && (player.y + player.h) < (boss.y + boss.h * 0.5);
  if (onBoss && fromTop && boss.invFrames === 0 && boss.state !== 'roar') {
    boss.hp -= playerDmg;
    boss.invFrames = 28;
    player.vy = -12;
    if (boss.hp <= 0) { boss.hp = 0; boss.dead = true; boss.deathTimer = 130; boss.projectiles = []; return; }
  }

  // Cuerpo del jefe daña al jugador
  if (player.invFrames === 0 && !fromTop &&
      collideRect(player.x + 3, player.y + 3, player.w - 6, player.h - 3, boss.x, boss.y, boss.w, boss.h)) {
    if (!godMode) {
      player.hp--;
      if (player.hp <= 0) { player.hp = 0; isDeath = true; startTransition(0, 80, 400); return; }
    }
    player.invFrames = 90;
    const dir = (player.x + player.w / 2) < (boss.x + boss.w / 2) ? -1 : 1;
    player.vx = dir * 7; player.vy = -8;
  }

  // Proyectiles dañan al jugador
  for (let i = boss.projectiles.length - 1; i >= 0; i--) {
    const p = boss.projectiles[i];
    if (player.attackActive > 0 &&
        collideRect(atkX, atkY, atkW, atkH, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2)) {
      boss.projectiles.splice(i, 1); continue;
    }
    const dist = Math.hypot((player.x + player.w / 2) - p.x, (player.y + player.h / 2) - p.y);
    if (dist < p.r + 12 && player.invFrames === 0) {
      if (!godMode) {
        player.hp--;
        if (player.hp <= 0) { player.hp = 0; isDeath = true; startTransition(0, 80, 400); return; }
      }
      boss.projectiles.splice(i, 1);
      player.invFrames = 70;
      const dir = player.x < p.x ? -1 : 1;
      player.vx = dir * 5; player.vy = -6;
    }
  }
}

// Orbe mágico con núcleo, halo y pequeña estela
// Proyectiles de jefe según su tipo
function drawBossProjectile(p, rgb, core) {
  if (p.type === 'wave') {
    // onda de choque que avanza por el suelo
    const a = Math.min(1, p.life / 20);
    ctx.save();
    ctx.globalAlpha = a;
    const g = ctx.createRadialGradient(p.x, p.y + 12, 0, p.x, p.y + 12, 28);
    g.addColorStop(0, `rgba(${rgb},0.9)`); g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(p.x, p.y + 12, 16, 26, 0, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(p.x, p.y + 12, 10, 18, 0, Math.PI, 0); ctx.stroke();
    // polvo que levanta
    ctx.fillStyle = 'rgba(200,180,160,0.5)';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(p.x - Math.sign(p.vx) * (8 + i * 7), p.y + 10 - i * 2, 3 - i * 0.7, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    return;
  }
  if (p.type === 'rain' && p.delay > 0) {
    // aviso en el suelo de dónde caerá
    const floorY = BOSS_FLOOR_Y + boss.h;
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.02);
    ctx.save();
    ctx.strokeStyle = `rgba(${rgb},${(0.45 + 0.4 * pulse).toFixed(2)})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(p.x, floorY - 2, 16 + pulse * 3, 5, 0, 0, Math.PI * 2); ctx.stroke();
    const beam = ctx.createLinearGradient(0, 0, 0, floorY);
    beam.addColorStop(0, `rgba(${rgb},0)`); beam.addColorStop(1, `rgba(${rgb},0.18)`);
    ctx.fillStyle = beam; ctx.fillRect(p.x - 8, 0, 16, floorY);
    ctx.restore();
    return;
  }
  if (p.type === 'bat') {
    // murcielaguito
    const fl = Math.sin(p.flap) * 0.6;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(p.vx >= 0 ? 1 : -1, 1);
    ctx.fillStyle = '#1a0830';
    for (const s of [-1, 1]) {
      ctx.save(); ctx.scale(s, 1); ctx.rotate(fl);
      ctx.beginPath(); ctx.moveTo(2, 0); ctx.quadraticCurveTo(9, -9, 15, -3);
      ctx.quadraticCurveTo(11, -1, 12, 3); ctx.quadraticCurveTo(7, 1, 2, 4); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = vol(0, 0, 6, '#4a2470', '#12051e');
    ctx.beginPath(); ctx.ellipse(0, 1, 5, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-4, -3); ctx.lineTo(-3, -9); ctx.lineTo(-1, -4); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(4, -3); ctx.lineTo(3, -9); ctx.lineTo(1, -4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff5070';
    ctx.beginPath(); ctx.arc(-1.8, 0, 1.2, 0, Math.PI * 2); ctx.arc(1.8, 0, 1.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    return;
  }
  drawOrb(p, rgb, core);
}

// Aviso "¡!" sobre un jefe que va a atacar
function drawWarning(x, y, color) {
  const pulse = 1 + Math.sin(Date.now() * 0.03) * 0.12;
  ctx.save();
  ctx.translate(x, y); ctx.scale(pulse, pulse);
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = color;
  ctx.font = 'bold 18px Georgia, serif'; ctx.textAlign = 'center';
  ctx.fillText('!', 0, 6.5);
  ctx.restore();
}

// Anillos que salen al rugir / chillar
function drawRoarRings(x, y, t, rgb) {
  ctx.save();
  for (let i = 0; i < 3; i++) {
    const k = ((t + i / 3) % 1);
    ctx.strokeStyle = `rgba(${rgb},${(0.6 * (1 - k)).toFixed(2)})`;
    ctx.lineWidth = 4 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(x, y, 20 + k * 110, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}

function drawOrb(p, glowRGB, core) {
  const sp = Math.hypot(p.vx, p.vy) || 1;
  const tx = p.x - (p.vx / sp) * p.r * 2.4, ty = p.y - (p.vy / sp) * p.r * 2.4;
  const tg = ctx.createLinearGradient(tx, ty, p.x, p.y);
  tg.addColorStop(0, `rgba(${glowRGB},0)`); tg.addColorStop(1, `rgba(${glowRGB},0.55)`);
  ctx.strokeStyle = tg; ctx.lineWidth = p.r * 1.3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(p.x, p.y); ctx.stroke();
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 2.4);
  g.addColorStop(0, `rgba(${glowRGB},0.85)`); g.addColorStop(1, `rgba(${glowRGB},0)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = vol(p.x, p.y, p.r, '#ffffff', core);
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
}

// Explosión final de un jefe: destello, onda y chispas de colores
function drawBossDeath(cx, cy, t, cols, maxDist) {
  const p = 1 - t;
  ctx.save();
  if (p < 0.25) {
    const fl = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120);
    fl.addColorStop(0, `rgba(255,255,255,${(0.8 * (1 - p / 0.25)).toFixed(2)})`);
    fl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = fl; ctx.beginPath(); ctx.arc(cx, cy, 120, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = t * 0.8;
  ctx.strokeStyle = cols[0]; ctx.lineWidth = 4 * t + 1;
  ctx.beginPath(); ctx.arc(cx, cy, p * maxDist * 1.1, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 14; i++) {
    const angle = (i / 14) * Math.PI * 2 + p * 6;
    const dist  = p * maxDist;
    const x = cx + Math.cos(angle) * dist, y = cy + Math.sin(angle) * dist;
    const r = 9 * t + 2;
    ctx.globalAlpha = t;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2);
    g.addColorStop(0, cols[i % cols.length]); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawBoss() {
  if (currentRoom !== 4) return;

  for (const p of boss.projectiles) drawBossProjectile(p, '180,60,255', '#a040e0');

  if (boss.dead) {
    if (boss.deathTimer <= 0) return;
    drawBossDeath(boss.x + boss.w / 2, boss.y + boss.h / 2, boss.deathTimer / 130,
      ['#ff4040','#ffaa00','#ff80ff','#ffffff','#40ffff','#ffff00'], 110);
    return;
  }

  const cx = Math.round(boss.x + boss.w / 2), cy = Math.round(boss.y + boss.h / 2);
  const hw = boss.w / 2, hh = boss.h / 2;
  const hy = -hh + 2;
  const t  = Date.now() * 0.002;
  const p2 = boss.phase === 2;
  const flicker = boss.invFrames > 0 && Math.floor(boss.invFrames / 4) % 2 === 0;

  ctx.save();
  // Sombra
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(cx, cy + hh + 5, hw * 0.85, 7, 0, 0, Math.PI * 2); ctx.fill();

  ctx.translate(cx, cy);
  ctx.scale(boss.facing, 1);
  if (flicker) ctx.globalAlpha = 0.45;

  // Líneas de velocidad al embestir
  if (boss.state === 'charge') {
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const y = -hh + 14 + i * 13, off = (Date.now() * 0.3 + i * 37) % 30;
      ctx.beginPath(); ctx.moveTo(-hw - 20 - off, y); ctx.lineTo(-hw - 50 - off, y); ctx.stroke();
    }
  }

  // Aura de llamas cuando está furioso (fase 2)
  if (p2) {
    for (let i = 0; i < 7; i++) {
      const fx = -hw + (i / 6) * boss.w, fl = Math.sin(t * 6 + i * 1.7);
      const fh = 26 + fl * 8 + (i % 2) * 8;
      const fg = ctx.createLinearGradient(0, hh, 0, hh - fh - 30);
      fg.addColorStop(0, 'rgba(255,90,30,0.55)'); fg.addColorStop(1, 'rgba(255,200,60,0)');
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.moveTo(fx - 10, hh);
      ctx.quadraticCurveTo(fx - 6 + fl * 4, hh - fh, fx + fl * 3, hh - fh - 30);
      ctx.quadraticCurveTo(fx + 6 + fl * 4, hh - fh, fx + 10, hh); ctx.closePath(); ctx.fill();
    }
  }

  // Respiración: se hincha un poco desde los pies
  let br = 1 + Math.sin(t * 2) * 0.025;
  if (boss.state === 'windup' && boss.windNext === 'jump') br = 0.86;
  ctx.translate(0, hh);
  if (boss.state === 'windup' && boss.windNext === 'charge') ctx.rotate(-0.12);
  ctx.scale(1, br); ctx.translate(0, -hh);

  // Capa real con pliegues y borde ondulante
  const capeG = ctx.createLinearGradient(0, -hh + 18, 0, hh + 12);
  capeG.addColorStop(0, p2 ? '#5a1414' : '#3a1c60');
  capeG.addColorStop(1, p2 ? '#1a0404' : '#10061e');
  ctx.fillStyle = capeG;
  const wave = Math.sin(t * 3) * 3;
  ctx.beginPath();
  ctx.moveTo(-hw - 10, -hh + 18);
  ctx.quadraticCurveTo(-hw - 18, 0, -hw - 16 - wave, hh + 10);
  ctx.quadraticCurveTo(-hw / 2, hh + 16 + wave, 0, hh + 10);
  ctx.quadraticCurveTo(hw / 2, hh + 16 - wave, hw + 16 + wave, hh + 10);
  ctx.quadraticCurveTo(hw + 18, 0, hw + 10, -hh + 18);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = p2 ? '#cc3311' : '#c8a000'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-hw - 16 - wave, hh + 10);
  ctx.quadraticCurveTo(-hw / 2, hh + 16 + wave, 0, hh + 10);
  ctx.quadraticCurveTo(hw / 2, hh + 16 - wave, hw + 16 + wave, hh + 10);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2;
  for (const fx of [-hw - 4, hw + 4]) {
    ctx.beginPath(); ctx.moveTo(fx, -hh + 24); ctx.quadraticCurveTo(fx * 1.1, 0, fx * 1.05, hh + 8); ctx.stroke();
  }

  // Cuerpo con volumen y pelaje
  ctx.fillStyle = vol(0, hh * 0.2, hw, p2 ? '#7a2c2c' : '#6e6e6e', p2 ? '#2e0c0c' : '#262626');
  ctx.beginPath(); ctx.ellipse(0, hh * 0.2, hw * 0.92, hh * 0.82, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = vol(2, hh * 0.35, hw * 0.55, p2 ? '#9a4a4a' : '#b4b4b4', p2 ? '#5a2020' : '#6a6a6a');
  ctx.beginPath(); ctx.ellipse(2, hh * 0.35, hw * 0.52, hh * 0.52, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const fy = hh * 0.1 + i * 6;
    ctx.beginPath(); ctx.moveTo(-6, fy); ctx.quadraticCurveTo(2, fy + 3, 10, fy); ctx.stroke();
  }

  // Cuello de armiño
  ctx.fillStyle = vol(0, hy + 20, 20, '#ffffff', '#cfc8b8');
  ctx.beginPath(); ctx.ellipse(0, hy + 20, 22, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  for (const sx of [-14, -5, 5, 14]) { ctx.beginPath(); ctx.ellipse(sx, hy + 20 + (sx % 2 ? 1 : -1), 1.4, 2.4, 0, 0, Math.PI * 2); ctx.fill(); }

  // Orejas
  for (const s of [-1, 1]) {
    ctx.fillStyle = vol(s * 17, hy - 18, 10, p2 ? '#5a1c1c' : '#5e5e5e', p2 ? '#240808' : '#2a2a2a');
