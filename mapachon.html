    ctx.fillStyle = vol(s * 17, hy - 17, 5, '#e0a0a0', '#8a4a4a');
    ctx.beginPath(); ctx.arc(s * 17, hy - 17, 4.5, 0, Math.PI * 2); ctx.fill();
  }

  // Cabeza
  ctx.fillStyle = vol(0, hy, 21, p2 ? '#6a2a2a' : '#727272', p2 ? '#2a0a0a' : '#2e2e2e');
  ctx.beginPath(); ctx.arc(0, hy, 21, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();

  // Corona dorada con joyas
  const cc = p2 ? '#cc3311' : '#c8a000';
  const crownG = ctx.createLinearGradient(0, hy - 38, 0, hy - 12);
  crownG.addColorStop(0, p2 ? '#ff8a60' : '#fff0a0');
  crownG.addColorStop(0.5, cc);
  crownG.addColorStop(1, p2 ? '#6a1404' : '#7a5a00');
  ctx.fillStyle = crownG;
  ctx.beginPath();
  ctx.moveTo(-19, hy - 14); ctx.lineTo(-14, hy - 32); ctx.lineTo(-8,  hy - 17);
  ctx.lineTo(  0, hy - 38); ctx.lineTo( 8,  hy - 17); ctx.lineTo(14, hy - 32);
  ctx.lineTo( 19, hy - 14); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = p2 ? '#4a0a00' : '#5a4000'; ctx.lineWidth = 1.2; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.fillStyle = crownG;
  ctx.beginPath(); ctx.roundRect(-20, hy - 17, 40, 6, 2); ctx.fill(); ctx.stroke();
  const gem = p2 ? '#ff5533' : '#44ccff';
  for (const [gx, gy, gr] of [[-14, hy - 30, 3.5], [0, hy - 36, 4.5], [14, hy - 30, 3.5]]) {
    ctx.fillStyle = vol(gx, gy, gr, '#ffffff', gem);
    ctx.beginPath(); ctx.arc(gx, gy, gr, 0, Math.PI * 2); ctx.fill();
  }
  // destello que gira sobre la joya central
  const tw = (Math.sin(t * 3) + 1) / 2;
  ctx.save();
  ctx.translate(0, hy - 36); ctx.rotate(t);
  ctx.fillStyle = `rgba(255,255,255,${(0.9 * tw).toFixed(2)})`;
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    ctx.lineTo(Math.cos(a) * 9 * tw, Math.sin(a) * 9 * tw);
    ctx.lineTo(Math.cos(a + Math.PI / 4) * 1.5, Math.sin(a + Math.PI / 4) * 1.5);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // Máscara de mapache
  ctx.fillStyle = '#111111';
  ctx.beginPath(); ctx.ellipse(8, hy - 1, 13, 9, 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillRect(-2, hy - 6, 3, 8);

  // Parche de cuero en el otro ojo, con su cinta
  ctx.strokeStyle = '#2a1a10'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-13, hy - 3); ctx.quadraticCurveTo(-19, hy - 5, -21, hy - 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4, hy - 6); ctx.quadraticCurveTo(0, hy - 12, 4, hy - 17); ctx.stroke();
  ctx.fillStyle = vol(-8, hy - 2, 7, '#5a4030', '#120a06');
  ctx.beginPath(); ctx.ellipse(-8, hy - 2, 6.5, 5.5, -0.2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#0a0604'; ctx.lineWidth = 1; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,220,180,0.25)'; ctx.lineWidth = 0.8;
  ctx.setLineDash([1.5, 1.5]);
  ctx.beginPath(); ctx.ellipse(-8, hy - 2, 4.6, 3.8, -0.2, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);

  // Ojo que brilla y late
  const ec = p2 ? '#ff2020' : '#ffcc00';
  const ep = 1 + 0.25 * Math.sin(t * 5);
  const eg = ctx.createRadialGradient(8, hy - 1, 0, 8, hy - 1, 12 * ep);
  eg.addColorStop(0, p2 ? 'rgba(255,144,144,0.9)' : 'rgba(255,238,136,0.9)');
  eg.addColorStop(1, 'rgba(255,200,100,0)');
  ctx.fillStyle = eg;
  ctx.beginPath(); ctx.arc(8, hy - 1, 12 * ep, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = vol(8, hy - 1, 5.5, '#ffffff', ec);
  ctx.beginPath(); ctx.arc(8, hy - 1, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a0a00';
  ctx.beginPath(); ctx.ellipse(8.6, hy - 1, 1.4, 3.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(6.5, hy - 2.8, 1.6, 0, Math.PI * 2); ctx.fill();
  // ceja enfadada
  ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(1, hy - 10); ctx.lineTo(17, hy - 6); ctx.stroke();

  // Hocico, nariz, colmillo y bigotes
  ctx.fillStyle = vol(-2, hy + 9, 10, p2 ? '#9a6060' : '#c8b8b8', p2 ? '#4a2020' : '#7a6a6a');
  ctx.beginPath(); ctx.ellipse(-2, hy + 9, 10, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = vol(-2, hy + 6, 4, '#555', '#000');
  ctx.beginPath(); ctx.ellipse(-2, hy + 6, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.arc(-3.4, hy + 5, 1, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2a1a1a'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-8, hy + 13); ctx.quadraticCurveTo(-2, hy + 11, 5, hy + 13); ctx.stroke();
  ctx.fillStyle = '#fffaf0';
  ctx.beginPath(); ctx.moveTo(1, hy + 12.4); ctx.lineTo(3, hy + 16); ctx.lineTo(4.4, hy + 12.6); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1; ctx.lineCap = 'round';
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(s * 4, hy + 9);  ctx.lineTo(s * 23, hy + 7);  ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s * 4, hy + 11); ctx.lineTo(s * 23, hy + 13); ctx.stroke();
  }

  // Cetro real con orbe que brilla
  const shaft = ctx.createLinearGradient(hw + 5, 0, hw + 22, 0);
  shaft.addColorStop(0, p2 ? '#ff7a50' : '#fff0a0'); shaft.addColorStop(1, p2 ? '#6a1404' : '#7a5a00');
  ctx.strokeStyle = shaft; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(hw + 5, -hh + 26); ctx.lineTo(hw + 22, -hh - 12); ctx.stroke();
  ctx.strokeStyle = p2 ? '#4a0a00' : '#5a4000'; ctx.lineWidth = 2;
  for (const k of [0.3, 0.7]) {
    const rx = hw + 5 + 17 * k, ry = -hh + 26 - 38 * k;
    ctx.beginPath(); ctx.moveTo(rx - 4, ry - 1.5); ctx.lineTo(rx + 4, ry + 1.5); ctx.stroke();
  }
  const orbC = p2 ? '#ff4040' : '#44ccff';
  const op = 0.6 + 0.4 * Math.sin(t * 4);
  const og = ctx.createRadialGradient(hw + 22, -hh - 12, 0, hw + 22, -hh - 12, 18);
  og.addColorStop(0, hexAlpha(orbC, 0.6 * op)); og.addColorStop(1, hexAlpha(orbC, 0));
  ctx.fillStyle = og; ctx.beginPath(); ctx.arc(hw + 22, -hh - 12, 18, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = vol(hw + 22, -hh - 12, 7, '#ffffff', orbC);
  ctx.beginPath(); ctx.arc(hw + 22, -hh - 12, 7, 0, Math.PI * 2); ctx.fill();

  ctx.restore();

  // Aviso, rugido y cetro alzado para la lluvia
  if (boss.state === 'windup') drawWarning(cx, cy - hh - 52, p2 ? '#ff5533' : '#ffd040');
  if (boss.state === 'roar') drawRoarRings(cx, cy + hy, (Date.now() * 0.0015) % 1, '255,90,40');
  if (boss.state === 'rain' || (boss.state === 'windup' && boss.windNext === 'rain')) {
    const ox = cx + boss.facing * (hw + 22), oy = cy - hh - 12;
    const rg = ctx.createRadialGradient(ox, oy, 0, ox, oy, 46);
    rg.addColorStop(0, 'rgba(255,120,120,0.7)'); rg.addColorStop(1, 'rgba(255,60,60,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(ox, oy, 46, 0, Math.PI * 2); ctx.fill();
    const bm = ctx.createLinearGradient(0, 0, 0, oy);
    bm.addColorStop(0, 'rgba(255,90,90,0)'); bm.addColorStop(1, 'rgba(255,90,90,0.35)');
    ctx.fillStyle = bm; ctx.fillRect(ox - 5, 0, 10, oy);
  }
}

function drawBossUI() {
  if (currentRoom !== 4) return;

  // Puerta de hierro (bloqueada mientras vive el jefe)
  if (!bossDefeated) {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 100, 20, H - 200);
    for (let yg = 108; yg < H - 108; yg += 44) {
      ctx.fillStyle = '#3a3a48';
      ctx.fillRect(0, yg, 20, 28);
      ctx.fillStyle = '#545464';
      ctx.fillRect(2, yg + 2, 5, 24);
    }
    ctx.strokeStyle = '#2a2a38'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, H / 2 - 10); ctx.lineTo(26, H / 2 - 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, H / 2 + 10); ctx.lineTo(26, H / 2 + 10); ctx.stroke();
  }

  // Barra de vida del jefe
  if (!boss.dead) {
    const barW = 400, barH = 18;
    const bx = (W - barW) / 2, by = H - 44;
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(bx - 6, by - 26, barW + 12, barH + 36);
    ctx.fillStyle = boss.phase === 2 ? '#cc2222' : '#9922cc';
    ctx.font = 'bold 14px serif';
    ctx.textAlign = 'center';
    ctx.fillText('✦  ÚLTIMO REY  ✦', W / 2, by - 8);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(bx, by, barW, barH);
    const fill = (boss.hp / boss.maxHp) * barW;
    ctx.fillStyle = boss.phase === 2 ? '#cc2233' : '#9922dd';
    ctx.fillRect(bx, by, fill, barH);
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(bx, by, fill, barH / 2);
    ctx.strokeStyle = boss.phase === 2 ? '#ff5544' : '#cc55ff';
    ctx.lineWidth = 1.5; ctx.strokeRect(bx, by, barW, barH);
  }

  // Mensaje de victoria
  if (bossDefeated && boss.deathTimer === 0) {
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#ffe060';
    ctx.font = 'bold 34px serif';
    ctx.textAlign = 'center';
    ctx.fillText('¡Victoria!  El rey ha caído.', W / 2, 110);
    ctx.font = '18px serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('La salida está abierta →← …regresa a la izquierda', W / 2, 144);
    // Brillo dorado en la salida
    const pulse = 0.3 + 0.2 * Math.sin(Date.now() * 0.004);
    const g = ctx.createLinearGradient(0, 0, 70, 0);
    g.addColorStop(0, `rgba(255,220,80,${pulse})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.globalAlpha = 1;
    ctx.fillRect(0, 100, 70, H - 200);
    ctx.restore();
  }
}

// ─── JEFE SECRETO: EL COLOSO INGRÁVIDO ───────────────────────────────────────
// Triple de vida que el rey, pero apunta mal: sus golpes llevan un error al azar
const BOSS3_FLOOR_Y = 480 - 120;
const BOSS3_GRAV = 0.32; // la sala tiene la gravedad baja
let boss3Defeated = false;
let boss3AttackIdx = 0;
const boss3 = {
  x: 1000, y: BOSS3_FLOOR_Y, w: 110, h: 120,
  vx: 0, vy: 0, hp: 30, maxHp: 30,
  state: 'wait', stateTimer: 120, phase: 1, invFrames: 0, facing: -1,
  dead: false, deathTimer: 0, projectiles: [], roared: false, windNext: null,
};
const rnd = (a, b) => a + Math.random() * (b - a);

function initBoss3() {
  Object.assign(boss3, {
    x: 1000, y: BOSS3_FLOOR_Y, vx: 0, vy: 0, hp: 30,
    state: 'wait', stateTimer: 120, phase: 1, invFrames: 0, facing: -1,
    dead: false, deathTimer: 0, projectiles: [], roared: false, windNext: null,
  });
  boss3AttackIdx = 0;
}

function boss3Hit(dmg, inv) {
  boss3.hp -= dmg; boss3.invFrames = inv;
  if (boss3.hp <= 0) { boss3.hp = 0; boss3.dead = true; boss3.deathTimer = 160; boss3.projectiles = []; shake(30, 6); }
}

function updateBoss3() {
  if (currentRoom !== 12) return;
  const rw = ROOMS[12].width;

  // Proyectiles: rocas lanzadas (gravedad baja), ondas y rocas que caen del techo
  for (const p of boss3.projectiles) {
    if (p.type === 'wave') { p.x += p.vx; p.life--; }
    else if (p.type === 'rain') {
      if (p.delay > 0) { p.delay--; continue; }
      p.vy = Math.min(p.vy + 0.3, 8); p.y += p.vy;
      if (p.y >= 470) p.life = 0;
    } else {
      p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.spin += p.vx * 0.02; p.life--;
      if (p.y >= 470) p.life = 0;
    }
  }
  boss3.projectiles = boss3.projectiles.filter(p => p.life > 0 && p.x > -40 && p.x < rw + 40);

  if (boss3.dead) {
    if (boss3.deathTimer > 0) boss3.deathTimer--;
    else if (!boss3Defeated) {
      boss3Defeated = true;
      addMoney(MONEY_BOSS * 3, boss3.x + boss3.w / 2, boss3.y);
    }
    return;
  }

  if (boss3.invFrames > 0) boss3.invFrames--;
  const newPhase = boss3.hp <= boss3.maxHp / 2 ? 2 : 1;
  if (newPhase === 2 && !boss3.roared && boss3.y >= BOSS3_FLOOR_Y) {
    boss3.roared = true;
    boss3.state = 'roar'; boss3.stateTimer = 80; boss3.vx = 0;
    shake(45, 7);
  }
  boss3.phase = newPhase;

  // Saltos lentos y flotantes
  if (boss3.y < BOSS3_FLOOR_Y) {
    boss3.vy += BOSS3_GRAV; boss3.y += boss3.vy; boss3.x += boss3.vx;
    boss3.x = Math.max(20, Math.min(rw - 20 - boss3.w, boss3.x));
    if (boss3.y >= BOSS3_FLOOR_Y) {
      boss3.y = BOSS3_FLOOR_Y; boss3.vy = 0; boss3.vx = 0;
      if (boss3.state === 'leap') {
        shake(20, 6);
        for (const dir of [-1, 1]) {
          boss3.projectiles.push({ type: 'wave', x: boss3.x + boss3.w / 2 + dir * 40, y: 480 - 12,
            vx: dir * (boss3.phase === 2 ? 4.6 : 3.8), vy: 0, r: 12, life: 170 });
        }
        boss3.state = 'wait'; boss3.stateTimer = 80;
      }
    }
    return;
  }

  boss3.stateTimer--;
  if (boss3.state === 'roar') {
    if (boss3.stateTimer <= 0) { boss3.state = 'wait'; boss3.stateTimer = 40; }
  } else if (boss3.state === 'windup') {
    if (boss3.stateTimer <= 0) startBoss3Attack(boss3.windNext);
  } else if (boss3.state === 'walk') {
    boss3.x += boss3.vx;
    if (boss3.x <= 20 || boss3.x + boss3.w >= rw - 20) boss3.stateTimer = 0;
    boss3.x = Math.max(20, Math.min(rw - 20 - boss3.w, boss3.x));
    if (boss3.stateTimer <= 0) { boss3.state = 'wait'; boss3.vx = 0; boss3.stateTimer = 50; }
  } else if (boss3.state === 'throw' || boss3.state === 'meteor') {
    if (boss3.stateTimer <= 0) { boss3.state = 'wait'; boss3.stateTimer = boss3.phase === 2 ? 60 : 85; }
  } else if (boss3.state === 'wait') {
    if (boss3.stateTimer <= 0) {
      const pattern = boss3.phase === 2
        ? ['leap', 'throw', 'meteor', 'walk', 'leap', 'throw', 'meteor']
        : ['walk', 'leap', 'throw', 'walk', 'leap'];
      const next = pattern[boss3AttackIdx++ % pattern.length];
      boss3.facing = (player.x + player.w / 2) > (boss3.x + boss3.w / 2) ? 1 : -1;
      boss3.state = 'windup'; boss3.windNext = next;
      boss3.stateTimer = next === 'walk' ? 20 : (boss3.phase === 2 ? 34 : 44);
    }
  }
}

function startBoss3Attack(next) {
  boss3.state = next;
  const pcx = player.x + player.w / 2, bcx = boss3.x + boss3.w / 2;
  if (next === 'walk') {
    boss3.vx = boss3.facing * (boss3.phase === 2 ? 2.6 : 2);
    boss3.stateTimer = 110;
  } else if (next === 'leap') {
    // apunta a donde estás… más o menos
    const tx = pcx + rnd(-260, 260);
    const air = 2 * 13 / BOSS3_GRAV;
    boss3.vy = -13; boss3.y -= 1;
    boss3.vx = Math.max(-7, Math.min(7, (tx - bcx) / air));
    boss3.facing = boss3.vx >= 0 ? 1 : -1;
  } else if (next === 'throw') {
    const n = boss3.phase === 2 ? 4 : 3;
    const ox = bcx + boss3.facing * 40, oy = boss3.y + 20;
    for (let i = 0; i < n; i++) {
      // tiro parabólico hacia el jugador con mucho error
      const dx = pcx + rnd(-220, 220) - ox;
      const t = rnd(55, 80);
      boss3.projectiles.push({ type: 'rock', x: ox, y: oy, vx: dx / t,
        vy: ((player.y + 20 - oy) - 0.5 * 0.1 * t * t) / t + rnd(-1.2, 1.2),
        r: 13, life: 260, spin: 0 });
    }
    boss3.stateTimer = 50;
  } else if (next === 'meteor') {
    // rocas del techo en sitios al azar de la pantalla (no te buscan)
    const n = boss3.phase === 2 ? 8 : 6;
    for (let i = 0; i < n; i++) {
      boss3.projectiles.push({ type: 'rain', x: camX + rnd(40, W / camZ - 40), y: camY - 20,
        vx: 0, vy: 0, r: 12, life: 400, delay: 50 + i * 9 });
    }
    shake(20, 3);
    boss3.stateTimer = 70;
  }
}

function checkBoss3Collisions() {
  if (currentRoom !== 12 || boss3.dead) return;
  const atkW = 52, atkH = 30;
  const atkX = player.facing === 1 ? player.x + player.w : player.x - atkW;
  const atkY = player.y + 6;
  const vuln = boss3.invFrames === 0 && boss3.state !== 'roar';

  if (player.attackActive > 0 && vuln &&
      collideRect(atkX, atkY, atkW, atkH, boss3.x, boss3.y, boss3.w, boss3.h)) {
    boss3Hit(playerDmg, 26); if (boss3.dead) return;
  }
  const onBoss  = collideRect(player.x, player.y, player.w, player.h, boss3.x, boss3.y, boss3.w, boss3.h);
  const fromTop = player.vy > 1 && (player.y + player.h) < (boss3.y + boss3.h * 0.4);
  if (onBoss && fromTop && vuln) {
    boss3Hit(playerDmg, 26); player.vy = -10;
    if (boss3.dead) return;
  }
  const hurt = (kx, inv) => {
    if (!godMode) {
      player.hp--;
      if (player.hp <= 0) { player.hp = 0; isDeath = true; startTransition(0, 80, 400); return true; }
    }
    player.invFrames = inv;
    player.vx = kx; player.vy = -6;
    return false;
  };
  if (player.invFrames === 0 && !fromTop &&
      collideRect(player.x + 3, player.y + 3, player.w - 6, player.h - 3, boss3.x + 8, boss3.y + 8, boss3.w - 16, boss3.h - 8)) {
    if (hurt((player.x + player.w / 2) < (boss3.x + boss3.w / 2) ? -7 : 7, 90)) return;
  }
  for (let i = boss3.projectiles.length - 1; i >= 0; i--) {
    const p = boss3.projectiles[i];
    if (p.type === 'rain' && p.delay > 0) continue;
    if (player.attackActive > 0 && p.type !== 'wave' &&
        collideRect(atkX, atkY, atkW, atkH, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2)) {
      boss3.projectiles.splice(i, 1); continue;
    }
    const dist = Math.hypot((player.x + player.w / 2) - p.x, (player.y + player.h / 2) - p.y);
    if (dist < p.r + 12 && player.invFrames === 0) {
      boss3.projectiles.splice(i, 1);
      if (hurt(player.x < p.x ? -5 : 5, 70)) return;
    }
  }
}

function drawBoss3() {
  if (currentRoom !== 12) return;
  for (const p of boss3.projectiles) {
    if (p.type === 'wave' || (p.type === 'rain' && p.delay > 0)) { drawBossProjectile(p, '110,200,255', '#60b0ff'); continue; }
    // roca flotante
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.spin || p.y * 0.05);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, p.r * 2);
    g.addColorStop(0, 'rgba(110,200,255,0.35)'); g.addColorStop(1, 'rgba(110,200,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, p.r * 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = vol(0, 0, p.r, '#8a8fa0', '#30343e');
    ctx.beginPath();
    for (let k = 0; k < 7; k++) {
      const a = k / 7 * Math.PI * 2, rr = p.r * (0.8 + ((k * 5) % 3) * 0.12);
      k ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(rr, 0);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(140,220,255,0.7)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-4, -5); ctx.lineTo(1, 0); ctx.lineTo(-2, 5); ctx.stroke();
    ctx.restore();
  }

  if (boss3.dead) {
    if (boss3.deathTimer <= 0) return;
    drawBossDeath(boss3.x + boss3.w / 2, boss3.y + boss3.h / 2, boss3.deathTimer / 160,
      ['#60c0ff', '#ffffff', '#a0e0ff', '#8090a0', '#40ffff'], 160);
    return;
  }

  const cx = Math.round(boss3.x + boss3.w / 2), cy = Math.round(boss3.y + boss3.h / 2);
  const hw = boss3.w / 2, hh = boss3.h / 2;
  const t = Date.now() * 0.002, p2 = boss3.phase === 2;
  const rune = p2 ? '255,110,90' : '110,200,255';
  const flicker = boss3.invFrames > 0 && Math.floor(boss3.invFrames / 4) % 2 === 0;
  const walk = boss3.state === 'walk' ? Math.sin(Date.now() * 0.012) : 0;
  const crouch = boss3.state === 'windup' && boss3.windNext === 'leap' ? 10 : 0;

  ctx.save();
  // sombra (se encoge al estar en el aire)
  const air = Math.max(0, BOSS3_FLOOR_Y - boss3.y);
  ctx.fillStyle = `rgba(0,0,0,${(0.45 - Math.min(0.3, air / 600)).toFixed(2)})`;
  ctx.beginPath(); ctx.ellipse(cx, 482, hw * Math.max(0.4, 0.9 - air / 500), 8, 0, 0, Math.PI * 2); ctx.fill();

  // piedras que orbitan (gravedad baja)
  for (let i = 0; i < 5; i++) {
    const a = t * 0.8 + i * 1.257, ox = Math.cos(a) * (hw + 26), oy = Math.sin(a) * 18 - hh * 0.2;
    ctx.fillStyle = vol(cx + ox, cy + oy, 6, '#9aa0b0', '#3a3e48');
    ctx.beginPath(); ctx.arc(cx + ox, cy + oy, 5 + (i % 2) * 2, 0, Math.PI * 2); ctx.fill();
  }

  ctx.translate(cx, cy + crouch);
  ctx.scale(boss3.facing, 1);
  if (flicker) ctx.globalAlpha = 0.45;
  const stone = (x, y, w, h, r) => {
    ctx.fillStyle = vol(x + w / 2, y + h / 2, Math.max(w, h) / 2, '#8a8e9c', '#2e313a');
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
  };
  // piernas
  stone(-hw + 14, hh - 34 + walk * 3, 32, 34 - crouch, 8);
  stone(hw - 46, hh - 34 - walk * 3, 32, 34 - crouch, 8);
  // brazo trasero
  ctx.save(); ctx.translate(-hw + 6, -hh + 46); ctx.rotate(-0.15 - walk * 0.2);
  stone(-14, 0, 26, 52, 10); ctx.restore();
  // torso
  stone(-hw + 6, -hh + 30, boss3.w - 12, boss3.h - 62, 18);
  // runas del pecho
  const glow = 0.55 + 0.35 * Math.sin(t * 3);
  ctx.strokeStyle = `rgba(${rune},${glow.toFixed(2)})`; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.shadowColor = `rgba(${rune},1)`; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.moveTo(-14, -6); ctx.lineTo(0, -18); ctx.lineTo(14, -6); ctx.lineTo(0, 8); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(0, 22); ctx.stroke();
  ctx.shadowBlur = 0;
  // cabeza
  stone(-24, -hh + 2, 48, 36, 12);
  // ojo único que brilla
  const eg = ctx.createRadialGradient(10, -hh + 19, 0, 10, -hh + 19, 16);
  eg.addColorStop(0, `rgba(${rune},0.9)`); eg.addColorStop(1, `rgba(${rune},0)`);
  ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(10, -hh + 19, 16, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(10, -hh + 19, 4, 0, Math.PI * 2); ctx.fill();
  // brazo delantero (lo levanta al lanzar)
  const raise = boss3.state === 'throw' || (boss3.state === 'windup' && boss3.windNext === 'throw') ? -2.2 : 0.15 + walk * 0.2;
  ctx.save(); ctx.translate(hw - 10, -hh + 46); ctx.rotate(raise);
  stone(-12, 0, 26, 54, 10);
  ctx.fillStyle = `rgba(${rune},${(glow * 0.8).toFixed(2)})`;
  ctx.fillRect(-2, 18, 6, 16);
  ctx.restore();
  ctx.restore();

  if (boss3.state === 'windup') drawWarning(cx, boss3.y - 30, p2 ? '#ff6a50' : '#70c8ff');
  if (boss3.state === 'roar') drawRoarRings(cx, cy, (Date.now() * 0.0015) % 1, rune);
}

function drawBoss3UI() {
  if (currentRoom !== 12) return;
  if (!boss3.dead) {
    const barW = 460, barH = 18, bx = (W - barW) / 2, by = 40; // arriba: abajo taparía al mapache
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(bx - 6, by - 26, barW + 12, barH + 36);
    ctx.fillStyle = boss3.phase === 2 ? '#ff7a60' : '#70c8ff';
    ctx.font = 'bold 14px serif'; ctx.textAlign = 'center';
    ctx.fillText('✦  COLOSO INGRÁVIDO  ✦', W / 2, by - 8);
    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(bx, by, barW, barH);
    const fill = (boss3.hp / boss3.maxHp) * barW;
    ctx.fillStyle = boss3.phase === 2 ? '#d04a3a' : '#3a8ad0';
    ctx.fillRect(bx, by, fill, barH);
    ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(bx, by, fill, barH / 2);
    ctx.strokeStyle = boss3.phase === 2 ? '#ff8a70' : '#90d8ff';
    ctx.lineWidth = 1.5; ctx.strokeRect(bx, by, barW, barH);
  } else if (boss3Defeated) {
    ctx.save();
    ctx.globalAlpha = 0.9; ctx.textAlign = 'center';
    ctx.fillStyle = '#a0e0ff'; ctx.font = 'bold 34px serif';
    ctx.fillText('¡El Coloso ha caído!', W / 2, 110);
    ctx.fillStyle = '#ffffff'; ctx.font = '18px serif';
    ctx.fillStyle = '#bfe4ff';
    ctx.fillText('Has obtenido el DOBLE SALTO: salta otra vez en el aire', W / 2, 144);
    ctx.fillStyle = '#ffffff'; ctx.font = '15px serif';
    ctx.fillText('La salida está a la izquierda', W / 2, 168);
    ctx.restore();
  }
}

// Escalera secreta de la sala del rey: casi invisible, se nota al acercarte
function drawSecretStair(p) {
  const d = Math.hypot(player.x + player.w / 2 - (p.x + p.w / 2), player.y + player.h - p.y);
  const a = 0.07 + 0.35 * Math.max(0, 1 - d / 140);
  ctx.fillStyle = `rgba(110,40,40,${a.toFixed(2)})`;
  ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.fillStyle = `rgba(255,170,150,${(a * 0.6).toFixed(2)})`;
  ctx.fillRect(p.x, p.y, p.w, 1.5);
}

// Piedras flotando hacia arriba: la sala no tiene casi gravedad
function drawFloatStones(room) {
  const tt = Date.now() * 0.001;
  for (let i = 0; i < 70; i++) {
    const x = (i * 293) % room.width + Math.sin(tt * 0.6 + i) * 14;
    const span = H - (room.top || 0) + 60;
    const y = H + 30 - ((tt * (12 + (i % 5) * 5) + i * 97) % span);
    const r = 3 + (i % 4) * 2;
    ctx.globalAlpha = 0.35 + (i % 3) * 0.15;
    ctx.fillStyle = vol(x, y, r, '#8aa0c8', '#2a3450');
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // columnas rotas a lo largo de la sala
  for (let x = 160, k = 0; x < room.width; x += 400, k++) {
    // columnas de distinta altura (unas llegan casi al techo)
    const ct = k % 3 === 0 ? (room.top || 0) + 160 : k % 3 === 1 ? 120 : -180;
    const g = ctx.createLinearGradient(x - 20, 0, x + 20, 0);
    g.addColorStop(0, '#16203a'); g.addColorStop(0.5, '#24304e'); g.addColorStop(1, '#121a30');
    ctx.fillStyle = g;
    ctx.fillRect(x - 20, ct, 40, 480 - ct);
    ctx.fillStyle = '#2c3a5c'; ctx.fillRect(x - 26, 466, 52, 14);
    // trozo roto flotando encima
    const by = ct - 40 + Math.sin(tt + x) * 8;
    ctx.save(); ctx.translate(x, by); ctx.rotate(Math.sin(tt * 0.7 + x) * 0.15);
    ctx.fillStyle = '#24304e'; ctx.fillRect(-20, -18, 40, 30);
    ctx.fillStyle = '#2c3a5c'; ctx.fillRect(-26, -24, 52, 10);
    ctx.restore();
  }
}

// ─── JEFES: LOS DOS GUARDIAS DEL CASTILLO ────────────────────────────────────
// Guardia del Escudo: embiste, se cubre con el escudo (de frente no le haces daño)
// y salta aplastando el suelo. Guardia de la Alabarda: estocada larga, giro y
// lanza la hoja como un bumerán. Si cae uno, el otro se enfurece.
const GUARD_FLOOR = 480;
let guardsDefeated = false;
const guards = [
  { kind: 'shield',  name: 'Guardia del Escudo' },
  { kind: 'halberd', name: 'Guardia de la Alabarda' },
];
const guardProjectiles = [];

function initGuards() {
  guards.forEach((g, i) => Object.assign(g, {
    x: i === 0 ? 170 : 740, y: GUARD_FLOOR - 70, w: 46, h: 70, vx: 0, vy: 0,
    hp: 12, maxHp: 12, state: 'intro', stateTimer: 90 + i * 40, facing: i === 0 ? 1 : -1,
    invFrames: 0, dead: false, deathTimer: 0, paid: false, windNext: null, atkIdx: 0,
    blockFlash: 0, headOut: false, spin: 0,
  }));
  guardProjectiles.length = 0;
}

const GUARD_ACTIVE = ['bash', 'jump', 'thrust', 'spin', 'block', 'windup'];
function guardHit(g, dmg, inv) {
  g.hp -= dmg; g.invFrames = inv;
  if (g.hp <= 0) { g.hp = 0; g.dead = true; g.deathTimer = 120; shake(18, 4); }
}

function updateGuards() {
  if (currentRoom !== 13) return;
  const pcx = player.x + player.w / 2;

  // Proyectiles: ondas del aplastamiento y la hoja-bumerán
  for (const p of guardProjectiles) {
    p.life--;
    if (p.type === 'wave') p.x += p.vx;
    else if (p.type === 'blade') {
      // sale en línea recta hacia donde estabas, frena y vuelve a la mano
      const o = p.owner, hx = o.x + o.w / 2, hy = o.y + 26;
      p.s -= p.dec; p.spin += 0.35;
      if (p.s > 0) { p.x += p.dx * p.s; p.y += p.dy * p.s; }
      else {
        const len = Math.hypot(hx - p.x, hy - p.y) || 1, sp = Math.min(10, 2 - p.s);
        p.x += (hx - p.x) / len * sp; p.y += (hy - p.y) / len * sp;
        if (len < 24) { p.life = 0; o.headOut = false; }
      }
      if (o.dead) { p.life = 0; o.headOut = false; }
    }
  }
  for (let i = guardProjectiles.length - 1; i >= 0; i--) {
    const p = guardProjectiles[i];
    if (p.life <= 0 || p.x < -40 || p.x > W + 40) {
      if (p.type === 'blade') p.owner.headOut = false;
      guardProjectiles.splice(i, 1);
    }
  }

  for (const g of guards) {
    const other = guards[0] === g ? guards[1] : guards[0];
    if (g.dead) {
      if (g.deathTimer > 0) g.deathTimer--;
      else if (!g.paid) { g.paid = true; addMoney(MONEY_BOSS, g.x + g.w / 2, g.y); dropGuardKey(g); }
      continue;
    }
    if (g.invFrames > 0) g.invFrames--;
    if (g.blockFlash > 0) g.blockFlash--;
    const angry = other.dead;
    const gcx = g.x + g.w / 2;

    // gravedad
    g.vy += 0.6; g.y += g.vy;
    if (g.y + g.h >= GUARD_FLOOR) {
      g.y = GUARD_FLOOR - g.h;
      if (g.vy > 2 && g.state === 'jump') {
        shake(14, 4);
        for (const dir of [-1, 1]) guardProjectiles.push({ type: 'wave', x: gcx + dir * 26, y: GUARD_FLOOR - 12, vx: dir * (angry ? 5.5 : 4.5), r: 12, life: 130 });
        g.state = 'recover'; g.stateTimer = 40; g.vx = 0;
      }
      g.vy = 0;
    }

    g.stateTimer--;
    switch (g.state) {
      case 'intro':
        g.facing = pcx > gcx ? 1 : -1;
        if (g.stateTimer <= 0) { g.state = 'walk'; g.stateTimer = 40; }
        break;
      case 'walk': {
        g.facing = pcx > gcx ? 1 : -1;
        const dist = Math.abs(pcx - gcx), keep = g.kind === 'halberd' ? 150 : 40;
        const sp = angry ? 1.9 : 1.3;
        g.vx = dist > keep + 20 ? g.facing * sp : dist < keep - 20 ? -g.facing * sp * 0.7 : 0;
        if (g.stateTimer <= 0) {
          // no atacan los dos a la vez
          if (GUARD_ACTIVE.includes(other.state) && !other.dead) { g.stateTimer = 20; break; }
          const list = g.kind === 'shield' ? ['bash', 'block', 'jump'] : ['thrust', 'throw', 'spin'];
          g.windNext = list[g.atkIdx++ % list.length];
          if (g.windNext === 'throw' && g.headOut) g.windNext = 'thrust';
          g.state = 'windup'; g.stateTimer = angry ? 20 : 30; g.vx = 0;
        }
        break;
      }
      case 'windup':
        g.vx = 0; g.facing = pcx > gcx ? 1 : -1;
        if (g.stateTimer <= 0) startGuardAttack(g, angry);
        break;
      case 'bash':
      case 'thrust':
        if (g.stateTimer <= 0) { g.stateTimer = g.state === 'thrust' ? 45 : 40; g.state = 'recover'; g.vx = 0; }
        break;
      case 'block':
        g.vx = 0; g.facing = pcx > gcx ? 1 : -1;
        if (g.stateTimer <= 0) { g.state = 'recover'; g.stateTimer = 20; }
        break;
      case 'spin':
        g.spin += 0.45;
        g.vx = (pcx > gcx ? 1 : -1) * (angry ? 2.2 : 1.5);
        if (g.stateTimer <= 0) { g.state = 'recover'; g.stateTimer = 55; g.vx = 0; }
        break;
      case 'jump':
        break; // aterriza arriba
      case 'recover':
        g.vx *= 0.85;
        if (g.stateTimer <= 0) { g.state = 'walk'; g.stateTimer = angry ? 35 : 65; }
        break;
    }
    g.x += g.vx;
    if (g.x < 20) { g.x = 20; if (g.state === 'bash') g.stateTimer = 0; }
    if (g.x + g.w > W - 20) { g.x = W - 20 - g.w; if (g.state === 'bash') g.stateTimer = 0; }
  }

  if (!guardsDefeated && guards.every(g => g.dead && g.deathTimer <= 0)) guardsDefeated = true;
}

function startGuardAttack(g, angry) {
  const pcx = player.x + player.w / 2, gcx = g.x + g.w / 2;
  g.state = g.windNext;
  if (g.state === 'bash')   { g.vx = g.facing * (angry ? 9 : 7.5); g.stateTimer = 45; }
  if (g.state === 'block')  { g.stateTimer = angry ? 70 : 100; }
  if (g.state === 'jump')   { g.vy = -12 - Math.min(4, Math.max(0, (g.y - player.y) / 60)); g.y -= 1; g.vx = Math.max(-5, Math.min(5, (pcx - gcx) / 40)); }
  if (g.state === 'thrust') { g.vx = g.facing * (angry ? 9 : 8); g.stateTimer = 18; }
  if (g.state === 'spin')   { g.stateTimer = angry ? 90 : 70; }
  if (g.state === 'throw') {
    g.headOut = true;
    const bx = gcx + g.facing * 30, by = g.y + 26;
    const ddx = pcx - bx, ddy = (player.y + player.h / 2) - by, dl = Math.hypot(ddx, ddy) || 1;
    const s0 = angry ? 9 : 8;
    // frena justo un poco más allá de donde estabas
    guardProjectiles.push({ type: 'blade', x: bx, y: by, dx: ddx / dl, dy: ddy / dl, s: s0,
      dec: Math.max(0.09, s0 * s0 / (2 * (dl + 70))),
      r: 14, life: 260, spin: 0, owner: g });
    g.state = 'recover'; g.stateTimer = 50;
  }
}

// Zona de daño del arma durante la estocada y el giro
function guardWeaponHit(g) {
  const pcx = player.x + player.w / 2, pcy = player.y + player.h / 2;
  if (g.state === 'thrust') {
    const hx = g.facing > 0 ? g.x + g.w : g.x - 60;
    return collideRect(player.x, player.y, player.w, player.h, hx, g.y + 24, 60, 16);
  }
  if (g.state === 'spin') return Math.hypot(pcx - (g.x + g.w / 2), pcy - (g.y + g.h / 2)) < 64;
  return false;
}

function checkGuardCollisions() {
  if (currentRoom !== 13) return;
  const atkW = 52, atkH = 30;
  const atkX = player.facing === 1 ? player.x + player.w : player.x - atkW;
  const atkY = player.y + 6;
  const hurt = (kx, inv) => {
    if (!godMode) {
      player.hp--;
      if (player.hp <= 0) { player.hp = 0; isDeath = true; startTransition(0, 80, 400); return true; }
    }
    player.invFrames = inv; player.vx = kx; player.vy = -7;
    return false;
  };

  for (const g of guards) {
    if (g.dead || g.state === 'intro') continue;
    const gcx = g.x + g.w / 2, pcx = player.x + player.w / 2;
    const front = Math.sign(pcx - gcx) === g.facing;
    const blocking = g.kind === 'shield' && g.state === 'block';

    if (player.attackActive > 0 && g.invFrames === 0 &&
        collideRect(atkX, atkY, atkW, atkH, g.x, g.y, g.w, g.h)) {
      if (blocking && front) {
        g.blockFlash = 12; g.invFrames = 12;
        player.vx = pcx < gcx ? -6 : 6; // el escudo te rechaza
      } else { guardHit(g, playerDmg, 24); if (g.dead) continue; }
    }
    const onG = collideRect(player.x, player.y, player.w, player.h, g.x, g.y, g.w, g.h);
    const fromTop = player.vy > 1 && (player.y + player.h) < (g.y + g.h * 0.4);
    if (onG && fromTop && g.invFrames === 0) { guardHit(g, playerDmg, 24); player.vy = -11; if (g.dead) continue; }

    if (player.invFrames === 0 && !fromTop &&
        (guardWeaponHit(g) || collideRect(player.x + 3, player.y + 3, player.w - 6, player.h - 3, g.x + 6, g.y + 6, g.w - 12, g.h - 6))) {
      if (hurt(pcx < gcx ? -7 : 7, 90)) return;
    }
  }

  for (let i = guardProjectiles.length - 1; i >= 0; i--) {
    const p = guardProjectiles[i];
    if (p.type === 'blade' && player.attackActive > 0 &&
        collideRect(atkX, atkY, atkW, atkH, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2)) {
      p.s = Math.min(p.s, 0); // de un golpe la mandas de vuelta
      continue;
    }
    const dist = Math.hypot((player.x + player.w / 2) - p.x, (player.y + player.h / 2) - p.y);
    if (dist < p.r + 12 && player.invFrames === 0) {
      if (p.type === 'wave') guardProjectiles.splice(i, 1);
      if (hurt(player.x < p.x ? -5 : 5, 70)) return;
    }
  }
}

// Disparo del jugador contra un guardia; devuelve true si choca
function guardShot(sx, sy, sd, s) {
  for (const g of guards) {
    if (g.dead || g.state === 'intro' || !collideRect(sx, sy, sd, sd, g.x, g.y, g.w, g.h)) continue;
    if (g.kind === 'shield' && g.state === 'block' && Math.sign(s.vx) === -g.facing) { g.blockFlash = 12; return true; }
    if (g.invFrames === 0) guardHit(g, s.dmg, 12);
    return true;
  }
  return false;
}

function drawGuards() {
  if (currentRoom !== 13) return;
  const now = Date.now();
  for (const p of guardProjectiles) {
    if (p.type === 'wave') { drawBossProjectile(p, '255,170,80', '#ff9040'); continue; }
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.spin);
    ctx.strokeStyle = 'rgba(255,220,180,0.35)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.stroke();
    drawHalberdHead(0, 0, 1);
    ctx.restore();
  }
  for (const g of guards) drawGuard(g, now);
}

// Hoja de alabarda (hacha + punta), centrada en 0,0
function drawHalberdHead(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = vol(4, 0, 14, '#f0f2f8', '#6a7080');
  ctx.beginPath(); ctx.moveTo(-2, -16); ctx.quadraticCurveTo(16, -12, 14, 0); ctx.quadraticCurveTo(16, 12, -2, 16); ctx.quadraticCurveTo(4, 0, -2, -16); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-6, -4); ctx.lineTo(-14, 0); ctx.lineTo(-6, 4); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(10, -8); ctx.quadraticCurveTo(13, 0, 10, 8); ctx.stroke();
  ctx.restore();
}

function drawGuard(g, now) {
  if (g.dead) {
    if (g.deathTimer > 0) drawBossDeath(g.x + g.w / 2, g.y + g.h / 2, g.deathTimer / 120,
      g.kind === 'shield' ? ['#5080ff', '#ffffff', '#c0c8d8', '#ffd060'] : ['#ff5050', '#ffffff', '#c0c8d8', '#ffd060'], 90);
    return;
  }
  const shieldK = g.kind === 'shield';
  const tab = shieldK ? '#2a4aa0' : '#a02a2a', tabD = shieldK ? '#16285a' : '#5a1414';
  const angry = guards.some(o => o !== g && o.dead);
  const walking = Math.abs(g.vx) > 0.3 && g.state !== 'spin';
  const step = walking ? Math.sin(now * (g.state === 'bash' ? 0.03 : 0.012)) : 0;
  const cx = Math.round(g.x + g.w / 2), fy = Math.round(g.y + g.h);
  const flicker = g.invFrames > 0 && Math.floor(g.invFrames / 4) % 2 === 0 && g.blockFlash === 0;

  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(cx, GUARD_FLOOR + 2, 26, 6, 0, 0, Math.PI * 2); ctx.fill();
  if (angry) {
    const ag = ctx.createRadialGradient(cx, fy - 35, 0, cx, fy - 35, 70);
    ag.addColorStop(0, 'rgba(255,80,40,0.25)'); ag.addColorStop(1, 'rgba(255,80,40,0)');
    ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(cx, fy - 35, 70, 0, Math.PI * 2); ctx.fill();
  }
  ctx.translate(cx, fy);
  ctx.scale(g.facing, 1);
  if (g.state === 'bash' || g.state === 'thrust') ctx.rotate(0.12);
  if (g.state === 'windup' && (g.windNext === 'jump' || g.windNext === 'bash')) ctx.scale(1, 0.92);
  if (flicker) ctx.globalAlpha = 0.45;
  const steel = (x, y, r) => vol(x, y, r, '#e4e8f0', '#4a505e');

  // capa
  ctx.fillStyle = tabD;
  ctx.beginPath(); ctx.moveTo(-12, -60); ctx.quadraticCurveTo(-24, -30, -22 - step * 2, -6); ctx.lineTo(-6, -10); ctx.closePath(); ctx.fill();
  // alabarda detrás (en reposo)
  const holdPole = !shieldK && g.state !== 'thrust' && g.state !== 'spin';
  if (holdPole) {
    const tilt = g.state === 'windup' && g.windNext === 'thrust' ? -1.25 : g.state === 'windup' && g.windNext === 'throw' ? -0.6 : 0.12;
    ctx.save(); ctx.translate(16, -40); ctx.rotate(tilt);
    ctx.strokeStyle = '#5a3a1e'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 44); ctx.lineTo(0, -58); ctx.stroke();
    if (!g.headOut) { ctx.save(); ctx.translate(2, -60); ctx.rotate(-Math.PI / 2); drawHalberdHead(0, 0, 0.9); ctx.restore(); }
    ctx.restore();
  }
  // piernas
  for (const [lx, ph] of [[-8, step], [8, -step]]) {
    ctx.fillStyle = steel(lx, -14, 10);
    ctx.beginPath(); ctx.roundRect(lx - 6 + ph * 3, -30, 12, 26, 4); ctx.fill();
    ctx.fillStyle = '#2a2e38';
    ctx.beginPath(); ctx.roundRect(lx - 7 + ph * 3, -6, 16, 6, [3, 5, 1, 1]); ctx.fill();
  }
  // torso con peto
  ctx.fillStyle = steel(-2, -46, 20);
  ctx.beginPath(); ctx.roundRect(-16, -62, 32, 36, 8); ctx.fill();
  // sobreveste con emblema
  ctx.fillStyle = tab;
  ctx.beginPath(); ctx.moveTo(-12, -50); ctx.lineTo(12, -50); ctx.lineTo(14, -18); ctx.lineTo(4, -22); ctx.lineTo(0, -16); ctx.lineTo(-4, -22); ctx.lineTo(-14, -18); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e0b040';
  ctx.beginPath(); ctx.moveTo(0, -46); ctx.lineTo(5, -38); ctx.lineTo(0, -30); ctx.lineTo(-5, -38); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2a1a10'; ctx.fillRect(-14, -28, 28, 4);
  // hombreras
  for (const sx of [-14, 14]) {
    ctx.fillStyle = steel(sx, -60, 9);
    ctx.beginPath(); ctx.ellipse(sx, -58, 9, 6, 0, 0, Math.PI * 2); ctx.fill();
  }
  // casco con visera y penacho
  const plume = shieldK ? '#4a7aff' : '#ff4a4a';
  ctx.fillStyle = plume;
  ctx.beginPath(); ctx.moveTo(0, -86);
  ctx.quadraticCurveTo(-14, -96, -26 - step * 2, -84 + Math.sin(now * 0.006) * 2);
  ctx.quadraticCurveTo(-14, -88, -2, -80); ctx.closePath(); ctx.fill();
  ctx.fillStyle = steel(0, -74, 13);
  ctx.beginPath(); ctx.arc(0, -72, 12, Math.PI, 0); ctx.lineTo(12, -62); ctx.quadraticCurveTo(0, -58, -12, -62); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#14161c'; ctx.fillRect(-2, -73, 14, 4);
  ctx.fillStyle = angry ? '#ff3020' : (shieldK ? '#80b0ff' : '#ff9060');
  ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8;
  ctx.fillRect(4, -72.5, 5, 2.5);
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, -84); ctx.lineTo(0, -60); ctx.stroke();

  if (shieldK) {
    // escudo en punta (arriba al cubrirse)
    const up = g.state === 'block' ? -14 : g.state === 'bash' ? -6 : 0;
    const sxp = g.state === 'block' || g.state === 'bash' ? 22 : 16;
    ctx.save(); ctx.translate(sxp, -44 + up);
    ctx.fillStyle = tabD;
    ctx.beginPath(); ctx.moveTo(-12, -20); ctx.lineTo(12, -20); ctx.lineTo(12, 4); ctx.quadraticCurveTo(10, 18, 0, 26); ctx.quadraticCurveTo(-10, 18, -12, 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = tab;
    ctx.beginPath(); ctx.moveTo(-9, -17); ctx.lineTo(9, -17); ctx.lineTo(9, 3); ctx.quadraticCurveTo(7, 15, 0, 22); ctx.quadraticCurveTo(-7, 15, -9, 3); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#c8ccd8'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-12, -20); ctx.lineTo(12, -20); ctx.lineTo(12, 4); ctx.quadraticCurveTo(10, 18, 0, 26); ctx.quadraticCurveTo(-10, 18, -12, 4); ctx.closePath(); ctx.stroke();
    ctx.fillStyle = '#e0b040';
    ctx.fillRect(-1.5, -14, 3, 30); ctx.fillRect(-7, -6, 14, 3);
    if (g.blockFlash > 0) {
      ctx.fillStyle = `rgba(255,255,220,${(g.blockFlash / 12).toFixed(2)})`;
      ctx.beginPath(); ctx.arc(10, -4, 6 + (12 - g.blockFlash) * 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  } else if (g.state === 'thrust' || g.state === 'spin') {
    // alabarda en horizontal (estocada) o girando
    ctx.save(); ctx.translate(0, -42);
    if (g.state === 'spin') ctx.rotate(g.spin);
    ctx.strokeStyle = '#5a3a1e'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(56, 0); ctx.stroke();
    if (!g.headOut) drawHalberdHead(62, 0, 1);
    if (g.state === 'spin') {
      ctx.strokeStyle = 'rgba(255,230,200,0.35)'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(0, 0, 62, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }
  // brazo delantero
  ctx.fillStyle = steel(12, -50, 8);
  ctx.beginPath(); ctx.roundRect(8, -56, 10, 20, 4); ctx.fill();
  ctx.restore();

  if (g.state === 'windup') drawWarning(cx, g.y - 34, angry ? '#ff5533' : '#ffd040');
}

// Trampilla en el suelo del pico
function drawHatch(h) {
  const t = Date.now() * 0.001;
  ctx.save();
  // marco de piedra
  ctx.fillStyle = '#1a1c24'; ctx.fillRect(h.x - 4, h.y - 2, h.w + 8, 10);
  // tablas
  const g = ctx.createLinearGradient(0, h.y - 4, 0, h.y + 6);
  g.addColorStop(0, '#6a4a2a'); g.addColorStop(1, '#3a2614');
  ctx.fillStyle = g; ctx.fillRect(h.x, h.y - 4, h.w, 9);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  for (let x = h.x + 14; x < h.x + h.w; x += 14) ctx.fillRect(x, h.y - 4, 1.2, 9);
  // bandas de hierro y argolla
  ctx.fillStyle = '#2a2e38'; ctx.fillRect(h.x + 6, h.y - 4, 5, 9); ctx.fillRect(h.x + h.w - 11, h.y - 4, 5, 9);
  ctx.strokeStyle = '#8a8e98'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(h.x + h.w / 2, h.y - 4, 6, 3.5, 0, Math.PI, 0); ctx.stroke();
  // luz de antorchas que se escapa por las rendijas
  const a = 0.35 + 0.15 * Math.sin(t * 6);
  ctx.fillStyle = `rgba(255,160,70,${a.toFixed(2)})`;
  for (let x = h.x + 14; x < h.x + h.w; x += 14) ctx.fillRect(x - 0.5, h.y + 3, 2, 3);
  ctx.restore();
}

function drawHatchHint(h) {
  const d = Math.abs(player.x + player.w / 2 - (h.x + h.w / 2));
  if (d > 80 || Math.abs(player.y + player.h - h.y) > 60) return;
  ctx.save();
  ctx.globalAlpha = Math.min(1, (80 - d) / 30);
  ctx.fillStyle = '#ffe0b0'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
  ctx.fillText('↓ bajar', h.x + h.w / 2, h.y - 50);
  ctx.restore();
}

// ─── LLAVES DE LOS GUARDIAS Y PUERTA AL CAPÍTULO III ─────────────────────────
// Cada guardia suelta una llave (azul el del escudo, roja el de la alabarda);
// con las dos se abre la puerta de la derecha del Salón de la Guardia.
const guardKeys = [];          // { color, x, y, bob } tiradas en el suelo
const keysHeld = { blue: false, red: false };
let castleDoorOpen = false;
let chapter3Shown = false;
const KEY_COLORS = {
  blue: { light: '#d0e4ff', mid: '#4a8aff', dark: '#1a3a90', glow: '80,140,255' },
  red:  { light: '#ffd8d0', mid: '#ff4a3a', dark: '#901a14', glow: '255,90,70' },
};

function dropGuardKey(g) {
  guardKeys.push({ color: g.kind === 'shield' ? 'blue' : 'red', x: g.x + g.w / 2, y: GUARD_FLOOR - 34, bob: 0 });
}

function updateGuardKeys() {
  if (currentRoom !== 13) return;
  for (let i = guardKeys.length - 1; i >= 0; i--) {
    const k = guardKeys[i];
    k.bob += 0.055;
    if (collideRect(player.x, player.y, player.w, player.h, k.x - 16, k.y - 14, 32, 28)) {
      keysHeld[k.color] = true;
      moneyPops.push({ x: k.x, y: k.y - 20, text: k.color === 'blue' ? 'Llave azul' : 'Llave roja', t: 80,
        color: KEY_COLORS[k.color].mid });
      guardKeys.splice(i, 1);
    }
  }
}

// Llave de color (en el suelo, en la puerta o en el HUD)
function drawColorKey(x, y, color, scale = 1, rot = 0) {
  const c = KEY_COLORS[color];
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
  const g = ctx.createLinearGradient(0, -10, 0, 10);
  g.addColorStop(0, c.light); g.addColorStop(0.45, c.mid); g.addColorStop(1, c.dark);
  ctx.strokeStyle = g; ctx.lineWidth = 4.5;
  ctx.beginPath(); ctx.arc(-8, 0, 8.5, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(-1, -3, 22, 6, 2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(12, 2, 4, 8, 1); ctx.fill();
  ctx.beginPath(); ctx.roundRect(18, 2, 3, 6, 1); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(1, -2.4, 18, 1.2);
  ctx.fillStyle = c.light; ctx.beginPath(); ctx.arc(-8, 0, 3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawGuardKeys() {
  if (currentRoom !== 13) return;
  for (const k of guardKeys) {
    const y = k.y + Math.sin(k.bob) * 6, c = KEY_COLORS[k.color];
    const g = ctx.createRadialGradient(k.x, y, 0, k.x, y, 32);
    g.addColorStop(0, `rgba(${c.glow},0.55)`); g.addColorStop(1, `rgba(${c.glow},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(k.x, y, 32, 0, Math.PI * 2); ctx.fill();
    drawColorKey(k.x, y, k.color, 1, Math.sin(k.bob * 0.7) * 0.15);
  }
}

// Puerta doble de hierro con dos cerraduras (azul y roja)
const CASTLE_DOOR = { x: 900, y: 360, w: 60, h: 120 };
function drawCastleDoor() {
  if (currentRoom !== 13) return;
  const d = CASTLE_DOOR, t = Date.now() * 0.003;
  ctx.save();
  // arco de piedra
  ctx.fillStyle = '#4a4552';
  ctx.beginPath(); ctx.moveTo(d.x - 10, d.y + d.h); ctx.lineTo(d.x - 10, d.y + 10);
  ctx.quadraticCurveTo(d.x + d.w / 2, d.y - 34, d.x + d.w + 10, d.y + 10); ctx.lineTo(d.x + d.w + 10, d.y + d.h); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#05040a';
  ctx.beginPath(); ctx.moveTo(d.x, d.y + d.h); ctx.lineTo(d.x, d.y + 12);
  ctx.quadraticCurveTo(d.x + d.w / 2, d.y - 20, d.x + d.w, d.y + 12); ctx.lineTo(d.x + d.w, d.y + d.h); ctx.closePath(); ctx.fill();
  if (castleDoorOpen) {
    // puerta abierta: luz de luna del otro lado
    const lg = ctx.createLinearGradient(d.x, 0, d.x + d.w, 0);
    lg.addColorStop(0, 'rgba(170,190,255,0.08)'); lg.addColorStop(1, `rgba(170,190,255,${(0.35 + 0.1 * Math.sin(t)).toFixed(2)})`);
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.moveTo(d.x, d.y + d.h); ctx.lineTo(d.x, d.y + 12);
    ctx.quadraticCurveTo(d.x + d.w / 2, d.y - 20, d.x + d.w, d.y + 12); ctx.lineTo(d.x + d.w, d.y + d.h); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2a2030'; ctx.fillRect(d.x - 2, d.y + 14, 8, d.h - 14); // hoja abierta
  } else {
    const ig = ctx.createLinearGradient(d.x, 0, d.x + d.w, 0);
    ig.addColorStop(0, '#2e2a36'); ig.addColorStop(0.5, '#4a4656'); ig.addColorStop(1, '#2a2632');
    ctx.fillStyle = ig;
    ctx.beginPath(); ctx.moveTo(d.x + 3, d.y + d.h); ctx.lineTo(d.x + 3, d.y + 14);
    ctx.quadraticCurveTo(d.x + d.w / 2, d.y - 16, d.x + d.w - 3, d.y + 14); ctx.lineTo(d.x + d.w - 3, d.y + d.h); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(d.x + d.w / 2, d.y + 2); ctx.lineTo(d.x + d.w / 2, d.y + d.h); ctx.stroke();
    // remaches
    ctx.fillStyle = '#7a7686';
    for (let y = d.y + 26; y < d.y + d.h; y += 22) for (const x of [d.x + 9, d.x + d.w - 9]) {
      ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill();
    }
    // cerraduras: brillan si ya tienes esa llave
    for (const [col, cx] of [['blue', d.x + d.w / 2 - 12], ['red', d.x + d.w / 2 + 12]]) {
      const c = KEY_COLORS[col], cy = d.y + 64, on = keysHeld[col];
      if (on) {
        const gl = ctx.createRadialGradient(cx, cy, 0, cx, cy, 18);
        gl.addColorStop(0, `rgba(${c.glow},${(0.5 + 0.3 * Math.sin(t * 2)).toFixed(2)})`); gl.addColorStop(1, `rgba(${c.glow},0)`);
        ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(cx, cy, 18, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = c.mid; ctx.beginPath(); ctx.roundRect(cx - 7, cy - 9, 14, 18, 4); ctx.fill();
      ctx.fillStyle = '#0a0a10'; ctx.beginPath(); ctx.arc(cx, cy - 2, 2.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(cx - 1.2, cy - 1, 2.4, 6);
    }
  }
  ctx.restore();
}
