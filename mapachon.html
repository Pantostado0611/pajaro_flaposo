<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mapachón - Explorador de Ruinas</title>
<link rel="stylesheet" href="mapachon-juego/estilo.css">
</head>
<body>
<div id="game-wrap">
<canvas id="c" width="960" height="540"></canvas>
<div id="controls">WASD / FLECHAS: mover &nbsp;|&nbsp; ESPACIO: saltar &nbsp;|&nbsp; Z / J: atacar &nbsp;|&nbsp; Llega al borde para cambiar sala</div>
</div>
<div id="touch-controls">
  <div class="t-btn" id="btn-left">◀</div>
  <div class="t-btn" id="btn-right">▶</div>
  <div class="t-btn" id="btn-attack">⚔</div>
  <div class="t-btn" id="btn-shoot">🏹</div>
  <div class="t-btn" id="btn-jump">▲</div>
  <div class="t-btn" id="btn-inv">📦</div>
  <div class="t-btn" id="btn-cheat">🔑</div>
  <div class="t-btn" id="btn-music">🔊</div>
  <div class="t-btn" id="btn-pause">⏸</div>
</div>

<div id="cheat-numpad">
  <div class="np-btn" data-d="1">1</div>
  <div class="np-btn" data-d="2">2</div>
  <div class="np-btn" data-d="3">3</div>
  <div class="np-btn" data-d="4">4</div>
  <div class="np-btn" data-d="5">5</div>
  <div class="np-btn" data-d="6">6</div>
  <div class="np-btn" data-d="7">7</div>
  <div class="np-btn" data-d="8">8</div>
  <div class="np-btn" data-d="9">9</div>
  <div class="np-btn" id="np-del">⌫</div>
  <div class="np-btn" data-d="0">0</div>
  <div class="np-btn" id="np-esc">✕</div>
</div>
<!-- El juego está repartido en varios archivos dentro de mapachon-juego/. El orden importa:
     cada archivo puede usar lo que definen los de antes. -->
<script src="mapachon-juego/salas.js"></script>
<script src="mapachon-juego/decoracion.js"></script>
<script src="mapachon-juego/jugador.js"></script>
<script src="mapachon-juego/controles.js"></script>
<script src="mapachon-juego/estado.js"></script>
<script src="mapachon-juego/actualizar.js"></script>
<script src="mapachon-juego/enemigos.js"></script>
<script src="mapachon-juego/jefes.js"></script>
<script src="mapachon-juego/coloso.js"></script>
<script src="mapachon-juego/guardias.js"></script>
<script src="mapachon-juego/llave-y-guardian.js"></script>
<script src="mapachon-juego/dibujo.js"></script>
<script src="mapachon-juego/ayudas-dibujo.js"></script>
<script src="mapachon-juego/mapa.js"></script>
<script src="mapachon-juego/trucos.js"></script>
<script src="mapachon-juego/tienda.js"></script>
<script src="mapachon-juego/bancos.js"></script>
<script src="mapachon-juego/personajes.js"></script>
<script src="mapachon-juego/menu.js"></script>
<script src="mapachon-juego/titulo.js"></script>
<script src="mapachon-juego/musica.js"></script>
<script src="mapachon-juego/principal.js"></script>
</body>
</html>
